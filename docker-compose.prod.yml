# Production Compose manifest for the Netcup VPS Lite 2 G12s VM (v1.2 Infra Migration, Phase 5).
# Originally written against an Oracle Cloud A1 Flex target; the deploy target pivoted after
# Oracle's eu-zurich-1 capacity shortage proved structural -- see 05-03 HANDOFF/SUMMARY for the
# full rationale. Netcup is x86_64/4 vCPU/8GB, not Oracle's ARM64/2 OCPU/12GB.
#
# This is a STANDALONE file, not an overlay on docker-compose.yml (local dev). The two files'
# service sets differ in shape (this file adds `caddy` for automatic public HTTPS), but as of
# phase 11 (2026-08-26) they share the same database engine: this file now defines the `postgres`
# service that Neon previously replaced -- one self-hosted postgres:16 container serving TWO
# databases (production's own `kanban_prod` and, per D-01, nonprod's `kanban_nonprod` too) with
# two least-privilege roles, reached by both this project's `app` and
# docker-compose.nonprod.yml's `app-nonprod` across the shared external `kanban-db` network. See
# 11-01-PLAN.md's design_alternatives for the full reasoning behind colocating both environments'
# database on one shared instance rather than two separate containers.
#
# Deploy usage (manual, plan 05-04): `docker compose -f docker-compose.prod.yml --env-file
# .env.prod up -d` from the VM, after copying this file, Caddyfile, and a real .env.prod (never
# committed -- see .env.prod) onto the VM.

x-logging: &default-logging
  # Docker rotates rather than grows at these limits: total on-disk log bytes per container is
  # bounded by max-size * max-file, and the oldest rotated file is deleted at rotation rather than
  # accumulating. Worst case per container here: 10m * "3" = 30MB. Applied to all three services
  # below via this one anchor (not copy-pasted per service) so a future added service cannot
  # silently be missed -- the acceptance check is that no service lacks a logging block, not that
  # at least one has one, since a single uncapped service fills the free-tier disk regardless of
  # the others' caps (T-05-10). max-size carries Docker's documented unit suffix and max-file is a
  # quoted string -- an unsuffixed size or unquoted count is accepted by Compose's parser but
  # misinterpreted or rejected by the daemon.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Pinned so `docker compose` commands converge on the same project regardless of which directory
# the file happens to live in on the host -- without this, Compose derives the project name from
# the CWD basename, so a file moved between directories (as happened when plan 05-05 relocated
# this from /root to a dedicated /opt/deploy/kanban-board-backend deploy-user directory) silently
# starts a second, unrelated project instead of recognizing the already-running containers.
name: kanban-board-backend

# Added plan 08-01 (v1.3, Phase 8): a single Caddy process is the only thing that may bind host
# 80/443, and it must additionally reach app-nonprod -- a service that lives in a DIFFERENT
# Compose project by design (NONPROD-01's identity-isolation requirement forbids sharing this
# project). Compose's implicit per-project default network cannot cross that boundary, so an
# externally-created network, created once via `docker network create kanban-edge` and joined by
# both this file's `caddy` service and docker-compose.nonprod.yml's `app-nonprod` service, bridges
# the two projects. This is the ONLY thing the two stacks share -- production's own `app` and
# `redpanda` do not join it.
#
# Added phase 11 (v1.3->v1.4 boundary, plan 11-01): `kanban-db` is the SECOND thing the two
# projects share -- mirrors kanban-edge's shape exactly. Created once via `docker network create
# kanban-db`, joined by this file's `postgres` service and, in docker-compose.nonprod.yml, by
# `app-nonprod` only -- never by `caddy`, `app`, or `redpanda` in this file, and never by
# `redpanda-nonprod` in the other.
networks:
  default:
  kanban-edge:
    external: true
    name: kanban-edge
  kanban-db:
    external: true
    name: kanban-db

services:
  caddy:
    # Custom, pinned image (quick task 260903-dvp, D-4/D-5) -- replaces the floating `caddy:2`,
    # carrying the SHA-pinned edge rate limiter (see docker/caddy/Dockerfile). Built and pushed by
    # CI's `build-and-push-caddy-image` job (.github/workflows/deploy.yml), never built on this VM.
    #
    # Why this tag is a literal while `app`'s below is `${IMAGE_TAG}`, dated 2026-09-03: `app`'s
    # reference must resolve anew every commit -- this one must NOT, because a reference that
    # changes per commit would recreate the edge on every deploy and invert the "left running,
    # no-op not a restart" behaviour docs/INFRA_ARCHITECTURE.md and infra-delivery-scenario.mmd
    # both document. A literal also means a hand-run `docker compose up -d` on the VM needs no
    # exported variable.
    #
    # This literal is not hand-maintained: scripts/verify-caddy-image-tag.py recomputes it from
    # docker/caddy/Dockerfile and CI refuses to build the Caddy image when they disagree. The
    # consequence a future reader will actually hit: a Dependabot Caddy-base bump PR will fail
    # that gate until this line is updated in the same PR -- that failure is the gate working, not
    # a flaky check.
    image: rudenkovladimir/kanban-board-caddy:2.11.4-rl5625512f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      # `default` must be listed explicitly -- once a service declares any `networks:` key it no
      # longer implicitly joins the default network, and dropping it here would sever caddy -> app.
      - default
      - kanban-edge
    environment:
      # Consumed by Caddyfile's {$APP_DOMAIN} placeholder (D-01: free subdomain, chosen at
      # execution time in plan 05-03). Swapping to a paid domain later only requires changing this
      # value and the DNS record -- no application change.
      APP_DOMAIN: ${APP_DOMAIN}
      # Consumed by Caddyfile's second site block ({$APP_DOMAIN_NONPROD}, added plan 08-01) --
      # the nonprod hostname, D-05.
      APP_DOMAIN_NONPROD: ${APP_DOMAIN_NONPROD}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes (not bind mounts, not ephemeral) so container recreation reuses the existing
      # Let's Encrypt certificate instead of requesting a new one. Repeated re-requests trigger a
      # week-long Let's Encrypt rate-limit ban (T-05-12).
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging

  postgres:
    # D-02: same tag local dev (docker-compose.yml) and the Testcontainers-backed test suite
    # already run -- one Postgres version tested across every environment, not a separately
    # drifting production version.
    image: postgres:16
    hostname: postgres
    restart: unless-stopped
    # MEASURED BASIS (Plan 11-03, 2026-08-26) -- host: Netcup VPS Lite 2 G12s, 4 vCPU / 7.8GiB
    # measured. Workload: the repo's established 54-request burst (6 columns + 24 tasks + 24
    # subtasks, after signup+board) fired against BOTH environments concurrently in the same rung
    # (both HikariCP pools open at once, since per-backend private memory scales with the
    # connection high-water mark), plus a nonprod admin reset (TRUNCATEs everything) and a full
    # `app` recreate that re-runs Flyway V1..V8 -- the two paths most likely to set Postgres's
    # transient peak, which a pure read/write burst never touches.
    # Ladder descended from the prior unmeasured 512m Iteration-0 baseline: 512m -> 384m -> 320m ->
    # 256m -> 192m -> 128m -> 64m -> 40m all PASSED (RestartCount=0 sustained across a full
    # recreate+burst+20s-settle cycle at every rung; peak RSS held flat at ~29-30MiB regardless of
    # cap, since this app's real traffic shape never grows Postgres's working set). 32m FAILED:
    # the kernel OOM-killed the postgres process itself 3 times in ~30s (confirmed via `dmesg`:
    # "Memory cgroup out of memory: Killed process ... (postgres)"), each kill forcing a full
    # cluster crash-recovery restart (RestartCount=3) and producing real HTTP 500s on the live
    # public API during the outage window -- not a synthetic/theoretical failure.
    # Adopted: 64m, NOT the bare lowest-passing rung (40m only left ~10MiB headroom above its
    # ~29.7MiB measured peak -- too thin given 32m's cliff sits just 8MiB below that). 64m leaves
    # ~35MiB headroom above the measured ~29.2MiB peak (~54% margin), independently re-verified
    # from a fresh --force-recreate through a full reset+burst+20s-settle cycle with
    # RestartCount=0 sustained throughout. This is the same "deliberately NOT set equal to the
    # measured high-water mark" reasoning the redpanda service's own comment below applies -- a
    # cap with zero headroom budgets nothing for cgroup accounting overhead, which has already
    # broken startup once on this box for a different service (Plan 08-03's 96M Redpanda rung).
    # shared_buffers/work_mem/max_connections: the ladder gave no evidence to change any of
    # them -- peak RSS never approached shared_buffers' own 128MB allocation at any rung, so
    # D-11's conservative profile stands unchanged, explicitly re-examined rather than
    # unexamined. Full rung-by-rung ladder, the failing rung's verbatim OOM evidence, and the
    # independent re-verification: docs/INFRA_RUNBOOK.md, "Self-hosted Postgres resource
    # measurement -- Plan 11-03".
    #
    # CORRECTION (Plan 11-08, 2026-08-26) -- the pairing directly above (a 64m cap paired with
    # shared_buffers=128MB, then in force) was internally inconsistent: the engine's own startup
    # allocation was double the cgroup ceiling meant to bound it. This closes 11-REVIEW.md's
    # CR-02 and 11-VERIFICATION.md's gap 1. The 11-03 ladder above could not have caught this --
    # it fired a sequential burst against a ~55-row dataset, and Linux cgroup accounting only
    # charges a page once something touches it, so a dataset that small touches only a few
    # megabytes of the buffer pool regardless of shared_buffers' own declared size. Peak RSS
    # sitting flat at ~29-30MiB from 512m down to 40m was evidence about the dataset, not about
    # the cap.
    #
    # Why the ceiling had to move rather than only shared_buffers: at max_connections=25 and
    # work_mem=4MB, max_connections x work_mem alone is 100MB -- no shared_buffers value, not
    # even zero, makes a 64m ceiling consistent with this connection profile. The invariant is
    # mechanically enforced by `scripts/verify-postgres-memory-invariant.py` (committed,
    # re-runnable -- not merely asserted here): (1) shared_buffers is at most a quarter of
    # mem_limit -- 64MB <= 256MB/4 = 64MB; (2) shared_buffers + max_connections * work_mem fits
    # within 85% of mem_limit -- 64MB + 25*4MB = 164MB <= 0.85*256MB = 217.6MB (64.1% of the
    # cap). Both hold for the adopted pair below, and both fail on the pre-fix pair, which is
    # what makes the script a real gate rather than a restated comment (11-REVIEW.md CR-01,
    # regenerated review: the earlier claim of "this plan's verify script" referred to a Python
    # heredoc that ran once during 11-08's execution and was never committed -- fixed here).
    #
    # Concurrent re-validation (full evidence: docs/INFRA_RUNBOOK.md, "Postgres memory profile
    # correction -- Plan 11-08"): the combined worst-case sub-run reached 24 concurrent backends
    # (21 non-idle) against a scratch pgbench dataset sized at ~127MB (scale factor 8, chosen to
    # comfortably exceed shared_buffers=64MB so the buffer pool was genuinely exercised, not
    # merely allocated). Sampled `docker stats` peak was 230.9MiB (90.2% of the 256m cap); the
    # cgroup memory.peak counter also read ~100% of the cap at every tested size (256m and 384m
    # alike) -- this is normal page-cache saturation under sustained I/O, not imminent OOM risk,
    # confirmed by the memory.stat breakdown: reclaimable file-backed cache dominated the total
    # (208-349MB across runs) while the genuinely irreclaimable anon+shmem -- the only memory that
    # can actually force an OOM-kill -- held essentially constant at ~84MB regardless of cap or
    # dataset size. Read against anon+shmem, the adopted 256m cap carries 84MB of irreclaimable
    # demand, 32.8% of the cap, comfortably under this plan's 60% gate; the raw cgroup total is
    # not the number to trust for that gate under a benchmark that deliberately drives sustained
    # I/O. Counter-evidence: the unfixed 64m/shared_buffers=128MB pairing was reproduced live
    # under the same combined workload (during initial scratch-database setup, before the
    # choreographed sub-runs even began) and the kernel OOM-killer killed the postgres process
    # (`dmesg -T`: "Memory cgroup out of memory: Killed process ... (postgres) ...
    # constraint=CONSTRAINT_MEMCG") -- proving CR-02 was a live defect, not a theoretical one.
    # Postgres's own crash recovery absorbed it (RestartCount stayed 0 -- a killed backend, not
    # the container's PID 1); both public health endpoints and both databases' 8/8 Flyway rows
    # were unaffected throughout.
    #
    # The profile stays conservative in D-11's sense: shared_buffers went DOWN (128MB -> 64MB,
    # now half the engine's own stock 128MB default), and work_mem/max_connections are untouched
    # by design -- not raised, not re-examined away.
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASS}
      # Set explicitly so the image does not create a stray database named after the superuser
      # (POSTGRES_DB defaults to POSTGRES_USER's value when unset).
      POSTGRES_DB: postgres
      PROD_DB_NAME: ${DB_NAME}
      PROD_DB_USER: ${DB_USER}
      PROD_DB_PASS: ${DB_PASS}
      # D-01's accepted consequence (RESEARCH.md Pitfall 5): this shared instance's init script
      # needs BOTH environments' credentials at first boot, but it is defined in production's own
      # Compose project -- so this one file now also carries nonprod's DB credentials. Named with
      # the NONPROD_ prefix specifically so a future reader or access review reads this as a
      # deliberate, accepted design decision, not a leak. NONPROD_DB_PASS here and DB_PASS in
      # .env.nonprod must hold the identical value.
      NONPROD_DB_NAME: ${NONPROD_DB_NAME}
      NONPROD_DB_USER: ${NONPROD_DB_USER}
      NONPROD_DB_PASS: ${NONPROD_DB_PASS}
    # D-11: deliberately the engine's own small built-in defaults plus a max_connections well
    # below the stock 100 -- NOT the commonly-cited 25%-of-RAM shared_buffers guidance, which is
    # scoped to a dedicated database server. This box is a shared 4-vCPU/7.8G VPS already running
    # a JVM app and a Kafka broker; total real demand is two HikariCP pools at
    # maximum-pool-size=5 (10) plus one CI Flyway one-off plus an occasional admin psql --
    # comfortable headroom under 25, stated explicitly rather than left as an invisible default.
    #
    # CORRECTED (Plan 11-08, 2026-08-26): shared_buffers halved from 128MB to 64MB -- half the
    # engine's own stock default, strictly more conservative than before -- so that it is at most
    # a quarter of the mem_limit above and, together with max_connections x work_mem, fits within
    # 85% of that cap (the invariant stated and enforced above mem_limit). work_mem and
    # max_connections are unchanged by design; only shared_buffers moved, and it moved down.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=25
    networks:
      # `default` must be listed explicitly -- once a service declares any `networks:` key it no
      # longer implicitly joins the default network, and dropping it here would sever production's
      # own app -> postgres path.
      - default
      - kanban-db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    # No `ports:` entry at all (D-03) -- mirrors redpanda's own posture exactly: nothing is
    # published to the host, admin access is SSH + `docker exec`.
    healthcheck:
      # -h 127.0.0.1 is load-bearing: during initialization the image's entrypoint runs a
      # temporary server with listen_addresses empty, so a socket-based probe (bare `pg_isready`
      # with no -h) can report ready while the init scripts are still running. Forcing TCP means
      # healthy cannot be reached until the real server is listening -- which is exactly what
      # production's `app` depends_on: service_healthy (Task 2) relies on. Inside a Compose
      # CMD-SHELL string, shell variables need a doubled dollar sign so Compose passes them
      # through to the container's shell instead of interpolating them at parse time.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 20s
    logging: *default-logging

  app:
    # Pulled by tag from Docker Hub -- the VM has no source checkout to build from. IMAGE_TAG is
    # set by the human during plan 05-04's manual deploy and, later, by the CI/CD pipeline
    # (plan 05-05) after a successful build-and-push.
    image: rudenkovladimir/kanban-board-backend:${IMAGE_TAG}
    restart: unless-stopped
    # Explicit memory ceiling. The JVM has been container-aware since JDK 10
    # (UseContainerSupport on by default, MaxRAMPercentage=25% with no explicit -Xmx set --
    # confirmed by the absence of -Xmx anywhere in Dockerfile/this file), but that only sizes the
    # heap against a real bounded number if the container actually HAS a memory limit. Without
    # this line the cgroup limit the JVM reads back defaults to the host's full measured 7.8GiB,
    # not a bounded slice -- 25% of that is already ~2GB of heap alone, before any non-heap JVM
    # overhead (metaspace, thread stacks, JIT code cache, direct buffers), which would already
    # exceed the headroom the redpanda service's command comment below claims. 3g here caps the
    # JVM's own 25%-of-container default heap at ~768MB, leaving real headroom inside the
    # container for non-heap overhead, and leaving Caddy + the OS their own real share of the
    # 7.8GiB host total alongside redpanda's 2G cap -- see that comment for the full budget math.
    # This does not replace Task 3's own measure-under-load pass (05-04-PLAN.md Task 3) -- that
    # still tunes these numbers against real observed usage; this only makes the container
    # boundary the JVM sizes against match what the comment already claimed.
    #
    # RE-MEASURED (Plan 11-03, D-10, 2026-08-26): re-examined because the datasource moved from a
    # public-internet round trip (Neon) to a Docker bridge hop (self-hosted postgres), which could
    # in principle change this container's own working set. At the then-adopted postgres floor
    # (64m, later corrected to 256m by Plan 11-08 -- see that service's own CORRECTION comment
    # above), idle RSS ~428-436MiB and peak RSS ~436MiB during the full burst+Flyway-recreate
    # workload -- ~14.2% of this 3g cap, essentially unchanged from the latency-profile shift.
    # Verdict: KEPT at 3g, not lowered. The measured peak sits far below the cap under this
    # synthetic burst, but the JVM's own heap sizing (MaxRAMPercentage=25%, see above) is derived
    # FROM this cgroup limit -- lowering it would shrink the JVM's usable heap under real,
    # non-synthetic traffic patterns this measurement's light dataset cannot exercise, unlike
    # postgres's cgroup accounting, which is largely traffic-shape-independent. This is a
    # deliberate, evidence-backed decision not to descend this cap in the same live session that
    # already restarted the shared database nine times, not an unexamined value.
    mem_limit: 3g
    depends_on:
      redpanda:
        condition: service_healthy
      # Added phase 11 (plan 11-01): not cosmetic. This app boots Flyway against the datasource
      # during startup, so starting before the database accepts connections turns a cold VM boot
      # into a restart loop rather than a clean start.
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      # Removed 2026-08-26 (phase 11, plan 11-01): the Neon-era JDBC query-string override is gone
      # because the connection no longer crosses the public internet, no PgBouncer sits in front
      # of the engine, and the self-hosted target has no TLS listener configured -- so the app now
      # falls back to application.properties' own local-safe query-string default
      # (prepareThreshold=0 alone). Falsifiable: if a TLS listener is ever configured on this
      # container, this decision is what has to be revisited.
      # planner-discipline-allow: DB_JDBC_PARAMS
      # Internal Docker network only -- no host port is published for either, matching the local
      # dev naming exactly (docker-compose.yml) so no application config diverges between
      # environments.
      KAFKA_BOOTSTRAP_SERVERS: redpanda:19092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
    # No `ports:` entry -- Caddy reaches this container over the internal Compose network by
    # service name (app:8080) only. Publishing 8080 here would offer the whole API over plain
    # HTTP, bypassing Caddy's TLS termination entirely (T-05-08, INFRA-04).
    healthcheck:
      # Asserts the aggregate status is UP, not merely that some response arrived -- a check that
      # returns success while the database is unreachable is the failure mode T-05-06 names and
      # this plan's own prohibition forbids. The runtime image (eclipse-temurin:21-jre-jammy)
      # already ships wget, curl and bash, so no Dockerfile change is needed.
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:8080/api/actuator/health | grep -q '\"status\":\"UP\"' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redpanda:
    # Same pinned version as the local dev stack (docker-compose.yml) -- production and the
    # Phase 4-verified local environment must not become two undertested broker versions.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    hostname: redpanda
    restart: unless-stopped
    # Docker-level cgroup backstop added 05-04 Task 3, matching the app service's own
    # `mem_limit: 3g` above -- previously the ONLY memory ceiling on this container was
    # Redpanda's own internal `--memory 2G` accounting below (Seastar's own allocator), with no
    # cgroup limit behind it. A leak or accounting gap inside Redpanda's own self-cap had no
    # second backstop, unlike the app -- 05-RESEARCH.md's Pitfall 1 explicitly recommends cgroup
    # limits on BOTH co-resident containers, not just one.
    #
    # Deliberately NOT set equal to `--memory 2G` below -- tried that first and it broke startup:
    # `Could not initialize seastar: std::runtime_error (insufficient physical memory: needed
    # 2147483648 available 2078277632)`. A cgroup limit numerically equal to Seastar's own
    # requested usable memory leaves no room for the cgroup accounting overhead (other
    # in-container processes, kernel-side slab/page accounting) that a byte-for-byte-equal cap
    # doesn't budget for -- Seastar's own probe saw ~66MiB less than the 2048MiB it asked for
    # and refused to start rather than silently run smaller. 2200m gives that headroom back
    # (~150MiB above the internal request) while still being a real backstop, not a no-op --
    # confirmed by a live restart after this fix: `(healthy)` within the existing 15s
    # start_period, per Task 3's own re-verification below.
    mem_limit: 2200m
    command:
      - redpanda
      - start
      # Explicit resource caps -- deliberately NOT `--mode dev-container` (the local dev preset
      # that relaxes resource discipline for developer convenience; carrying it into production
      # would let Redpanda assume it owns the whole VM, a real OOM path alongside the co-resident
      # app JVM, T-05-11).
      #
      # MEASURED BASIS (05-04 Task 3, 2026-08-16) -- these values are no longer a budget-math
      # floor pending verification; they are now measured against the real deploy target and a
      # real workload. Shape: Netcup VPS Lite 2 G12s, 4 vCPU / 7.8GiB RAM measured (05-03).
      # Workload: a 54-request burst fired in rapid sequential succession through the public
      # HTTPS API against this live production stack (6 columns + 24 tasks + 24 subtasks), each
      # mutation producing a real Avro-serialized Kafka publish against this production registry
      # and a real consumer-side persist -- not an idle-stack measurement.
      #   - Idle baseline: redpanda 347.8MiB RSS / 0.43% CPU (of its 2G internal cap, ~17%); app
      #     458.6MiB / 0.26% CPU (of its 3g mem_limit, ~14.9%); caddy 19.9MiB / 0.00% CPU; host
      #     1.3GiB used / 6.4GiB available of 7.8GiB total.
      #   - Under burst (6 samples across the run): redpanda CPU peaked 7.3-8.6% -- `--smp 1`
      #     pins it to one logical core, so this is a small fraction even of that single core's
      #     ceiling, not the host's 4; RSS never moved off 347.8MiB. App CPU peaked 3.5-6.2%; RSS
      #     grew ~12MiB (458.6MiB -> 471.1MiB, ~15.3% of its 3g limit). Caddy stayed flat
      #     (~20MiB, <0.2% CPU). Host `available` memory was unchanged at 6.4GiB after the burst
      #     -- this app's real traffic shape (a personal/portfolio kanban board) does not move
      #     the needle at the host level at all.
      #   - Conclusion: redpanda used under 18% of its memory cap and a small fraction of its
      #     single-core CPU ceiling even under this burst, so the `--smp`/`--memory` values below
      #     were left UNCHANGED -- tightening further would trade away real broker headroom for a
      #     benefit no measurement supports, and loosening them is exactly what this plan's own
      #     prohibition forbids doing without a measured reason. The prior budget math (redpanda
      #     2G + app 3G = 5G, leaving 2.8G of the 7.8GiB host for Caddy + the OS) is now
      #     measurement-verified rather than merely asserted -- and with the new `mem_limit:
      #     2200m` cgroup backstop above (also this task, see its own comment for why it isn't
      #     numerically 2G), the real worst-case host budget is 3G (app) + 2200m (redpanda) =
      #     ~5.15G, leaving ~2.65GiB of the measured 7.8GiB for Caddy + the OS -- still genuine
      #     headroom, now against the tighter of the two figures rather than the looser one. No
      #     memory- or CPU-constrained finding surfaced -- there is nothing here to work around.
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 2G
      - --schema-registry-addr
      - 0.0.0.0:8081
      # Single internal-only Kafka listener -- no external listener, no host port publication.
      # 9092/19092 must never be internet-facing (INFRA-08, T-05-07).
      - --kafka-addr
      - internal://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:19092
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --default-log-level=info
    # No `ports:` entry at all -- neither the Kafka listener nor the Schema Registry is published
    # to the host. The app and Caddy reach this service only over the internal Compose network.
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 15s
    logging: *default-logging

volumes:
  redpanda-data:
  caddy-data:
  caddy-config:
  postgres-data:
