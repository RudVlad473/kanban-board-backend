# === application ===
spring.application.name=kanban-board

# === servlet ===
server.servlet.context-path=/api

# === graceful shutdown ===
# Spring Boot's default is immediate shutdown -- in-flight requests get dropped the instant SIGTERM
# arrives. docker-compose.prod.yml's `restart: unless-stopped` means every redeploy/restart sends
# SIGTERM to this container, so this is not a theoretical concern in production. `graceful` makes
# the embedded web server stop accepting new requests but let in-flight ones complete first.
# timeout-per-shutdown-phase bounds how long that grace period lasts -- 8s, comfortably under
# Docker's own default 10s stop grace period (after which it sends SIGKILL), so the graceful phase
# always has a chance to finish before Docker forcibly kills the process rather than being cut off
# mid-drain by the timeout that already existed anyway.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s

# === swagger ===
springdoc.api-docs.path=/docs

# === actuator ===
# Backs the production Docker healthcheck (INFRA-01) -- the include list below is an allowlist,
# not a default to widen. `health` is the ONLY value permitted: Caddy proxies this path publicly
# (Phase 5), so a wider list (or the framework default of a bare `*`) would publish `/env`,
# `/beans` and `/heapdump` -- the entire JVM heap, including the JDBC password, the session store
# and bcrypt hashes -- to the internet. show-details=never additionally keeps the health response
# body itself from leaking the datasource URL/driver/validation query to an unauthenticated caller.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jpa.show-sql=false

# === datasource ===
# DB_PORT defaults to 5432, reproducing the previous hardcoded value exactly -- the compose `app`
# service and .github/workflows/deploy.yml both never set DB_PORT, so neither changes behavior.
# DB_PORT exists for JVMs run on the HOST -- specifically the rehearseHistoricalSchemas Gradle
# task, the only task that resolves this file's datasource instead of the test profile's H2 URL
# -- which must target the compose Postgres's host-published port (see docker-compose.yml).
#
# DB_JDBC_PARAMS is REMOVED (phase 11, plan 11-04, D-09), not merely re-defaulted -- both of its
# two jobs are gone now that the datasource is a same-host container rather than a public-internet
# hop to Neon. TLS/channel-binding parameters have no server to negotiate with: this container has
# no TLS listener configured, and a client demanding SSL against a plaintext listener is a hard
# connection failure, not a silent downgrade, and it presents with the identical
# acquisition-timeout signature the 2026-08-26 Neon incident already produced once (see the Hikari
# decision record below). The prepareThreshold=0 PgBouncer workaround has no transaction-mode
# pooler left in the path to work around; its removal is smoke-tested against a real instance by
# 11-04-PLAN.md Task 2, not merely assumed from this reasoning (see that task's outcome, recorded
# at the end of the Hikari decision record below). Falsifiable: re-adding an override hook is a
# one-line change if a pooler or a TLS listener is ever placed back in front of this datasource,
# so removing it now is cheap to reverse.
# planner-discipline-allow: DB_JDBC_PARAMS
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# === datasource pool (HikariCP) ===
# Sized explicitly for a same-host PostgreSQL container (phase 11, D-09), rather than left at
# Hikari's undocumented default -- every value below carries its own reason, not a guess. This
# supersedes the Neon-era reasoning entirely; see the two dated decision records below for what
# changed and why.
# - maximum-pool-size=5: two application containers (`app`, `app-nonprod`) now share one engine
#   configured with max_connections=25 (plan 11-01, D-11). Worst case is 5 + 5 = 10 application
#   connections, plus one CI Flyway migration one-off, plus an occasional administrative psql
#   session -- roughly 2x headroom under the engine's ceiling. A change to either this value or
#   docker-compose.prod.yml's max_connections is now visibly coupled to the other by name.
# - minimum-idle=2: a same-host container has no usage meter, no autosuspend timer, and nothing to
#   wake, so the Neon-era floor of zero now buys nothing and only costs a TCP connect plus a SCRAM
#   handshake on the first request after any idle period. Must stay explicit -- Hikari's own
#   validation coerces an unset value to maximum-pool-size, which would silently hold five
#   permanently warm connections per app rather than two.
# - connection-timeout=10000 (10s): a same-host engine either answers a connection request in
#   single-digit milliseconds or is genuinely unavailable, so the old 30s Neon-cold-start value
#   would now convert a real outage into a thirty-second request hang -- the exact user-visible
#   symptom the 2026-08-26 incident record documents. 10s is far above any healthy same-host
#   acquisition and still leaves room for the one case where waiting is legitimate: a cold VM
#   boot, where `app-nonprod` cannot express a health dependency on this database because it lives
#   in a different Compose project, and briefly retries while the engine starts.
# - idle-timeout=600000 (10min) / max-lifetime=1800000 (30min): both become HikariCP's own library
#   defaults, stated explicitly rather than left implicit, per this file's convention. The old
#   10-minute max-lifetime was deliberately shorter than Neon's idle-connection reaping window;
#   there is no reaper in front of a same-host engine, so churning every connection every ten
#   minutes was pure overhead. The ordering constraint stays load-bearing and must stay explicit:
#   Hikari disables idle-timeout entirely, with only a startup warning, when the two values sit
#   too close together -- which is exactly why idle-timeout is stated explicitly here at all,
#   rather than left to interact silently with max-lifetime.
# - keepalive-time=120000 (2min): this is the value that directly caused the 2026-08-26 outage, by
#   issuing a query on every idle pooled connection every two minutes and thereby holding a
#   metered compute permanently awake. That mechanism does not exist for a container on the same
#   host -- there is no meter and nothing to keep awake -- so a periodic liveness probe is now
#   purely useful: it detects a connection the engine has dropped (a restart, an administrative
#   termination) before a real request discovers it. Must stay explicit -- deleting this line does
#   NOT disable keepalive, it restores HikariCP's own field-initializer default of 2 minutes
#   (verified against the library sources, not its Javadoc, in the decision record below).
#   Falsifiable: this reasoning depends on the datasource being same-host and unmetered -- if this
#   application is ever repointed at a metered or autosuspending database, this line is the first
#   one to revisit.
#
# Decisions ----------------------------------------------------------------------------------
# 2026-08-26: the always-warm-connection policy is REVERSED -- the compute must now be allowed to
# scale to zero. This supersedes INFRA-02's original rationale, which set minimum-idle=1 and
# keepalive-time=120000 precisely to defeat Neon's autosuspend and spare the next request a cold
# start. Do not restore either setting while this project is on Neon's Free plan.
#
# Why: nonprod and production are two branches of ONE Neon project, and the Free-plan compute
# allowance (100 CU-h/month) is per PROJECT, shared across every branch. Holding a warm connection
# billed both computes around the clock -- ~170 CU-h/month each, from Neon's own per-branch usage
# -- so the shared allowance was exhausted mid-month and Neon suspended the compute for BOTH
# environments at once. Every DB-touching request in both then failed on connection-timeout below
# until the quota reset. Full investigation: .planning/debug/resolved/admin-reset-500-nonprod.md.
#
# Why both settings had to change, not just the ping: an open but genuinely idle connection does
# not by itself hold a Neon compute awake -- only activity does, and every new connection request
# restarts Neon's scale-to-zero timer (https://neon.com/docs/introduction/scale-to-zero).
# keepalive-time was the direct offender, issuing a query every 2 minutes. But minimum-idle=1
# reaches the same outcome by another route: when Neon does suspend and drops the connection,
# Hikari's housekeeper sees the pool below its floor and immediately opens a replacement, which is
# itself the activity that wakes the compute again. minimum-idle=0 is what breaks that loop.
#
# Both zeroes were load-bearing FOR NEON, and both were verified against the HikariCP 6.3.3
# sources on 2026-08-26, because the intuitive edit here is silently wrong in two different ways:
# - HikariConfig line 55 sets DEFAULT_KEEPALIVE_TIME = MINUTES.toMillis(2). Keepalive is NOT
#   off-by-default in Hikari 6.x, so simply deleting the keepalive-time line reinstates the
#   offending 2-minute ping verbatim. HikariPool only skips scheduling KeepaliveTask under
#   `if (keepaliveTime > 0)` -- an explicit 0 is the only thing that disables it. Do not trust
#   HikariCP's own Javadoc on this: setKeepaliveTime's doc comment still claims "default is 0
#   (disabled)", which the field initializer in the same file contradicts.
# - HikariConfig's validation coerces an UNSET minimum-idle to maximum-pool-size, so deleting that
#   line would hold five warm connections instead of one. An explicit 0 survives validation
#   (`if (minIdle < 0 || minIdle > maxPoolSize)` does not match), and HikariPool's refill test
#   `idle < config.getMinimumIdle()` can then never fire. The same validation-coercion mechanism is
#   why minimum-idle stays an explicit assignment below too, at its new same-host value.
#
# Accepted cost (AT THE TIME, on Neon): the first request after an idle period paid Neon's cold
# start (documented as hundreds of ms, absorbed by connection-timeout=30000 then in force). Chosen
# over splitting the two environments into separate Neon projects, which would not have prevented
# recurrence -- at the always-on rate, each branch alone already exceeded a whole project's
# allowance.
#
# Falsifiable (AT THE TIME): if project usage again approached 100 CU-h/month while both
# environments sat idle overnight, this reasoning was wrong and something other than the pool was
# waking the compute. SUPERSEDED below -- this falsifiable condition can no longer fire, because
# there is no Neon compute left to wake.
# ---------------------------------------------------------------------------------------------
#
# 2026-08-26: SUPERSEDES the record above (phase 11, plan 11-04, D-09). The self-hosted Postgres
# migration (plans 11-01/11-02) removed every provider-specific mechanic the record above was
# reasoned against -- there is no cold start, no autosuspend timer, no per-project metered
# compute-hour allowance, and no idle-connection reaper in front of a container on the same host
# as this application. Carrying those values forward unexamined would have been wrong in the
# opposite direction from before: paying a real per-request cost (a fresh TCP connect + SCRAM
# handshake on minimum-idle=0, a 30s outage-to-hang conversion on the old connection-timeout,
# needless 10-minute connection churn) to defend against provider behavior that no longer exists.
#
# What changed and why (each value re-derived individually against this repo's own topology, not
# copied from generic tuning advice -- see 11-RESEARCH.md Assumption A1): maximum-pool-size stays
# 5, now justified against max_connections=25 shared by two app containers instead of a managed
# pooler's ceiling; minimum-idle rises 0 -> 2, since there is no meter to spare and no
# wake-the-compute side effect to avoid; connection-timeout drops 30000 -> 10000, since a same-host
# outage should surface fast rather than hang for the old cold-start allowance; idle-timeout rises
# 300000 -> 600000 and max-lifetime rises 600000 -> 1800000 (both now HikariCP's own defaults,
# stated explicitly), since there is no reaper to out-schedule; keepalive-time rises 0 -> 120000,
# since a periodic liveness probe is now purely useful (detects a dropped backend) rather than the
# exact mechanism that caused the outage above.
#
# Why the intuitive edit is still wrong: the two lines that are silently wrong if merely deleted
# (minimum-idle, keepalive-time) remain explicit assignments for the same library-validation
# reasons documented in the superseded record above -- that finding does not change with the
# value, only the number does.
#
# Accepted cost: two permanently warm connections per app container (minimum-idle=2) instead of
# zero, and up to 30 minutes of connection age (max-lifetime=1800000) instead of 10 -- both
# negligible against a same-host engine with no metering and no reaper, unlike on Neon.
#
# The prepared-statement threshold override (DB_JDBC_PARAMS' prepareThreshold=0, see the
# datasource URL comment above) was the one genuinely unverified change in this block: its removal
# was reasoned from "no transaction-mode pooler is in the path any more," not observed. Verified
# safe by 11-04-PLAN.md Task 2: a 25-iteration create/read(nested-full)/delete workload driven
# through the real signup/board API against a real same-host PostgreSQL 16 container, confirming
# server-side prepared-statement reuse actually engaged (a non-empty `pg_prepared_statements`,
# read before the restart below) and survived a mid-workload engine restart (10 further
# create/read/delete cycles), with no `PSQLException` about a prepared statement already existing
# or not existing at any point. Falsifiable: if that exception class ever appears in production
# logs, this removal is what to revisit first -- it would mean something in this stack still
# depends on the override for a reason nobody has identified yet.
# ---------------------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000

# === hibernate ===
# Division of labor (Flyway cutover, D-03): files under src/main/resources/db/migration/ are the
# only thing allowed to create or alter schema from here on. This setting only checks that the
# app's entity mappings agree with whatever schema Flyway already put in place at boot -- it never
# creates or alters anything itself. Neither side both creates and validates. A mismatch here is a
# loud SchemaManagementException at startup, not a silent auto-alter -- that tradeoff (a class of
# drift becomes a hard boot failure instead of quietly patched-around) is deliberate: it is the
# same check that proves the Flyway migrations are byte-accurate against the current entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# === Spring Session Settings ===
spring.session.timeout=180m
spring.session.store-type=jdbc
# `always` re-runs Spring Session's schema-postgresql.sql on every startup. That script is NOT
# idempotent -- it is bare `CREATE TABLE` / `CREATE INDEX` statements with no
# conditional-existence clause, so the second and later runs fail outright. What actually makes
# `always` safe to re-run is Spring Boot's JdbcSessionDataSourceScriptDatabaseInitializer setting
# continueOnError(true), which swallows those failures. The visible consequence: every production
# restart after the first logs "relation already exists" errors from the session initializer --
# this is expected, not a failed deploy.
#
# No manual DDL script accompanies this (unlike
# docs/plans/backend-modernization/02-optimistic-locking-ddl.sql and 03-activity-log-ddl.sql,
# which exist only because Hibernate's ddl-auto is unset in production). Spring Session JDBC
# ships its own initializer and needs no such bridge, so `initialize-schema=always` alone is the
# schema-creation mechanism -- no new manual pre-merge step.
spring.session.jdbc.initialize-schema=always

# === Server Session (Servlet) Settings ===
server.servlet.session.timeout=1m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
# Deliberately false until 2026-08-19 (todo 2026-08-10): no deployed environment terminated
# TLS at the time, and Spring Session JDBC's DefaultCookieSerializer -- which actually writes
# this cookie, not the raw servlet container -- derives Secure from whether the *current
# request* was secure when the property is left unset, a per-request value. Phases 5 and 8
# made every deployed environment TLS-served, so that per-request derivation is no longer
# useful and the attribute is set unconditionally instead (HARDEN-07). A browser now never
# transmits this cookie over a non-TLS connection. Asserted against a real Set-Cookie header
# by SessionCookieAttributesE2ETest, not merely read from this file.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=600
server.servlet.session.cookie.same-site=strict

# === kafka ===
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Avro cutover (Phase 4, SCHEMA-03): replaces JsonSerializer. Looks up (never registers) each
# event type's schema from the registry below, then writes [magic byte][4-byte schema id][Avro
# binary payload] instead of JSON.
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# SCHEMA-01: schemas are registered only by the registerSchemas Gradle task (AvroSchemaRegistrar),
# never by the producer at runtime. A producer with a drifted schema then fails loudly (a
# SerializationException, handled by KafkaEventPublisher's existing whenComplete callback per
# D-01) instead of silently registering a new, unreviewed schema version.
spring.kafka.producer.properties.auto.register.schemas=false
# RecordNameStrategy: the subject is the Avro record's own full name, independent of topic --
# this is what lets all 5 event types coexist as 5 independently-versioned subjects on the single
# kanban.activity topic (D-03). Must be set identically on the consumer below: an asymmetry here
# does not fail at startup, it fails at consume time as a subject-not-found lookup error.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
# The after-commit publish (KafkaEventPublisher) runs synchronously on the request thread after
# the transaction commits but before the HTTP response is written. Without these bounds,
# KafkaTemplate.send() can block for max.block.ms's 60000ms default while it waits for cluster
# metadata from an unreachable broker, turning a broker outage into a self-inflicted request hang
# (D-01 forbids this). Revisit these bounds once a real production broker lands (KAFKA-V2-01).
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=2000

# === kafka consumer ===
spring.kafka.consumer.group-id=activity-log
# A durable activity log must not skip events published before the consumer group first joined.
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer wraps both the key and value deserializer. Without it, a
# deserialization failure throws inside the poll loop before DefaultErrorHandler (see
# KafkaConsumerConfig) ever sees the record -- the container cannot advance past the offset, so a
# single malformed message stalls the partition permanently instead of being retried and
# dead-lettered (RELY-01). ErrorHandlingDeserializer itself is unchanged by the Avro cutover --
# it is format-agnostic, only its value delegate below changes.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
# Avro cutover (Phase 4, SCHEMA-03): replaces the JsonDeserializer delegate.
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# Yields the generated SpecificRecord classes on deserialization rather than GenericRecord.
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
# The two JSON-era properties below (spring.json.trusted.packages, spring.json.use.type.headers)
# are deleted, not commented out: they were a deserialization-gadget allowlist for a deserializer
# that is no longer in the path. Avro's specific-reader deserialization instantiates only the
# exact generated class named by the schema the message's id resolves to -- never a type chosen
# by the message author -- so there is no remaining surface for that allowlist to guard, and
# leaving it behind would invite a future reader to treat it as a live protection.

# === cors ===
# Vite (5173) and create-react-app (3000) default local dev ports. allowCredentials(true) on the
# CorsConfigurationSource bean (com.vrudenko.kanban_board.config.CorsConfig) makes an explicit
# origin list mandatory -- the CORS spec forbids a wildcard origin alongside credentials.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# === pagination ===
# The read endpoint on this feed is the first paginated endpoint in this codebase; Spring's own
# default ceiling of 2000 is far too generous for an append-only feed with no retention policy.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
