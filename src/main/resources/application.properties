# === application ===
spring.application.name=kanban-board

# === servlet ===
server.servlet.context-path=/api

# === swagger ===
springdoc.api-docs.path=/docs

spring.jpa.show-sql=false

# === datasource ===
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# === hibernate ===
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# === Spring Session Settings ===
spring.session.timeout=180m
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# === Server Session (Servlet) Settings ===
server.servlet.session.timeout=1m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=600
server.servlet.session.cookie.same-site=strict

# === kafka ===
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# The after-commit publish (KafkaEventPublisher) runs synchronously on the request thread after
# the transaction commits but before the HTTP response is written. Without these bounds,
# KafkaTemplate.send() can block for max.block.ms's 60000ms default while it waits for cluster
# metadata from an unreachable broker, turning a broker outage into a self-inflicted request hang
# (D-01 forbids this). Revisit these bounds once a real production broker lands (KAFKA-V2-01).
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=2000

# === kafka consumer ===
spring.kafka.consumer.group-id=activity-log
# A durable activity log must not skip events published before the consumer group first joined.
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer wraps both the key and value deserializer. Without it, a
# deserialization failure throws inside the poll loop before DefaultErrorHandler (see
# KafkaConsumerConfig) ever sees the record -- the container cannot advance past the offset, so a
# single malformed message stalls the partition permanently instead of being retried and
# dead-lettered (RELY-01).
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Scoped to this one package, never a wildcard -- a wildcard would turn the consumer into a
# deserialization-gadget surface for anything that can write to kanban.activity.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.vrudenko.kanban_board.event
# The producer's JsonSerializer already writes the type header this relies on.
spring.kafka.consumer.properties.spring.json.use.type.headers=true

# === pagination ===
# The read endpoint on this feed is the first paginated endpoint in this codebase; Spring's own
# default ceiling of 2000 is far too generous for an append-only feed with no retention policy.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
