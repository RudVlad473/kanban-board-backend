# === application ===
spring.application.name=kanban-board

# === servlet ===
server.servlet.context-path=/api

# === swagger ===
springdoc.api-docs.path=/docs

spring.jpa.show-sql=false

# === datasource ===
# DB_PORT defaults to 5432, reproducing the previous hardcoded value exactly -- the compose `app`
# service and .github/workflows/deploy.yml both never set DB_PORT, so neither changes behavior.
# DB_PORT exists for JVMs run on the HOST -- specifically the rehearseHistoricalSchemas Gradle
# task, the only task that resolves this file's datasource instead of the test profile's H2 URL
# -- which must target the compose Postgres's host-published port (see docker-compose.yml).
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# === hibernate ===
# Division of labor (Flyway cutover, D-03): files under src/main/resources/db/migration/ are the
# only thing allowed to create or alter schema from here on. This setting only checks that the
# app's entity mappings agree with whatever schema Flyway already put in place at boot -- it never
# creates or alters anything itself. Neither side both creates and validates. A mismatch here is a
# loud SchemaManagementException at startup, not a silent auto-alter -- that tradeoff (a class of
# drift becomes a hard boot failure instead of quietly patched-around) is deliberate: it is the
# same check that proves the Flyway migrations are byte-accurate against the current entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# === Spring Session Settings ===
spring.session.timeout=180m
spring.session.store-type=jdbc
# `always` re-runs Spring Session's schema-postgresql.sql on every startup. That script is NOT
# idempotent -- it is bare `CREATE TABLE` / `CREATE INDEX` statements with no
# conditional-existence clause, so the second and later runs fail outright. What actually makes
# `always` safe to re-run is Spring Boot's JdbcSessionDataSourceScriptDatabaseInitializer setting
# continueOnError(true), which swallows those failures. The visible consequence: every production
# restart after the first logs "relation already exists" errors from the session initializer --
# this is expected, not a failed deploy.
#
# No manual DDL script accompanies this (unlike
# docs/plans/backend-modernization/02-optimistic-locking-ddl.sql and 03-activity-log-ddl.sql,
# which exist only because Hibernate's ddl-auto is unset in production). Spring Session JDBC
# ships its own initializer and needs no such bridge, so `initialize-schema=always` alone is the
# schema-creation mechanism -- no new manual pre-merge step.
spring.session.jdbc.initialize-schema=always

# === Server Session (Servlet) Settings ===
server.servlet.session.timeout=1m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=600
server.servlet.session.cookie.same-site=strict

# === kafka ===
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Avro cutover (Phase 4, SCHEMA-03): replaces JsonSerializer. Looks up (never registers) each
# event type's schema from the registry below, then writes [magic byte][4-byte schema id][Avro
# binary payload] instead of JSON.
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# SCHEMA-01: schemas are registered only by the registerSchemas Gradle task (AvroSchemaRegistrar),
# never by the producer at runtime. A producer with a drifted schema then fails loudly (a
# SerializationException, handled by KafkaEventPublisher's existing whenComplete callback per
# D-01) instead of silently registering a new, unreviewed schema version.
spring.kafka.producer.properties.auto.register.schemas=false
# RecordNameStrategy: the subject is the Avro record's own full name, independent of topic --
# this is what lets all 5 event types coexist as 5 independently-versioned subjects on the single
# kanban.activity topic (D-03). Must be set identically on the consumer below: an asymmetry here
# does not fail at startup, it fails at consume time as a subject-not-found lookup error.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
# The after-commit publish (KafkaEventPublisher) runs synchronously on the request thread after
# the transaction commits but before the HTTP response is written. Without these bounds,
# KafkaTemplate.send() can block for max.block.ms's 60000ms default while it waits for cluster
# metadata from an unreachable broker, turning a broker outage into a self-inflicted request hang
# (D-01 forbids this). Revisit these bounds once a real production broker lands (KAFKA-V2-01).
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=2000

# === kafka consumer ===
spring.kafka.consumer.group-id=activity-log
# A durable activity log must not skip events published before the consumer group first joined.
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer wraps both the key and value deserializer. Without it, a
# deserialization failure throws inside the poll loop before DefaultErrorHandler (see
# KafkaConsumerConfig) ever sees the record -- the container cannot advance past the offset, so a
# single malformed message stalls the partition permanently instead of being retried and
# dead-lettered (RELY-01). ErrorHandlingDeserializer itself is unchanged by the Avro cutover --
# it is format-agnostic, only its value delegate below changes.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
# Avro cutover (Phase 4, SCHEMA-03): replaces the JsonDeserializer delegate.
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# Yields the generated SpecificRecord classes on deserialization rather than GenericRecord.
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
# The two JSON-era properties below (spring.json.trusted.packages, spring.json.use.type.headers)
# are deleted, not commented out: they were a deserialization-gadget allowlist for a deserializer
# that is no longer in the path. Avro's specific-reader deserialization instantiates only the
# exact generated class named by the schema the message's id resolves to -- never a type chosen
# by the message author -- so there is no remaining surface for that allowlist to guard, and
# leaving it behind would invite a future reader to treat it as a live protection.

# === pagination ===
# The read endpoint on this feed is the first paginated endpoint in this codebase; Spring's own
# default ceiling of 2000 is far too generous for an append-only feed with no retention policy.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
