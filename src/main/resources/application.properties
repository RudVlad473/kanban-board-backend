# === application ===
spring.application.name=kanban-board

# === servlet ===
server.servlet.context-path=/api

# === graceful shutdown ===
# `graceful`: in-flight requests complete before shutdown instead of being dropped at SIGTERM.
#
# Spring Boot's default is immediate shutdown, and every redeploy/restart sends SIGTERM to the container,
# so this is not theoretical in production. timeout-per-shutdown-phase=8s stays under Docker's default 10s
# stop grace period (after which it sends SIGKILL), so the graceful phase can finish before the kill.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=8s

# === swagger ===
springdoc.api-docs.path=/docs

# === actuator ===
# `health` is the ONLY permitted value: the include list is an allowlist, not a default to widen.
#
# The edge proxies this path publicly, so a wider list (or the framework default of a bare `*`) would
# publish `/env`, `/beans` and `/heapdump`, the entire JVM heap including the JDBC password, the session
# store and bcrypt hashes, to the internet. show-details=never additionally keeps the health response
# body from leaking the datasource URL/driver/validation query to an unauthenticated caller.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.jpa.show-sql=false

# === datasource ===
# DB_PORT defaults to 5432, the previous hardcoded value, so `app` and deploy.yml (never set it) are unaffected.
#
# DB_PORT exists for JVMs run on the HOST, specifically the rehearseHistoricalSchemas Gradle task (the
# only task that resolves this file's datasource instead of the test profile's), which must target the
# compose Postgres's host-published port (see docker-compose.yml).
#
# Decisions:
# DB_JDBC_PARAMS is REMOVED, not merely re-defaulted: both of its jobs are gone now that the datasource is
# a same-host container rather than a public-internet hop to Neon. TLS/channel-binding parameters have no
# server to negotiate with: this container has no TLS listener configured, and a client demanding SSL
# against a plaintext listener is a hard connection failure, not a silent downgrade, with the same
# acquisition-timeout signature the 2026-08-26 Neon incident produced once (see the Hikari record below).
# The prepareThreshold=0 PgBouncer workaround has no transaction-mode pooler left to work around; its
# removal was smoke-tested against a real instance (outcome at the end of the Hikari record), not assumed.
# Falsifiable: re-adding an override hook is a one-line change if a pooler or a TLS listener is ever
# placed back in front of this datasource, so removing it now is cheap to reverse.
# planner-discipline-allow: DB_JDBC_PARAMS
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# === datasource pool (HikariCP) ===
# Sized explicitly for a same-host PostgreSQL container, not left at Hikari's undocumented defaults.
#
# Decisions:
# - maximum-pool-size=5: two application containers share one engine with max_connections=25. Worst case
#   is 5 + 5 = 10 application connections, plus one CI Flyway one-off and an occasional administrative
#   psql session: roughly 2x headroom under the ceiling. A change to this value or to the engine's
#   max_connections is coupled to the other.
# - minimum-idle=2: a same-host container has no usage meter, autosuspend timer or compute to wake, so a
#   floor of zero buys nothing and costs a TCP connect plus a SCRAM handshake on the first request after
#   an idle period. Must stay explicit: Hikari's validation coerces an unset value to maximum-pool-size,
#   which would hold five warm connections per app instead of two.
# - connection-timeout=10000 (10s): a same-host engine answers in single-digit milliseconds or is
#   genuinely unavailable, so the old 30s Neon-cold-start value would turn a real outage into a
#   thirty-second request hang (the symptom of the 2026-08-26 incident). 10s is far above any healthy
#   acquisition and still allows the one legitimate wait: a cold VM boot, where `app-nonprod` cannot
#   express a health dependency on this database because it lives in a different Compose project.
# - idle-timeout=600000 / max-lifetime=1800000: both HikariCP's own defaults, stated explicitly per this
#   file's convention. The old 10-minute max-lifetime was shorter than Neon's idle-connection reaping
#   window; with no reaper in front of a same-host engine, that churn was pure overhead. The ordering is
#   load-bearing: Hikari disables idle-timeout entirely, with only a startup warning, when the two values
#   sit too close together, which is why idle-timeout is explicit at all.
# - keepalive-time=120000 (2min): the value that caused the 2026-08-26 outage, by querying every idle
#   pooled connection every two minutes and so holding a metered Neon compute awake. That mechanism does
#   not exist for a same-host container, so a periodic liveness probe is now purely useful: it detects a
#   connection the engine dropped (a restart, an administrative termination) before a real request does.
#   Must stay explicit: deleting the line does NOT disable keepalive, it restores HikariCP's own
#   field-initializer default of 2 minutes. Falsifiable: this assumes a same-host, unmetered datasource;
#   repointing at a metered or autosuspending database makes this the first line to revisit.
# Library findings (verified against the HikariCP 6.3.3 sources on 2026-08-26), because the intuitive edit
# of deleting either line is silently wrong:
# - HikariConfig line 55 sets DEFAULT_KEEPALIVE_TIME = MINUTES.toMillis(2): keepalive is NOT off by
#   default in Hikari 6.x. HikariPool skips scheduling KeepaliveTask only under `if (keepaliveTime > 0)`,
#   so an explicit 0 is the only thing that disables it. Do not trust HikariCP's Javadoc: setKeepaliveTime's
#   doc comment still claims "default is 0 (disabled)", which the field initializer in the same file
#   contradicts.
# - HikariConfig's validation coerces an UNSET minimum-idle to maximum-pool-size. An explicit 0 survives
#   validation (`if (minIdle < 0 || minIdle > maxPoolSize)` does not match) and HikariPool's refill test
#   `idle < config.getMinimumIdle()` then never fires, which is how the Neon-era config avoided an
#   always-warm pool.
# Neon-era record (superseded 2026-08-26): minimum-idle=0 and keepalive-time=0 existed because nonprod and
# production were two branches of ONE Neon project whose Free-plan compute allowance (100 CU-h/month) is
# per project. A warm connection billed both computes around the clock (~170 CU-h/month each), the shared
# allowance ran out mid-month and Neon suspended both environments at once (investigation:
# `.planning/debug/resolved/admin-reset-500-nonprod.md`). The self-hosted Postgres migration removed every
# provider-specific mechanic that record was reasoned against: no cold start, no autosuspend timer, no
# metered compute allowance, no idle-connection reaper. Each value was re-derived against this repo's
# topology, not copied from generic tuning advice: maximum-pool-size stays 5; minimum-idle 0 -> 2;
# connection-timeout 30000 -> 10000; idle-timeout 300000 -> 600000; max-lifetime 600000 -> 1800000;
# keepalive-time 0 -> 120000. Accepted cost: two permanently warm connections per app container instead of
# zero, and up to 30 minutes of connection age instead of 10, both negligible against a same-host engine
# with no metering and no reaper.
# The prepareThreshold=0 removal (DB_JDBC_PARAMS, see the datasource URL comment above) was the one change
# reasoned rather than observed ("no transaction-mode pooler is in the path any more"), so it was verified
# 2026-08-26: a 25-iteration create/read(nested-full)/delete workload through the real signup/board API
# against a same-host PostgreSQL 16 container (docker-compose.yml's local dev stack), then 10 more cycles
# AFTER restarting the Postgres container mid-session. `pg_prepared_statements` was rejected as a check: it
# is scoped to the querying session, so a separate `docker exec psql` session never sees the app's
# backends' statements (it read 0 against this workload). The evidence is Postgres's own statement log
# (log_statement=all, enabled via ALTER SYSTEM + pg_reload_conf(), no committed config change): 1028
# server-side named-statement executions (`execute S_<n>`), the most-reused (S_1) executed 376 times on one
# connection, direct proof that PgJDBC crossed the reuse threshold and kept reusing the prepared statement.
# No `PSQLException` about a prepared statement already existing or not existing appeared before or after
# the restart. Falsifiable: if that exception class ever appears in production logs, revisit this removal
# first; it would mean something still depends on the override for a reason nobody has identified.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000

# === hibernate ===
# Flyway owns the schema: only files under src/main/resources/db/migration/ may create or alter it.
#
# `validate` only checks that the entity mappings agree with the schema Flyway put in place at boot;
# neither side both creates and validates. A mismatch is a loud SchemaManagementException at startup, not
# a silent auto-alter: a class of drift becomes a hard boot failure instead of being quietly patched
# around, the same check that proves the Flyway migrations are byte-accurate against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# === Spring Session Settings ===
spring.session.timeout=180m
spring.session.store-type=jdbc
# `always` re-runs Spring Session's schema-postgresql.sql on every startup, and that script is NOT idempotent.
#
# Decisions:
# The script is bare `CREATE TABLE` / `CREATE INDEX` with no conditional-existence clause. What makes
# `always` safe is Spring Boot's JdbcSessionDataSourceScriptDatabaseInitializer setting
# continueOnError(true), which swallows those failures. Consequence: every production restart after the
# first logs "relation already exists" errors from the session initializer; this is expected, not a failed
# deploy. No manual DDL script accompanies this (unlike
# docs/plans/backend-modernization/02-optimistic-locking-ddl.sql and 03-activity-log-ddl.sql, which
# existed only because Hibernate's ddl-auto is unset in production): Spring Session JDBC ships its own
# initializer, so `initialize-schema=always` alone is the schema-creation mechanism.
spring.session.jdbc.initialize-schema=always

# === Server Session (Servlet) Settings ===
server.servlet.session.timeout=1m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
# Secure is set unconditionally; it was deliberately false until 2026-08-19.
#
# No deployed environment terminated TLS then, and Spring Session JDBC's DefaultCookieSerializer, which
# actually writes this cookie, derives Secure per request when the property is unset. Every deployed
# environment is now TLS-served, so a browser never transmits this cookie over a non-TLS connection.
# Asserted against a real Set-Cookie header by SessionCookieAttributesE2ETest, not merely read from this
# file.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=600
server.servlet.session.cookie.same-site=strict

# === kafka ===
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Looks up (never registers) each event type's schema from the registry below, then writes [magic
# byte][4-byte schema id][Avro binary payload].
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# Schemas are registered only by the registerSchemas Gradle task (AvroSchemaRegistrar), never by the
# producer at runtime.
#
# A producer with a drifted schema then fails loudly (a SerializationException, handled by
# KafkaEventPublisher's existing whenComplete callback) instead of silently registering a new, unreviewed
# schema version.
spring.kafka.producer.properties.auto.register.schemas=false
# RecordNameStrategy: the subject is the Avro record's own full name, independent of topic, so all 5
# event types coexist as 5 independently-versioned subjects on the single kanban.activity topic.
#
# Must be set identically on the consumer below: an asymmetry does not fail at startup, it fails at
# consume time as a subject-not-found lookup error.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
# The after-commit publish (KafkaEventPublisher) runs synchronously on the request thread, after the
# transaction commits and before the HTTP response is written.
#
# Without these bounds, KafkaTemplate.send() can block for max.block.ms's 60000ms default waiting for
# cluster metadata from an unreachable broker, turning a broker outage into a self-inflicted request hang.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=2000

# === kafka consumer ===
spring.kafka.consumer.group-id=activity-log
# A durable activity log must not skip events published before the consumer group first joined.
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer wraps both the key and value deserializer.
#
# Without it, a deserialization failure throws inside the poll loop before DefaultErrorHandler (see
# KafkaConsumerConfig) ever sees the record, so the container cannot advance past the offset and a single
# malformed message stalls the partition permanently instead of being retried and dead-lettered. It is
# format-agnostic, so the Avro cutover left it unchanged; only its value delegate below changed.
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# Yields the generated SpecificRecord classes on deserialization rather than GenericRecord.
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
# The two JSON-era properties (spring.json.trusted.packages, spring.json.use.type.headers) are deleted,
# not commented out.
#
# They were a deserialization-gadget allowlist for a deserializer no longer in the path. Avro's
# specific-reader deserialization instantiates only the exact generated class named by the schema the
# message's id resolves to, never a type chosen by the message author, so nothing remains for that
# allowlist to guard, and leaving it behind would invite a future reader to treat it as a live protection.

# === cors ===
# Vite (5173) and create-react-app (3000) default local dev ports.
#
# allowCredentials(true) on the CorsConfigurationSource bean (com.vrudenko.kanban_board.config.CorsConfig)
# makes an explicit origin list mandatory: the CORS spec forbids a wildcard origin alongside credentials.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# === pagination ===
# The read endpoint on this feed is the first paginated endpoint in this codebase; Spring's own
# default ceiling of 2000 is far too generous for an append-only feed with no retention policy.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
