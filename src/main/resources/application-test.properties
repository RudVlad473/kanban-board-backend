# === application ===
spring.application.name=kanban-board

# === servlet ===
server.servlet.context-path=/api

# === security ===
# Read only when the `test` Spring profile is active (set by build.gradle's `test` and `fastTest`).
#
# rehearseHistoricalSchemas deliberately does NOT set that profile, so it keeps the production cost factor
# of 10 from BeanConfiguration's fallback. 4 is BCryptPasswordEncoder's minimum permitted value: measured
# ~78s off the full suite by replacing ~251ms of BCrypt key-stretching per fixture-bearing test method with
# ~5ms. See docs/LOCAL_DEV.md for the full before/after measurement and the accepted security trade-off
# (the test profile exercises a weaker cost factor than production).
security.bcrypt.strength=4

# === swagger ===
springdoc.api-docs.path=/docs

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=true

# === hibernate ===
# Tests build the schema with the Flyway migrations production runs; Flyway keeps its default (enabled).
#
# No `spring.flyway.enabled` override. ddl-auto is set EXPLICITLY to validate rather than omitted:
# Hibernate's embedded-database create-drop default never applies to a real Postgres URL, so omitting it
# would silently leave the effective value at none and disable entity/schema agreement checking, which is
# worse than the previous state, not neutral.
# The datasource itself comes from AbstractPostgresContainerTest's @ServiceConnection, which is why no
# spring.datasource.* line remains in this file.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# === Spring Session Settings ===
spring.session.timeout=180m
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# === Server Session (Servlet) Settings ===
server.servlet.session.timeout=1m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
# Kept identical to application.properties, not left false: it costs nothing here and keeps this profile
# able to catch a regression.
#
# Both real-socket harnesses (AbstractAppE2ETest.signin(), AbstractAppMockMvcTest.signinCookie()) replay
# the cookie VALUE manually and never consult its attributes, so a profile configured not to see the
# attribute would hide a regression. SessionCookieAttributesE2ETest asserts it from a real header.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=600
server.servlet.session.cookie.same-site=strict

# === kafka ===
# Bound producer delivery to 50ms so a missing test-time broker fails fast.
#
# Decisions:
# The 120000ms delivery.timeout.ms default would slow every mutating test.
# Much lower than the production bound (application.properties: 2000ms): AbstractAppTest.setup() fixture
# creation alone triggers ~18 publish attempts per test method across 17 fixture-heavy test classes, and
# publication is already verified at the Spring-event level via RecordingActivityEventListener, so a real
# network attempt has no verification value, only wall-clock cost. At 2000ms this compounded into a
# 20+ minute full-suite hang; 50ms keeps the "bounded, not unbounded" property while making that cost
# negligible.
spring.kafka.producer.properties.max.block.ms=50
spring.kafka.producer.properties.request.timeout.ms=50
spring.kafka.producer.properties.delivery.timeout.ms=50
# Mirrors application.properties' producer serde block; the registry URL deliberately points at an
# address nothing listens on.
#
# That is the intended state for the 17 fixture-heavy, non-container test classes: their publishes are
# expected to fail fast and be logged, as they already do with an absent broker.
#
# Decisions:
# Measured, not assumed: the Confluent registry REST client used by KafkaAvroSerializer has its OWN
# retry/timeout config, independent of the Kafka producer bounds above: the registry HTTP lookup runs
# synchronously inside serialization, before max.block.ms/request.timeout.ms/delivery.timeout.ms come into
# play. Left at its defaults (3 retries, 1000-20000ms exponential backoff between attempts, 60000ms
# connect/read timeout), a full-suite run measured 232s against the ~208s pre-Avro baseline, an 11%
# regression traced to exactly this: ~18 publishes per test method x 17 fixture-heavy classes, each burning
# several seconds of retry-wait against a registry that was never going to answer. Bounded below to the
# same fail-fast spirit as max.block.ms above.
spring.kafka.producer.properties.max.retries=0
spring.kafka.producer.properties.retries.wait.ms=0
spring.kafka.producer.properties.http.connect.timeout.ms=50
spring.kafka.producer.properties.http.read.timeout.ms=50
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081
spring.kafka.producer.properties.auto.register.schemas=false
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy

# === kafka consumer ===
# Mirrors application.properties' consumer block verbatim so the test profile behaves
# identically. See application.properties for the reasoning behind each line.
spring.kafka.consumer.group-id=activity-log
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
