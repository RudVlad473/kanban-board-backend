# === application ===
spring.application.name=kanban-board

# === servlet ===
server.servlet.context-path=/api

# === swagger ===
springdoc.api-docs.path=/docs

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=true

# === datasource ===
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

# === hibernate ===
# Flyway auto-activates for ANY DataSource bean once flyway-core is on the classpath,
# including this H2 in-memory profile -- with no built-in test-profile scoping. Without
# this line, Flyway attempts V1-V4 (Postgres-flavored, including a PL/pgSQL DO $$ block
# in V4) against H2 before Hibernate's create-drop ever runs, failing every
# @SpringBootTest at context startup. ddl-auto stays create-drop (unchanged) -- this is
# an orthogonal addition, not a replacement for it.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# === Spring Session Settings ===
spring.session.timeout=180m
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

# === Server Session (Servlet) Settings ===
server.servlet.session.timeout=1m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=600
server.servlet.session.cookie.same-site=strict

# === kafka ===
# Bounded so a missing test-time broker fails fast instead of retrying for the
# delivery.timeout.ms default (120000ms), which would otherwise slow every mutating test (D-01).
# Set much lower than the production bound (application.properties: 2000ms): AbstractAppTest.setup()
# fixture creation alone triggers ~18 publish attempts per test method across 17 fixture-heavy test
# classes, and publication is already verified at the Spring-event level via
# RecordingActivityEventListener (not via a real Kafka delivery), so the real network attempt in
# ordinary tests has no verification value -- only wall-clock cost. At 2000ms this compounded into a
# 20+ minute full-suite hang; 50ms keeps the "bounded, not unbounded" property from D-01 while making
# that cost negligible.
spring.kafka.producer.properties.max.block.ms=50
spring.kafka.producer.properties.request.timeout.ms=50
spring.kafka.producer.properties.delivery.timeout.ms=50
# Avro cutover (Phase 4): mirrors application.properties' producer serde block. schema.registry.url
# deliberately points at a local address nothing is listening on -- the intended state for these
# 17 fixture-heavy, non-container test classes. Their publishes are already expected to fail fast
# and be logged, exactly as they already do with an absent broker (D-01).
#
# Measured, not assumed: the Confluent registry REST client used by KafkaAvroSerializer has its
# OWN retry/timeout config, entirely independent of the Kafka producer bounds above -- the
# registry HTTP lookup runs synchronously inside serialization, before max.block.ms/
# request.timeout.ms/delivery.timeout.ms even come into play. Left at its defaults (3 retries,
# 1000-20000ms exponential backoff between attempts, 60000ms connect/read timeout), a full-suite
# run measured 232s against the ~208s pre-Avro baseline -- an 11% regression traced to exactly
# this: ~18 publishes per test method x 17 fixture-heavy classes, each burning several seconds of
# retry-wait against a registry that was never going to answer. Bounded below to the same
# fail-fast spirit as max.block.ms above.
spring.kafka.producer.properties.max.retries=0
spring.kafka.producer.properties.retries.wait.ms=0
spring.kafka.producer.properties.http.connect.timeout.ms=50
spring.kafka.producer.properties.http.read.timeout.ms=50
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=http://localhost:8081
spring.kafka.producer.properties.auto.register.schemas=false
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy

# === kafka consumer ===
# Mirrors application.properties' consumer block verbatim so the H2 test profile behaves
# identically. See application.properties for the reasoning behind each line.
spring.kafka.consumer.group-id=activity-log
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.schema.registry.url=http://localhost:8081
spring.kafka.consumer.properties.specific.avro.reader=true
spring.kafka.consumer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.RecordNameStrategy
