distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.0-bin.zip
# Pinned to the `bin` distribution's published SHA-256 (services.gradle.org, redirect-followed,
# cross-checked against downloads.gradle.org -- both agreed). Version-coupled: bumping
