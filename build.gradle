plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.3'
    id 'net.ltgt.errorprone' version '5.1.1'

    // JaCoCo coverage tracking, enforced as a ratchet (jacocoTestCoverageVerification).
    //
    // Ships inside Gradle core: no third-party plugin coordinate is resolved, only the org.jacoco agent/ant
    // artifacts the toolVersion below pins. See jacocoTestReport for the generated-code exclusions that keep
    // the denominator honest.
    id 'jacoco'

    // Compiles src/main/avro/*.avsc into generated SpecificRecord classes at build time.
    //
    // Pinned exactly: the project was archived by its owner on 2026-12-28 and donated to the Apache Avro
    // project, so 1.9.1 is its final, permanent release. It remains functionally complete for plain .avsc
    // codegen with built-in logical types, which is all this project needs.
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'

    // OWASP dependency-check-gradle: CVE scanning against a locally-cached NVD/OSS-Index/Central copy, CPE-matched.
    //
    // Decisions:
    // Version 12.2.2, not 13.0.0: a maturity judgement call, not a verified compatibility fact. 13.0.0 published
    // 2026-08-03, ten days before this was added; 12.2.2 published 2026-05-03 and has three months of field
    // exposure. Its release notes flag a DB schema change, which only invalidates a warm cache on first run.
    // This file's precedent (error_prone_core, jacoco.toolVersion, the avro plugin above) is to pin a reviewed,
    // settled version rather than the newest.
    // Publication gotcha: org.owasp:dependency-check-gradle stops at 10.0.3 on Maven Central (2024-07-16);
    // 11.x, 12.x and 13.x are published to the Gradle Plugin Portal m2 repository only. This resolves because
    // settings.gradle has no pluginManagement block, so the default gradlePluginPortal() applies; it breaks the
    // moment anyone adds pluginManagement { repositories { mavenCentral() } }.
    // Not wired into anything: unlike jacocoTestCoverageVerification or verifyRuntimeDependencyFloor,
    // dependencyCheckAnalyze is network-bound, holds an H2 vulnerability database, and is by far the heaviest
    // task in this build. It runs from a scheduled CI workflow (.github/workflows/security-scan.yml) and from
    // manual invocation, and sits on no path a developer or the pre-commit hook waits for.
    // Its verdict is not a pure function of the source tree: every other gate here (Spotless, Error Prone,
    // JaCoCo, ArchUnit, verifyRuntimeDependencyFloor) yields the same verdict for the same commit forever; this
    // one goes red days later when a new advisory publishes against an unchanged dependency. That is the
    // intent, and "it broke and I changed nothing" is an expected outcome, not a bug to hunt.
    // Rung and ratchet: report-only today (see the dependencyCheck block below), because even after the Spring
    // Boot 3.5.0 -> 3.5.16 bump the CPE-matched finding count will exceed the OSV-measured one, the difference
    // being false positives. The post-bump OSV re-measurement
    // (.planning/quick/260813-q1i-add-a-dependency-vulnerability-scan-owas/260813-q1i-MEASUREMENTS.md): 5
    // findings across 3 modules, 0 CRITICAL, 1 HIGH, 4 MODERATE, 0 LOW (down from 70 across 20 modules pre-bump).
    // TODO: .planning/todos/pending/2026-08-13-ratchet-failbuildoncvss-after-a-real-dependency-check-baseline.md - pick a failBuildOnCVSS rung once a real dependencyCheckAnalyze baseline exists and its false positives are suppressed with cited evidence.
    id 'org.owasp.dependencycheck' version '13.0.0'
}

group = 'com.vrudenko'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        // Format code, leave Javadoc text alone.
        //
        // Java comments are plain text (docs/CODE_STYLE.md rule 14). With Javadoc formatting on,
        // google-java-format 1.24.0 rewrites every blank-line paragraph break into the paragraph tag
        // that scripts/verify-comments.py rejects, so the formatter and the comment lint would fight.
        googleJavaFormat().aosp().formatJavadoc(false)
        target 'src/**/*.java'
        formatAnnotations()

        // Explicit 5-group import order, blank-line separated: java.*, javax.*, com.vrudenko.* (first-party, deliberately ahead of third-party),
        // everything else (the '' catch-all), then static imports last.
        //
        // The '' group covers jakarta.*, org.springframework.*, io.*, com.github.*, com.fasterxml.* and the rest.
        // The doubled backslash in '\\#' is Groovy string-escaping producing the single literal token '\#' that
        // Spotless's ImportSorterImpl matches static imports on (verified against spotless-lib-3.0.2.jar's constant
        // pool). The javax group matches zero imports today (Spring Boot 3 uses jakarta.*) and is deliberate
        // future-proofing, not a mistake to tidy away.
        importOrder('java', 'javax', 'com.vrudenko', '', '\\#')

        removeUnusedImports()
    }
}

test {
    systemProperty "spring.profiles.active", "test"
}

repositories {
    mavenCentral()

    // io.confluent artifacts (kafka-avro-serializer and its transitive schema-registry
    // client) are not published to Maven Central -- Confluent publishes only to its own repo.
    maven { url 'https://packages.confluent.io/maven/' }
}

// --- Dependency-verification metadata -------------------------------------------------------
// gradle/verification-metadata.xml (generated, git-tracked, NOT gitignored) records a SHA-256 for every artifact Gradle resolves.
//
// It covers this dependencies block, the plugins block and every custom task's own resolved configuration
// (fastTest, registerSchemas, rehearseHistoricalSchemas, verifyRuntimeDependencyFloor), closing a trust
// boundary an exact version pin alone does not: an artifact republished under the SAME group:name:version on
// Maven Central or the Confluent repository is refused at resolution time if its content no longer matches
// the committed checksum.
//
// Decisions:
// Regeneration, after ANY dependency/plugin change to this file:
//   ./gradlew --write-verification-metadata sha256 --refresh-dependencies spotlessCheck test
// Driven through spotlessCheck+test, not a minimal `help` task: `help` under-resolves and yields a file that
// passes locally but fails the first time CI resolves a configuration `help` never touched.
// --refresh-dependencies is NOT optional (observed live): a first generation run without it silently
// under-captured the buildscript `classpath` configuration's dynamic-version-range candidates (guava-parent,
// jackson-bom, junit-bom POMs/modules evaluated while resolving version ranges for this file's plugins),
// because they were served from a warm local cache instead of freshly resolved and hashed; the next
// `--refresh-dependencies` run (a cold, CI-like resolution) then failed verification on artifacts nothing in
// this file's own dependency graph names directly. Confirmed by reproducing the failure with NO code change
// (bisected against a scratch dependency), then confirmed fixed by regenerating with --refresh-dependencies.
// Dependabot consequence: every gradle-ecosystem Dependabot PR bumps a dependency whose new artifact is not
// yet in the metadata file, so its build WILL fail with a Gradle dependency-verification error until a human
// regenerates and commits the file alongside the bump. Expected, not a break: a same-version-bumped
// dependency on a scratch branch failed `./gradlew spotlessCheck test --refresh-dependencies` with Gradle's
// own error naming the missing checksum, so no separate CI staleness check exists; Gradle's resolution-time
// enforcement already covers it.
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.postgresql:postgresql'

    // Flyway is unversioned: BOM-managed by Spring Boot 3.5.16 (pinned to 11.7.2 in spring-boot-dependencies).
    //
    // A Spring Boot bump then moves both artifacts together, as for every Spring-managed dependency here.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Backs management.endpoints.web.exposure.include=health in application.properties: the production
    // healthcheck's real "is the app working" signal (health aggregation includes the DataSource indicator).
    //
    // Not for general monitoring/metrics. No version pin: resolved by the managed Spring Boot 3.5.16 train.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Backs the spring.session.* properties in application.properties (store-type=jdbc, initialize-schema=always).
    //
    // Those properties predate this dependency and were silently inert without it: sessions were plain in-memory
    // Tomcat HttpSession despite the config. Nothing in src/main imports org.springframework.session, so this looks
    // unused to a dependency audit; it is not. Do not remove it.
    implementation 'org.springframework.session:spring-session-jdbc'

    // https://mvnrepository.com/artifact/com.google.guava/guava
    implementation 'com.google.guava:guava:33.7.2-android'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    // commons-lang3 3.18.0, `implementation` scope: a floor against two separate regressions.
    //
    // Decisions:
    // Bumped from the previously-pinned 3.0: Spring Boot's dependency-management plugin forces an explicitly-
    // declared version project-wide, so the old 3.0 pin silently downgraded every transitive commons-lang3
    // request, including commons-compress 1.28.0's (pulled in by org.apache.avro:avro:1.12.1), to 3.0.
    // commons-compress's TarArchiveOutputStream (used by Testcontainers to copy files into a container) calls
    // commons-lang3's ArrayFill, added in 3.11, so 3.0 broke container startup with a NoClassDefFoundError in 3
    // Kafka Testcontainers E2E tests (ActivityLogConsumerE2ETest, ActivityLogDeadLetterE2ETest,
    // ActivityLogIdempotencyE2ETest) the moment the Avro dependency landed. 3.18.0 matches the highest version
    // already requested transitively, so it resolves cleanly against every other caller.
    // Scope is `implementation`, not testImplementation: the first fix landed test-only, so it never touched
    // `configurations.runtimeClasspath`, the configuration `bootJar` packages into the production Docker image,
    // which kept resolving 3.17.0 (observed live via `./gradlew dependencies --configuration runtimeClasspath`),
    // carrying CVE-2025-48924 (GHSA-j288-q9x7-2f5v, uncontrolled recursion in `ClassUtils.getClass`), fixed in
    // 3.18.0. Research found it, not any gate, which is why `verifyRuntimeDependencyFloor` below exists: it fails
    // the build if this line regresses to test-only scope. One declaration, not two: `implementation` already
    // extends into the test compile and runtime configurations.
    implementation 'org.apache.commons:commons-lang3:3.21.0'

    // https://mvnrepository.com/artifact/org.fluttercode.datafactory/datafactory
    testImplementation 'org.fluttercode.datafactory:datafactory:0.8'

    implementation 'io.vavr:vavr:1.0.1'

    testImplementation 'org.springframework.security:spring-security-test'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation("org.apache.commons:commons-collections4:4.6.0")

    implementation 'com.github.f4b6a3:ulid-creator:5.2.4'

    // https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1")

    // https://mvnrepository.com/artifact/io.rest-assured/rest-assured
    testImplementation("io.rest-assured:rest-assured:6.0.1")

    implementation 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // Avro core: schema model, binary encoder/decoder, SpecificRecord/SpecificRecordBase
    // runtime support -- required at runtime by every class the avro plugin generates.
    implementation 'org.apache.avro:avro:1.12.2'

    // Confluent's KafkaAvroSerializer/KafkaAvroDeserializer + Schema Registry REST client.
    //
    // Decisions:
    // The kafka-clients exclude keeps Spring Boot's BOM-managed kafka-clients (already pulled in via spring-kafka)
    // the single resolved version; without it, Confluent's own transitive kafka-clients could fork the tree.
    // The swagger-annotations exclude fixes a real production defect: this dependency's transitive
    // kafka-schema-registry-client:7.8.9 depends on the pre-jakarta io.swagger.core.v3:swagger-annotations:2.1.10,
    // which shares the exact package (io.swagger.v3.oas.annotations) with
    // io.swagger.core.v3:swagger-annotations-jakarta:2.2.30 that SpringDoc 2.8.8 needs. Gradle cannot dedupe
    // them because their artifact IDs differ, so both landed on the runtime classpath and whichever jar's
    // Parameter class the JVM loaded first won, in practice the older 2.1.10, which lacks the
    // validationGroups() method SpringDoc calls, so every GET /api/docs returned 500 with NoSuchMethodError.
    // Removing the pre-jakarta artifact is safe because swagger-annotations-jakarta supplies the same package
    // and class names, so kafka-schema-registry-client's references still resolve, from the other jar.
    implementation('io.confluent:kafka-avro-serializer:7.8.9') {
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // RedpandaContainer exposes both getBootstrapServers() and getSchemaRegistryAddress() from one container.
    //
    // No explicit version: defers to Spring Boot's managed testcontainers BOM, as org.testcontainers:kafka above.
    testImplementation 'org.testcontainers:redpanda'

    // No explicit version: BOM-managed by Spring Boot 3.5.16 like the other org.testcontainers lines above.
    //
    // It resolves to the 1.21.4 release train (verified via `./gradlew dependencies --configuration
    // testRuntimeClasspath`). com.h2database:h2 is removed entirely, so AbstractPostgresContainerTest's container
    // is the only datasource left for the whole suite.
    testImplementation 'org.testcontainers:postgresql'

    // Avro codegen returns java.util.UUID and java.time.Instant natively for the "uuid" and "timestamp-millis"
    // logical types (gradle-avro-plugin 1.9.1 + Avro 1.12.1).
    //
    // Observed on AvroTaskMovedEvent: getEventId() and getTimestamp() need no manual UUID.fromString()/
    // Instant.ofEpochMilli() conversion in ActivityEventAvroMapper.

    // https://mvnrepository.com/artifact/com.tngtech.archunit/archunit-junit5
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
}

// The `rehearsal` tag (HistoricalSchemaRehearsalE2ETest) is excluded from `test`.
//
// The per-run Testcontainers PostgreSQL database behind every other test class is fresh and empty by
// construction, so folding this rehearsal into `test` would guarantee either a permanent failure (its
// corpus-empty gate firing every run) or, if that gate were weakened, a permanently vacuous pass. See
// rehearseHistoricalSchemas below for the dedicated task it runs under, against a real historical Postgres.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'rehearsal'
    }
    // maxParallelForks = 2, measured against this codebase, not guessed.
    //
    // Decisions:
    // After the BCrypt cost-factor lever landed, `./gradlew test --rerun-tasks` averaged 370.5s over 2 runs at the
    // Gradle default of 1 fork; at 2 forks it averaged 276.5s (283s, 270s), beating the 1-fork average by far
    // more than the documented ~18s run-to-run variance. 4 forks were worse (277s, 267s avg) and only one of its
    // two runs cleared the variance bar, so 4 was not adopted. Safe because each Gradle test-worker fork is a
    // separate JVM with its own classloader, so AbstractPostgresContainerTest's `static { postgres.start(); }`
    // runs once per fork: N forks means N independent PostgreSQL containers and databases, so the
    // `@AfterEach`-deletion isolation model (which only wipes its own fork's database) is untouched. Every run:
    // `.planning/quick/260811-ixj-investigate-and-implement-test-suite-spe/260811-ixj-MEASUREMENTS.md`.
    maxParallelForks = 2

    // finalizedBy makes `./gradlew test` alone (CI's own invocation) enforce the coverage ratchet below.
    //
    // Gradle's jacoco plugin does NOT wire jacocoTestCoverageVerification into `check`, and CI never runs `check`
    // (it runs `test` and `spotlessCheck` separately), so without this line the gate would silently never fire.
    // finalizedBy, not dependsOn, is deliberate: it runs verification strictly after test's JaCoCo `.exec` file is
    // written, and still reports the build as failed if the ratchet trips though `test` itself went green.
    finalizedBy jacocoTestCoverageVerification

    // Same "CI never runs `check`" reasoning applies to verifyRuntimeDependencyFloor (defined below).
    //
    // dependsOn, not finalizedBy: it needs no ordering against test's artifacts and should fail in seconds, before
    // the five-minute suite runs. Referenced by name because this block executes before the task is registered
    // further down; Gradle resolves string-named task dependencies lazily at task-graph time.
    dependsOn 'verifyRuntimeDependencyFloor'
}

// Pre-commit-hook-only fast test gate: the same suite as `test` minus classes tagged `@Tag("kafka")` or
// `@Tag("realSocket")`.
//
// `test` itself is untouched: CI and any direct `./gradlew test` still run everything. Membership is an opt-in
// per-class decision: a new test class runs here by default and earns a tag only if it genuinely needs Kafka
// or a real socket. It still covers ArchUnit's LayeringArchTest and all unit/service tests without the slower
// container-backed suite on every commit. The filter lives here because Gradle's `test` task has no CLI flag
// for exclusion patterns (only inclusion via `--tests`).
tasks.register('fastTest', Test) {
    description = 'Runs the test suite excluding classes tagged kafka or realSocket; used by the pre-commit hook only.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty "spring.profiles.active", "test"
    useJUnitPlatform {
        excludeTags 'kafka', 'realSocket'
    }
    // maxParallelForks = 2, measured against this codebase, not guessed.
    //
    // Decisions:
    // After the BCrypt lever, `./gradlew fastTest --rerun-tasks` averaged 285.0s over 2 runs at 1 fork; at 2 forks
    // it averaged 242.5s (233s, 252s), beating the 1-fork average by far more than the ~18s run-to-run variance.
    // A live container census during a 2-fork run showed exactly 2 PostgreSQL containers (one per fork) and,
    // since `fastTest` is not Redpanda-free (HistoricalActivityEventReconstructorTest extends
    // AbstractKafkaContainerTest with no @Tag), up to 1 Redpanda container against this machine's 7.728 GiB
    // Docker budget; no run failed on container startup or memory. 4 forks were worse (277s, 267s avg) and only
    // one of its two runs cleared the variance bar, so 4 was not adopted. Safe because each Gradle test-worker
    // fork is a separate JVM with its own classloader, so AbstractPostgresContainerTest's `static {
    // postgres.start(); }` runs once per fork: N forks means N independent PostgreSQL containers and databases,
    // so the `@AfterEach`-deletion isolation model (which only wipes its own fork's database) is untouched.
    // Every run: `.planning/quick/260811-ixj-investigate-and-implement-test-suite-spe/260811-ixj-MEASUREMENTS.md`.
    maxParallelForks = 2
    // forkEvery is deliberately left at its default of 0 (one JVM handles every class assigned to it).
    //
    // Any non-zero value restarts the JVM per class, and so restarts AbstractPostgresContainerTest's static
    // Testcontainers initializer per class, which on this codebase is catastrophic rather than merely slower
    // (`.planning/quick/260811-ixj-investigate-and-implement-test-suite-spe/260811-ixj-RESEARCH.md`).

    // No JaCoCo agent on fastTest: the pre-commit hook runs it on every commit, and instrumentation adds 5-20%
    // wall clock for a signal nobody reads at commit time.
    //
    // `jacoco { enabled = false }` overrides the JacocoPlugin's default of attaching its agent to every Test-typed
    // task; without it fastTest would be instrumented too.
    jacoco {
        enabled = false
    }
}

// --- JaCoCo coverage reporting and gating ----------------------------------------------------
// Attached to `test` only; `fastTest` opts out via `jacoco { enabled = false }` in its own block.

// Shared generated-code exclusions: jacocoTestReport (the human-readable number) and
// jacocoTestCoverageVerification (the enforced ratchet) MUST compute over the identical denominator.
//
// A verification checked against a different set of excluded classes than the report a human read when the
// baseline was measured could silently pass or fail for a reason unrelated to real coverage. Defined once,
// reused by both tasks below.
def jacocoGeneratedCodeExcludes = [
        // MapStruct's generated *Impl.class mappers, compiled into the same classes dir as hand-written code.
        //
        // Every @Mapper interface generates a sibling <InterfaceName>Impl with no hand-written logic to lose
        // coverage visibility on.
        '**/mapper/*MapperImpl.class',
        // gradle-avro-plugin's codegen output (build/generated-main-avro-java), as a class-file pattern.
        //
        // Every generated Avro record's top-level class name starts with "Avro" (e.g. AvroBoardCreatedEvent): narrow
        // enough to exclude the records and their inner Builder/SchemaStore classes while keeping the hand-written
        // ActivityEventAvroMapper.class, which lives in the same event/avro package without the "Avro" prefix.
        '**/event/avro/Avro*.class'
]

jacoco {
    // Pinned to an exact release, not left floating: an unreviewed upstream release must not change
    // coverage-report behaviour, or which classes participate in the denominator, under a future build.
    //
    // Mirrors the pinning of errorprone and the avro plugin. 0.8.12 is Gradle 8.11.1's own bundled default for
    // this wrapper (verified with a throwaway `println jacoco.toolVersion` task before pinning) and a known-good
    // combination for the Java 21 toolchain.
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        // XML is not enabled by default and is required by any machine-checkable consumer; HTML is the
        // human-readable verification artifact.
        xml.required = true
        html.required = true
    }

    // Make the coverage denominator honest: generated-code sources would otherwise dilute or inflate the numbers.
    //
    // Applied via afterEvaluate against classDirectories (not sourceDirectories) because exclusion is by compiled
    // class-file pattern, matching how JaCoCo attributes probes to classes at report time.
    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: jacocoGeneratedCodeExcludes)
                })
        )
    }
    // Lombok's generated members are inline in hand-written classes, so no path or class-name pattern can exclude
    // them; JaCoCo's built-in filter handles members carrying lombok.config's addLombokGeneratedAnnotation.
}

// --- JaCoCo coverage ratchet ------------------------------------------------------------------
// A drift alarm, not a proof of adequacy: the minimums sit a few points BELOW the measured baseline.
//
// Decisions:
// Rung chosen 2026-08-12 from the measured baseline of 91.23% instruction / 90.93% line / 78.62% branch
// coverage on hand-written src/main code (Lombok/MapStruct/Avro excluded, see jacocoGeneratedCodeExcludes).
// Set below, not equal to, those numbers because an exact-equality gate would spuriously fail the next PR on
// ordinary code-shape noise (a new branch, a slightly different line count) that is not a coverage
// regression. A green jacocoTestCoverageVerification means "no class went dark since 2026-08-12", not
// "this codebase is well tested".
// Two pre-existing gaps this ratchet deliberately does NOT force closed, accepted as baseline: the
// zero-coverage atLeastOneFieldPopulated() validators on UpdateTaskRequestDTO/UpdateSubtaskRequestDTO
// (`.planning/quick/260812-eg8-investigate-test-coverage-gap-tracking-j/260812-eg8-MEASUREMENTS.md`, Section 1).
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.90
            }
            limit {
                counter = 'LINE'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.75
            }
        }
    }

    // Same generated-code exclusions as jacocoTestReport above; the ratchet and the report MUST share one denominator.
    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: jacocoGeneratedCodeExcludes)
                })
        )
    }
}

// --- Runtime dependency floor check ----------------------------------------------------------
// Guards the commons-lang3 `implementation` scope against silent regression to test-only scope.
//
// Decisions:
// A JUnit test cannot prove this: the test JVM runs on `testRuntimeClasspath`, which was already correct for
// the entire period `runtimeClasspath` (the configuration `bootJar` packages into the production Docker
// image) resolved a vulnerable version. A test asserting the version via the test classpath would have been
// green throughout; only a check that resolves `configurations.runtimeClasspath` itself can observe what
// this guards.
// Wired to `test` via `dependsOn` above, not `check`: CI runs `test` and `spotlessCheck` and never `check`,
// the reasoning recorded for `finalizedBy jacocoTestCoverageVerification`. Not wired into `fastTest`: it stays
// lean (it already opts out of the JaCoCo agent for the same reason), and a dependency-scope regression is
// not introduced accidentally mid-feature.
// One entry today; the map shape makes the next floor one line. A module absent from `runtimeClasspath`
// entirely fails loudly rather than silently matching nothing: a floor that can no longer find its target
// has quietly stopped checking.
def runtimeDependencyFloors = [
        'org.apache.commons:commons-lang3': '3.21.0'
]

tasks.register('verifyRuntimeDependencyFloor') {
    description = 'Fails the build if a pinned runtime-scope dependency resolves below its ' +
            'floor version on configurations.runtimeClasspath -- the configuration bootJar ' +
            'actually packages into the production Docker image.'
    group = 'verification'

    // Capture at configuration time into a Provider read only inside doLast, so the task stays
    // configuration-cache compatible (as with the providers.exec use in the git-hooks block below).
    //
    // resolvedArtifacts() is a Provider<Set<ResolvedArtifactResult>>; each element's id.componentIdentifier, when
    // a ModuleComponentIdentifier, carries group/module/version (verified against Gradle 8.11.1).
    def resolvedArtifacts = configurations.runtimeClasspath.incoming.artifacts.resolvedArtifacts

    doLast {
        def versionPattern = ~/^(\d+)\.(\d+)\.(\d+)/

        def resolvedVersions = [:]
        resolvedArtifacts.get().each { artifact ->
            def componentId = artifact.id.componentIdentifier
            if (componentId instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                resolvedVersions["${componentId.group}:${componentId.module}"] = componentId.version
            }
        }

        runtimeDependencyFloors.each { coordinate, floorVersion ->
            def resolvedVersion = resolvedVersions[coordinate]
            if (resolvedVersion == null) {
                throw new GradleException(
                        "verifyRuntimeDependencyFloor: '${coordinate}' is absent from " +
                                "configurations.runtimeClasspath entirely -- this floor check has " +
                                "quietly stopped checking anything. Update or remove the floor entry.")
            }

            def floorMatcher = versionPattern.matcher(floorVersion)
            def resolvedMatcher = versionPattern.matcher(resolvedVersion)
            if (!floorMatcher.find() || !resolvedMatcher.find()) {
                throw new GradleException(
                        "verifyRuntimeDependencyFloor: could not parse a major.minor.patch shape " +
                                "out of floor='${floorVersion}' or resolved='${resolvedVersion}' for " +
                                "'${coordinate}' -- refusing to fall back to a silently-wrong string " +
                                "comparison.")
            }

            def floorParts = (1..3).collect { floorMatcher.group(it) as int }
            def resolvedParts = (1..3).collect { resolvedMatcher.group(it) as int }

            // Explicit element-wise major/minor/patch comparison, not List#<=>.
            //
            // Groovy's spaceship operator on two plain ArrayLists throws ClassCastException at runtime (verified against
            // Gradle 8.11.1's bundled Groovy) rather than comparing component-wise.
            def isBelowFloor = false
            for (int i = 0; i < 3; i++) {
                if (resolvedParts[i] != floorParts[i]) {
                    isBelowFloor = resolvedParts[i] < floorParts[i]
                    break
                }
            }

            if (isBelowFloor) {
                throw new GradleException(
                        "verifyRuntimeDependencyFloor: '${coordinate}' resolves to " +
                                "'${resolvedVersion}' on configurations.runtimeClasspath, below the " +
                                "required floor '${floorVersion}'. This is the production classpath " +
                                "bootJar packages -- see the dependencies-block comment above this " +
                                "entry for why the floor exists.")
            }
        }
    }
}

// --- OWASP dependency-check configuration -----------------------------------------------------
// Configure the plugin only; dependencyCheckAnalyze is wired into no other task here (see the plugins block).
dependencyCheck {
    // 11 = never fail (no CVSS score reaches 11). Explicit though it is the plugin's default: the gate strength is
    // the decision, and a reader should not have to know the default to see the rung.
    failBuildOnCVSS = 11

    // HTML is the human-readable report (with a per-finding "suppress" button emitting ready-to-paste XML);
    // JSON is the machine-readable form for a future CI consumer.
    //
    // Deliberately not SARIF: its only value is uploading to GitHub code scanning, which depends on a
    // repository entitlement not to be assumed.
    formats = ['HTML', 'JSON']

    // Name the production surface positively instead of enumerating every test/annotationProcessor/errorprone
    // configuration to skip.
    //
    // Accepted risk: a future second production configuration (e.g. a second source set) would default to
    // UNSCANNED, not scanned. For this single-module Spring Boot app, where bootJar packages exactly
    // runtimeClasspath, that surface is the whole of production today. The motivating example is the
    // commons-lang3 bug (a testImplementation pin that never touched runtimeClasspath).
    scanConfigurations = ['runtimeClasspath']

    nvd {
        // From the environment only, never a literal; .github/workflows/security-scan.yml supplies it from
        // secrets.NVD_API_KEY.
        apiKey = System.getenv('NVD_API_KEY')
        // nvd.delay is left at its default (3500ms with a key, 8000ms without). nvd.datafeedUrl is left unset: no
        // public mirror exists.
        //
        // Both historically-cited mirror URLs (jeremylong.github.io/vulnz and
        // jeremylong.github.io/Open-Vulnerability-Project) return 404; the setting now means "a mirror you host
        // yourself with the vulnz CLI", infrastructure this project does not take on.
    }

    // Deliberately no suppressionFile and no suppression XML file: pointing at a non-existent file fails the
    // task, and pre-writing suppressions before a real run creates permanent blind spots.
    //
    // Specifically NOT pre-suppressed: com.google.guava:guava, which has a documented dependency-check
    // false-positive history and whose "-android" classifier is a plausible CPE tripwire, but carries zero real
    // advisories (OSV query). If a real scan flags it, that is a false positive worth suppressing with that
    // evidence cited; suppressing it pre-emptively would blind the repo to a future real Guava CVE.
}

// --- Schema Registry registration ---------------------------------------------------------
// The sole sanctioned writer of schemas; the producer only looks them up (auto.register.schemas=false).
//
// AbstractKafkaContainerTest's static initializer calls the same AvroSchemaRegistrar.registerAll() this task
// invokes, so test-time and build-time registration cannot drift apart (docs/CODE_STYLE.md rule 8).
tasks.register('registerSchemas', JavaExec) {
    description = 'Registers all 14 Avro schemas against the Schema Registry with BACKWARD ' +
            'compatibility (SCHEMA-01, SCHEMA-04, D-02).'
    group = 'kafka'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.vrudenko.kanban_board.config.AvroSchemaRegistrar'
    def registryUrl = project.findProperty('schemaRegistryUrl')
            ?: System.getenv('SCHEMA_REGISTRY_URL')
            ?: 'http://localhost:8081'
    args(registryUrl)
}

// --- Historical schema rehearsal ---------------------------------------------------------
// Rehearses the new Avro schemas against real historical activity_log rows; tagged 'rehearsal' and excluded from `test`.
//
// Decisions:
// Filtered by tag, not class name, mirroring fastTest's precedent: Gradle's `test` task offers inclusion via
// `--tests` but no declarative exclusion, so the filter lives in the build script either way.
// Deliberately does NOT set spring.profiles.active=test, unlike `test` and `fastTest`: Spring then resolves
// application.properties' default datasource, which points at a real Postgres via the
// DB_HOST/DB_NAME/DB_USER/DB_PASS variables the running application uses (see
// HistoricalSchemaRehearsalE2ETest's Javadoc), which is what lets this task read genuine historical rows
// instead of an empty, freshly-created per-run Testcontainers database.
tasks.register('rehearseHistoricalSchemas', Test) {
    description = 'Rehearses the new Avro schemas against real historical activity_log rows ' +
            '(SCHEMA-06). Requires DB_HOST/DB_NAME/DB_USER/DB_PASS pointed at a real Postgres ' +
            'instance holding historical activity_log data, and Docker for the Testcontainers ' +
            'Redpanda broker/registry.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'rehearsal'
    }
}

// --- ErrorProne ---------------------------------------------------------------
// Compile-time bug detection (null derefs, ignored return values, self-assignment, misused APIs) that Spotless cannot see.
//
// Decisions:
// ErrorProne runs as a javac plugin, not a separate Gradle task, so it is on every build path that runs
// `compileJava`/`compileTestJava` (`./gradlew test`, CI, the Dockerfile's `./gradlew bootJar`) with no CI
// edits.
// Both `net.ltgt.errorprone` (plugin) and `error_prone_core` (analyzer) are pinned to exact versions: the
// enabled check set is versioned by the error_prone_core coordinate, so a floating version would let an
// upstream release add a new ERROR-severity check and red CI/the Docker build with zero local code change.
// A bump is a deliberate, reviewable change.
// `build/generated/**` (MapStruct's generated `*Impl.java` mappers) is excluded via a path regex, and
// `disableWarningsInGeneratedCode` suppresses warnings on annotation-processor output; neither is
// hand-written code a developer can act on. `build/generated-main-avro-java/**` (gradle-avro-plugin output)
// joins as generated code. The regex uses explicit alternation, not a looser glob, so it matches both
// directories precisely rather than every `build/generated*` name.
// Gate strength was chosen from a MEASURED run: 5 main-source findings (3 UnusedVariable, 1
// StringCaseLocaleUsage, 1 FutureReturnValueIgnored), all fixed in source, not suppressed. Test sources
// carried a 27-finding backlog (FutureReturnValueIgnored/StringCaseLocaleUsage/MissingOverride/NotJavadoc/
// DefaultCharset), since triaged to zero (each fixed in source or dropped with a written reason at its call
// site), and severity demotion was removed from compileTestJava below, so test sources meet the same
// compile-time standard as main sources.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*[/\\\\]build[/\\\\](generated|generated-main-avro-java)[/\\\\].*'
    }
}

// compileTestJava is deliberately STRICTER than compileJava on exactly the five checks the test backlog
// was triaged against.
//
// Reintroducing any of FutureReturnValueIgnored, StringCaseLocaleUsage, MissingOverride, NotJavadoc or
// DefaultCharset now fails the build instead of warning. The promotion is scoped to these five named checks,
// not a blanket all-warnings-are-errors flip, so an error_prone_core bump cannot red the build by introducing
// an unrelated new check (the version-pinning rationale above). The asymmetry is intentional: compileJava
// has no equivalent promotion. A full compile on 2026-10-06 reported zero warnings in main sources, so the
// gap is a policy choice, not a backlog.
tasks.named('compileTestJava') {
    options.errorprone.error(
            'FutureReturnValueIgnored',
            'StringCaseLocaleUsage',
            'MissingOverride',
            'NotJavadoc',
            'DefaultCharset')
}

// --- Git hooks bootstrap ---------------------------------------------------
// Point this clone at .githooks/ so the pre-commit hook is armed on a fresh checkout with no manual step.
//
// Decisions:
// Dev setup must be automated (docs/CODE_STYLE.md rule 8). Runs at configuration time so it fires on ANY
// ./gradlew command, not only on builds that compile. Idempotent: it re-probes each configuration phase and
// writes only when the effective value is missing or wrong, so the steady state is one cheap process spawn
// and no output. Never fails the build: skipped when there is no .git (exported source tree), and any
// failure of the underlying command (missing binary, unset key exiting 1) is swallowed. providers.exec is
// used rather than ProcessBuilder/project.exec because it is the configuration-cache-compatible way to run
// an external process here.
def desiredHooksPath = '.githooks'
def repoRoot = rootProject.projectDir

if (rootProject.file('.git').exists()) {
    try {
        // Read the EFFECTIVE value (system/global/local merged) - that is what git
        // will actually resolve hooks from.
        def currentHooksPath = providers.exec {
            commandLine 'git', 'config', '--get', 'core.hooksPath'
            workingDir = repoRoot
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()

        if (currentHooksPath != desiredHooksPath) {
            // Write LOCAL only - never touch the developer's global/system config.
            providers.exec {
                commandLine 'git', 'config', '--local', 'core.hooksPath', desiredHooksPath
                workingDir = repoRoot
                ignoreExitValue = true
            }.result.get()
            logger.lifecycle("Configured git core.hooksPath -> ${desiredHooksPath} (pre-commit hook armed)")
        }
    } catch (Exception ignored) {
        // git unavailable or not a usable work tree: leave hooks unconfigured and
        // carry on. A build must never fail because of hook wiring.
    }
}
