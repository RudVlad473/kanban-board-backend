plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'com.diffplug.spotless' version '7.0.2'
    id 'net.ltgt.errorprone' version '5.1.0'

    // Compiles src/main/avro/*.avsc into generated SpecificRecord classes at build time
    // (Phase 4, Schema Registry). Pinned exactly: the project was archived by its owner on
    // 2026-12-28 and donated to the Apache Avro project, so 1.9.1 is its final, permanent
    // release -- no future patch is coming. It remains functionally complete for plain
    // .avsc-based codegen with built-in logical types, which is all this project needs.
    id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'com.vrudenko'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        googleJavaFormat().aosp()
        target 'src/**/*.java'
        formatAnnotations()

        // Explicit 5-group import order, each group blank-line separated: java.*, javax.*,
        // com.vrudenko.* (first-party), everything else third-party (the '' catch-all --
        // jakarta.*, org.springframework.*, io.*, com.github.*, com.fasterxml.*, ...), then
        // static imports last. The doubled backslash in '\\#' is Groovy string-escaping
        // producing the single literal token '\#' that Spotless's ImportSorterImpl actually
        // matches static imports on (verified against spotless-lib-3.0.2.jar's constant pool).
        // The javax group currently matches zero imports -- Spring Boot 3 uses jakarta.* --
        // and is retained as deliberate future-proofing, not a mistake to tidy away.
        importOrder('java', 'javax', 'com.vrudenko', '', '\\#')

        removeUnusedImports()
    }
}

test {
    systemProperty "spring.profiles.active", "test"
}

repositories {
    mavenCentral()

    // io.confluent artifacts (kafka-avro-serializer and its transitive schema-registry
    // client) are not published to Maven Central -- Confluent publishes only to its own repo.
    maven { url 'https://packages.confluent.io/maven/' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    compileOnly 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'
    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.postgresql:postgresql'

    // Flyway version is BOM-managed by Spring Boot 3.5.0 (pinned to 11.7.2 in
    // spring-boot-dependencies) -- deliberately left unversioned so a future Spring Boot
    // bump moves both artifacts together, matching this project's existing precedent of
    // leaving Spring-managed deps unversioned (spring-kafka, postgresql driver above).
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Backs the spring.session.* properties in application.properties (store-type=jdbc,
    // initialize-schema=always). Those properties predate this dependency and were silently
    // inert without it -- sessions were plain in-memory Tomcat HttpSession despite the config
    // claiming otherwise. Nothing in src/main imports org.springframework.session, so this line
    // looks unused to a naive dependency audit; it is not -- do not remove it.
    // https://mvnrepository.com/artifact/org.springframework.session/spring-session-jdbc
    implementation 'org.springframework.session:spring-session-jdbc'

    // https://mvnrepository.com/artifact/com.google.guava/guava
    implementation 'com.google.guava:guava:32.0.1-android'

    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    // Bumped from the previously-pinned 3.0 (Phase 4, Task 3 regression fix): Spring Boot's
    // dependency-management plugin forces an explicitly-declared version project-wide, so the
    // old 3.0 pin was silently downgrading every transitive commons-lang3 request -- including
    // commons-compress 1.28.0's, newly pulled in by org.apache.avro:avro:1.12.1 -- to 3.0.
    // commons-compress's TarArchiveOutputStream (used by Testcontainers to copy files into a
    // container) calls commons-lang3's ArrayFill, added in 3.11, so the forced-down 3.0 broke
    // container startup with a NoClassDefFoundError in 3 existing Kafka Testcontainers E2E
    // tests (ActivityLogConsumerE2ETest, ActivityLogDeadLetterE2ETest,
    // ActivityLogIdempotencyE2ETest) the moment the Avro dependency landed on the classpath.
    // 3.18.0 matches the highest version already requested transitively, so it resolves cleanly
    // against every other caller too.
    testImplementation 'org.apache.commons:commons-lang3:3.18.0'

    // https://mvnrepository.com/artifact/org.fluttercode.datafactory/datafactory
    testImplementation 'org.fluttercode.datafactory:datafactory:0.8'

    implementation 'io.vavr:vavr:0.10.4'

    testImplementation 'org.springframework.security:spring-security-test'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-collections4
    implementation("org.apache.commons:commons-collections4:4.5.0")

    implementation 'com.github.f4b6a3:ulid-creator:5.2.0'

    // https://mvnrepository.com/artifact/org.springdoc/springdoc-openapi-starter-webmvc-ui
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8")

    // https://mvnrepository.com/artifact/io.rest-assured/rest-assured
    testImplementation("io.rest-assured:rest-assured:5.5.5")

    implementation 'org.springframework.kafka:spring-kafka'

    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // Avro core: schema model, binary encoder/decoder, SpecificRecord/SpecificRecordBase
    // runtime support -- required at runtime by every class the avro plugin generates.
    implementation 'org.apache.avro:avro:1.12.1'

    // Confluent's KafkaAvroSerializer/KafkaAvroDeserializer + Schema Registry REST client.
    // The kafka-clients exclude exists so Spring Boot's BOM-managed kafka-clients (already
    // pulled in via spring-kafka above) stays the single resolved version on the classpath --
    // without it, Confluent's own transitive kafka-clients could fork the dependency tree.
    //
    // The swagger-annotations exclude (todo 2026-08-09-fix-broken-api-docs-swagger-endpoint-
    // swagger-annotations-ver.md) fixes a real production defect: this dependency's own
    // transitive kafka-schema-registry-client:7.8.9 depends on the pre-jakarta
    // io.swagger.core.v3:swagger-annotations:2.1.10, which shares the exact package
    // (io.swagger.v3.oas.annotations) with io.swagger.core.v3:swagger-annotations-jakarta:2.2.30
    // that SpringDoc 2.8.8 (below) actually needs. Gradle cannot dedupe them because their
    // artifact IDs differ, so both landed on the runtime classpath and whichever jar's Parameter
    // class the JVM classloader happened to load first won -- in practice the older 2.1.10 class,
    // which is missing the validationGroups() method SpringDoc calls, causing every
    // GET /api/docs request to 500 with NoSuchMethodError. Removing the pre-jakarta artifact is
    // safe precisely because swagger-annotations-jakarta supplies the same package and class
    // names, so kafka-schema-registry-client's references still resolve, just from the other jar.
    implementation('io.confluent:kafka-avro-serializer:7.8.9') {
        exclude group: 'org.apache.kafka', module: 'kafka-clients'
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // RedpandaContainer exposes both getBootstrapServers() and getSchemaRegistryAddress()
    // from a single container -- no explicit version, deferring to Spring Boot's managed
    // testcontainers BOM, matching org.testcontainers:kafka above. Resolved version recorded
    // in 04-01-SUMMARY.md for Plan 02.
    testImplementation 'org.testcontainers:redpanda'

    // No explicit version -- BOM-managed by Spring Boot 3.5.0 exactly like the
    // org.testcontainers:kafka/redpanda/junit-jupiter lines above, resolving to the same
    // 1.21.0 release train those already use (04.2-RESEARCH.md, verified live via
    // `./gradlew dependencies --configuration testRuntimeClasspath`). 04.2-02 completes the
    // cutover this tracer started: com.h2database:h2 is now removed entirely (D-05), so
    // AbstractPostgresContainerTest's container is the only datasource left for the whole suite.
    testImplementation 'org.testcontainers:postgresql'

    // gradle-avro-plugin 1.9.1 + Avro 1.12.1 codegen observation (Task 1 probe, this session):
    // for AvroTaskMovedEvent (fields declared with the "uuid" and "timestamp-millis" logical
    // types), getEventId() returns java.util.UUID and getTimestamp() returns java.time.Instant
    // natively -- both logical-type-to-Java-type conversions are built in, no manual
    // UUID.fromString()/Instant.ofEpochMilli() conversion needed anywhere in the mapper.
    // See ActivityEventAvroMapper (Task 3).

    // https://mvnrepository.com/artifact/com.tngtech.archunit/archunit-junit5
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
}

// The `rehearsal` tag (HistoricalSchemaRehearsalE2ETest, SCHEMA-06) is excluded here: the
// per-run Testcontainers PostgreSQL database backing every other test class is created fresh on
// every run and is empty by construction, so folding this rehearsal into `test` would guarantee
// either a permanent failure (its corpus-empty gate firing on every single run) or, if that gate
// were ever weakened, a permanently vacuous pass -- neither answers what SCHEMA-06 needs
// answered. See rehearseHistoricalSchemas below for the dedicated, build/CI-invocable task this
// rehearsal actually runs under, against a real historical Postgres instance.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'rehearsal'
    }
    // maxParallelForks = 2 (quick task 260811-ixj, lever 2): measured against this codebase, not
    // guessed. After lever 1 (BCrypt cost factor, above) landed, `./gradlew test --rerun-tasks`
    // averaged 370.5s over 2 runs at the Gradle default of 1 fork; at 2 forks it averaged 276.5s
    // (283s, 270s) -- both runs beat the 1-fork average by far more than this project's
    // documented ~18s run-to-run variance. Measured at 4 forks too: worse (277s, 267s avg), and
    // only one of its two runs cleared the variance bar against the 1-fork baseline, so 4 was not
    // adopted. Safe here specifically because each Gradle test-worker fork is a separate JVM with
    // its own classloader, so AbstractPostgresContainerTest's `static { postgres.start(); }` runs
    // once per fork -- N forks means N independent PostgreSQL containers and N independent
    // databases, so the D-02 `@AfterEach`-deletion isolation model (which only ever wipes its own
    // fork's database) is untouched. See 260811-ixj-MEASUREMENTS.md for every run.
    maxParallelForks = 2
}

// Pre-commit-hook-only fast test gate. `test` itself is untouched above -- CI and
// any direct `./gradlew test` still run everything, Kafka- and real-socket-backed
// classes included. `fastTest` runs the same suite minus classes that genuinely need
// a real socket or a real Kafka broker, selected by explicit `@Tag("kafka")` /
// `@Tag("realSocket")` declaration on the class -- not by name. Gate membership is
// therefore an opt-in, per-class decision: a new test class runs in the pre-commit
// gate by default and only earns a tag if it genuinely needs Kafka or a real socket
// (D-21, D-22). This still covers ArchUnit's LayeringArchTest and all unit/service
// tests without paying for the slower container-backed suite on every commit.
// Gradle's `test` task has no CLI flag for exclusion patterns (only inclusion via
// `--tests`), so the filter has to live here rather than as a command-line option.
tasks.register('fastTest', Test) {
    description = 'Runs the test suite excluding classes tagged kafka or realSocket; used by the pre-commit hook only.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty "spring.profiles.active", "test"
    useJUnitPlatform {
        excludeTags 'kafka', 'realSocket'
    }
    // maxParallelForks = 2 (quick task 260811-ixj, lever 2): measured against this codebase, not
    // guessed. After lever 1 landed, `./gradlew fastTest --rerun-tasks` averaged 285.0s over 2
    // runs at the Gradle default of 1 fork; at 2 forks it averaged 242.5s (233s, 252s) -- both
    // runs beat the 1-fork average by far more than this project's documented ~18s run-to-run
    // variance. Live container census during a 2-fork run showed exactly 2 PostgreSQL containers
    // (one per fork) and, since `fastTest` is not Redpanda-free (HistoricalActivityEventReconstructorTest
    // extends AbstractKafkaContainerTest with no @Tag -- see the todo filed for that), up to 1
    // Redpanda container observed live against this machine's 7.728 GiB Docker budget; no run
    // failed on container startup or memory. Measured at 4 forks too: worse (277s, 267s avg) and
    // only one of its two runs cleared the variance bar against the 1-fork baseline, so 4 was not
    // adopted. Safe here specifically because each Gradle test-worker fork is a separate JVM with
    // its own classloader, so AbstractPostgresContainerTest's `static { postgres.start(); }` runs
    // once per fork -- N forks means N independent PostgreSQL containers and N independent
    // databases, so the D-02 `@AfterEach`-deletion isolation model (which only ever wipes its own
    // fork's database) is untouched. See 260811-ixj-MEASUREMENTS.md for every run.
    maxParallelForks = 2
    // forkEvery is deliberately left at its default of 0 (one JVM handles every class assigned
    // to it) -- any non-zero value restarts the JVM per class, and therefore restarts
    // AbstractPostgresContainerTest's static Testcontainers initializer per class too, which on
    // this codebase is catastrophic rather than merely slower (260811-ixj-RESEARCH.md).
}

// --- Schema Registry registration (SCHEMA-01) ---------------------------------
// Build/CI-invocable counterpart to the producer, which only ever looks schemas up
// (auto.register.schemas=false in application.properties) -- this task is the sole
// sanctioned writer of schemas. AbstractKafkaContainerTest's static initializer calls
// the same AvroSchemaRegistrar.registerAll() this task invokes, so test-time and
// build-time registration cannot drift apart (docs/CODE_STYLE.md rule 8).
tasks.register('registerSchemas', JavaExec) {
    description = 'Registers all 5 Avro schemas against the Schema Registry with BACKWARD ' +
            'compatibility (SCHEMA-01, SCHEMA-04, D-02).'
    group = 'kafka'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.vrudenko.kanban_board.config.AvroSchemaRegistrar'
    def registryUrl = project.findProperty('schemaRegistryUrl')
            ?: System.getenv('SCHEMA_REGISTRY_URL')
            ?: 'http://localhost:8081'
    args(registryUrl)
}

// --- Historical schema rehearsal (SCHEMA-06) -----------------------------------
// Build-step-only rehearsal of the new Avro schemas against real historical activity_log rows,
// tagged 'rehearsal' (HistoricalSchemaRehearsalE2ETest) and excluded from the default `test` task
// above for the same reason documented there. Filtered by tag rather than by class name, mirroring
// fastTest's precedent of keeping this kind of filter in the build script -- Gradle's `test` task
// offers inclusion via `--tests` on the CLI but no declarative exclusion, so the filter has to live
// here either way.
//
// Deliberately does NOT set systemProperty "spring.profiles.active", "test" -- unlike `test` and
// `fastTest` above. Spring therefore resolves application.properties' default datasource, which
// already points at a real Postgres instance via the DB_HOST/DB_NAME/DB_USER/DB_PASS environment
// variables the running application already uses (see HistoricalSchemaRehearsalE2ETest's Javadoc
// for the full reasoning) -- exactly what lets this task read genuine historical rows instead of
// an empty, freshly-created per-run Testcontainers PostgreSQL database.
tasks.register('rehearseHistoricalSchemas', Test) {
    description = 'Rehearses the new Avro schemas against real historical activity_log rows ' +
            '(SCHEMA-06). Requires DB_HOST/DB_NAME/DB_USER/DB_PASS pointed at a real Postgres ' +
            'instance holding historical activity_log data, and Docker for the Testcontainers ' +
            'Redpanda broker/registry.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'rehearsal'
    }
}

// --- ErrorProne ---------------------------------------------------------------
// Compile-time bug detection (null derefs, ignored return values, self-assignment,
// misused APIs) that Spotless cannot see, since Spotless only enforces formatting.
// ErrorProne runs as a javac plugin, not a separate Gradle task, so it is on every
// build path that already runs `compileJava`/`compileTestJava` - `./gradlew test`,
// CI, and the Dockerfile's `./gradlew bootJar` - with no CI edits required.
//
// Both `net.ltgt.errorprone` (plugin) and `error_prone_core` (analyzer) are pinned
// to exact versions rather than floated. The enabled check set is versioned by the
// error_prone_core coordinate, so a floating version means an upstream release with
// zero local code changes could add a new ERROR-severity check and red CI/the Docker
// build on its own. A version bump is a deliberate, reviewable change here instead.
//
// `build/generated/**` (MapStruct's generated `*Impl.java` mappers) is excluded via
// a path regex, and `disableWarningsInGeneratedCode` additionally suppresses
// warnings on annotation-processor output - neither is hand-written code a developer
// can act on a finding in. `build/generated-main-avro-java/**` (gradle-avro-plugin's
// codegen output, Phase 4) joins MapStruct's as generated, non-actionable code -- the
// regex below uses explicit alternation, not a looser glob, so it matches both
// directories precisely rather than every possible `build/generated*` name.
//
// Gate strength was chosen from a MEASURED run against this codebase (quick task
// 260802-qr8, Task 1): 5 main-source findings (3 UnusedVariable, 1
// StringCaseLocaleUsage, 1 FutureReturnValueIgnored), all fixed in source, not
// suppressed. Test sources carried a 27-finding backlog at that time
// (FutureReturnValueIgnored/StringCaseLocaleUsage/MissingOverride/NotJavadoc/
// DefaultCharset); quick task 260803-v23 triaged every one of those 27 to zero --
// each was either fixed in source or dropped with a written reason at its call
// site -- and severity demotion was removed from compileTestJava below, so test
// sources are held to the same compile-time standard as main sources.
tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*[/\\\\]build[/\\\\](generated|generated-main-avro-java)[/\\\\].*'
    }
}

// compileTestJava is deliberately made STRICTER than compileJava on exactly the five
// checks quick task 260803-v23 triaged the 27-finding test backlog against
// (FutureReturnValueIgnored, StringCaseLocaleUsage, MissingOverride, NotJavadoc,
// DefaultCharset): reintroducing any of the five now fails the build instead of only
// warning. The promotion is scoped to these five named checks, not a blanket
// all-warnings-are-errors flip, so a future error_prone_core version bump cannot red
// the build on its own by introducing an unrelated new check -- the same
// version-pinning rationale documented above for the check set as a whole. This
// asymmetry is an intentional, narrower gate on test sources, not an oversight:
// compileJava carries no equivalent promotion and still has an unfixed
// warning-severity EscapedEntity finding at UserMapper.java:23 that this change does
// not address (a main-source finding, out of this task's test-source scope).
tasks.named('compileTestJava') {
    options.errorprone.error(
            'FutureReturnValueIgnored',
            'StringCaseLocaleUsage',
            'MissingOverride',
            'NotJavadoc',
            'DefaultCharset')
}

// --- Git hooks bootstrap ---------------------------------------------------
// Points this clone at the version-controlled .githooks/ directory so the
// pre-commit spotlessApply hook is armed on a fresh checkout with no manual
// `git config` step (docs/CODE_STYLE.md rule 8: dev setup must be automated).
//
// Runs at configuration time so it fires on ANY ./gradlew command, not only on
// builds that compile. Idempotent: it re-probes each configuration phase and
// writes only when the effective value is missing or wrong, so the steady state
// is one cheap process spawn and no output.
//
// Never fails the build: skipped entirely when there is no .git (exported source
// tree), and any git failure (missing binary, unset key exiting 1) is swallowed.
// providers.exec is used rather than ProcessBuilder/project.exec because it is
// the configuration-cache-compatible way to run an external process here.
def desiredHooksPath = '.githooks'
def repoRoot = rootProject.projectDir

if (rootProject.file('.git').exists()) {
    try {
        // Read the EFFECTIVE value (system/global/local merged) - that is what git
        // will actually resolve hooks from.
        def currentHooksPath = providers.exec {
            commandLine 'git', 'config', '--get', 'core.hooksPath'
            workingDir = repoRoot
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()

        if (currentHooksPath != desiredHooksPath) {
            // Write LOCAL only - never touch the developer's global/system config.
            providers.exec {
                commandLine 'git', 'config', '--local', 'core.hooksPath', desiredHooksPath
                workingDir = repoRoot
                ignoreExitValue = true
            }.result.get()
            logger.lifecycle("Configured git core.hooksPath -> ${desiredHooksPath} (pre-commit hook armed)")
        }
    } catch (Exception ignored) {
        // git unavailable or not a usable work tree: leave hooks unconfigured and
        // carry on. A build must never fail because of hook wiring.
    }
}
