# GitRepository + Kustomization for the flux-system root itself. Plan 13-02 (D-15: SSH deploy
# key, no GitHub PAT -- see docs/INFRA_RUNBOOK.md's "Flux bootstrap without a PAT" section).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/RudVlad473/kanban-board-backend
  ref:
    branch: main
  secretRef:
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
