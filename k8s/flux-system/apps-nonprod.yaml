# Activated Plan 13-05 (D-02): nonprod cutover to k3s, Compose nonprod stopped in D-06 order.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-nonprod
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/overlays/nonprod
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: data
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: app
      namespace: kanban-nonprod
    - apiVersion: apps/v1
      kind: StatefulSet
      name: redpanda
      namespace: kanban-nonprod
  sourceRef:
    kind: GitRepository
    name: flux-system
