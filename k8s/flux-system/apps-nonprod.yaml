# The `edge` dependsOn exists because the nonprod Certificate and websecure IngressRoute need
# cert-manager's ClusterIssuers and Traefik's LoadBalancer edge first.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-nonprod
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/overlays/nonprod
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: platform
    - name: data
    - name: edge
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: app
      namespace: kanban-nonprod
    - apiVersion: apps/v1
      kind: StatefulSet
      name: redpanda
      namespace: kanban-nonprod
  sourceRef:
    kind: GitRepository
    name: flux-system
