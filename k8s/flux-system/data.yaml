# Flux Kustomization for k8s/data/postgres-bridge: the interim cross-runtime Postgres Service +
# EndpointSlice (Pattern 1). Plan 13-02. Depends on platform for the kanban-data namespace.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/data/postgres-bridge
  prune: true
  wait: true
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: flux-system
