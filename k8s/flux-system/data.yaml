# Flux Kustomization for the in-cluster Postgres StatefulSet in k8s/data/postgres. Depends on
# platform for the kanban-data namespace.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: data
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/data/postgres
  prune: true
  wait: true
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: flux-system
