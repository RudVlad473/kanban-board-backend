---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/monitoring/configs
  prune: true
  suspend: false
  dependsOn:
    - name: monitoring-controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
