---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/platform/cert-manager
  prune: true
  suspend: false
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: flux-system
