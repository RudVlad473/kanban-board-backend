# Plan 13-02. Unsuspended Plan 13-06 (W2), window step 11, only after the restore + parity diff
# are both clean and a docker ps guard confirms every Compose container is stopped (T-13-27).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-prod
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/overlays/prod
  prune: true
  wait: true
  suspend: false
  dependsOn:
    - name: data
    - name: edge
  sourceRef:
    kind: GitRepository
    name: flux-system
