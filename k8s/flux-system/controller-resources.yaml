# Strategic-merge patch for Flux's own gotk-components.yaml Deployments (Plan 13-09, D-07).
# gotk-components.yaml stays untouched -- it is Flux's own generated manifest (see its own
# header, "DO NOT EDIT") -- so the measured caps land here instead, listed under `patches:` in
# this directory's own kustomization.yaml.
#
# MEASURED (restart-ladder, 13-09, 2026-09-27): all 6 controllers share rungs (OOMKilled is
# reported per-container). Passing rungs 1Gi -> 512Mi -> 256Mi, failed at 128Mi
# (source-controller only: dmesg OOMKilled, anon-rss ~126.7MiB + file-rss ~57.5MiB against the
# 128Mi cap; the other 5 controllers stayed at RestartCount=0 through that same rung). Adopted
# 256Mi/64Mi for all 6 -- source-controller's own live cgroup usage measured ~150MiB against this
# cap immediately after independent re-verify, the other 5 all measured under 32MiB. Verified
# clean (RestartCount=0, full workload cycle) at the adopted value from a fresh recreate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        # MEASURED (restart-ladder, 13-09, 2026-09-27) -- see this file's header.
        - name: manager
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
