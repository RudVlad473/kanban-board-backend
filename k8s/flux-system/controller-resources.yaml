# Strategic-merge patch for the memory caps of Flux's gotk-components.yaml Deployments.
#
# MEASURED (restart ladder, 2026-09-27): all 6 controllers share rungs. They passed 1Gi, 512Mi and
# 256Mi and failed at 128Mi (source-controller only: dmesg OOMKilled, anon-rss ~126.7MiB + file-rss
# ~57.5MiB; the other 5 stayed at RestartCount=0). Adopted 256Mi limit / 64Mi request for all 6.
# source-controller measured ~150MiB live against that cap, the other 5 under 32MiB.
#
# Decisions:
# gotk-components.yaml is Flux's generated manifest ("DO NOT EDIT"), so the caps live here, listed
# under `patches:` in this directory's kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        # MEASURED (2026-09-27) -- see this file's header.
        - name: manager
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 256Mi
---
