# Flux Kustomization for k8s/platform: namespaces and the Traefik HelmChartConfig.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/platform
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
