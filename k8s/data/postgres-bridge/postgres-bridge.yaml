# Interim bridge: a selector-less Service plus a hand-authored EndpointSlice gives k3s pods a stable
# DNS name for the Compose Postgres container, which lives outside Kubernetes during the interim.
#
# Decisions:
# clusterIP is pinned to 10.43.54.32 so the final Postgres Service (same IP, name and namespace) is a
# drop-in replacement. EndpointSlice (discovery.k8s.io/v1), not the deprecated v1 Endpoints, so the
# StatefulSet's controller-managed slice cannot collide with this one. Deleting this Kustomization
# removes both objects together.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kanban-data
spec:
  clusterIP: 10.43.54.32
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-bridge
  namespace: kanban-data
  labels:
    kubernetes.io/service-name: postgres
addressType: IPv4
ports:
  - name: postgres
    port: 5432
    protocol: TCP
endpoints:
  # The docker0 bridge gateway on this host, where Compose Postgres publishes 5432. Reachable from
  # k3s pods because DOCKER-USER's `! -i eth0 -j RETURN` admits non-external-interface traffic
  # (proven live by a probe).
  - addresses:
      - "172.17.0.1"
