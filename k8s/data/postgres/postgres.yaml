# In-cluster Postgres: one instance serving both environments' databases via two roles.
#
# Reached cross-namespace as postgres.kanban-data.svc.cluster.local. The ClusterIP is pinned to
# 10.43.54.32 so clients keep the same DNS name and IP across the bridge-to-StatefulSet switch.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: 10.43.54.32
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
# Headless governing Service for the StatefulSet's per-replica DNS records; required even at one
# replica.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # Same tag as local dev and the Testcontainers suite.
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                # Created on the VM from env files, never committed. Keys: POSTGRES_USER POSTGRES_PASSWORD
                # PROD_DB_NAME PROD_DB_USER PROD_DB_PASS NONPROD_DB_NAME NONPROD_DB_USER NONPROD_DB_PASS
                # MONITORING_DB_PASS.
                name: postgres-init
          env:
            # Set explicitly so the image does not create a stray database named after the superuser.
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Small built-in defaults plus max_connections well below the stock 100. shared_buffers stays at
          # most a quarter of the 256Mi limit below (invariant I6).
          args:
            - -c
            - shared_buffers=64MB
            - -c
            - work_mem=4MB
            - -c
            - max_connections=25
            - -c
            - shared_preload_libraries=pg_stat_statements
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # Probe over TCP (-h 127.0.0.1): during initialization the entrypoint runs a temporary server
          # with listen_addresses empty, so a socket probe can report ready while init scripts still run.
          #
          # Decisions:
          # `$(POSTGRES_USER)` inside an exec probe's shell string is NOT expanded by Kubernetes; that
          # syntax only expands in `command`/`args`/`env.value`. The shell parsed it as command
          # substitution and pg_isready failed with "too many command-line arguments" (observed live,
          # 2026-09-26, `kubectl describe pod postgres-0`). `$POSTGRES_USER` is correct: the container
          # environment already carries it via `envFrom: postgres-init`.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -h 127.0.0.1 -U $POSTGRES_USER -d postgres"
            periodSeconds: 5
            failureThreshold: 8
          # MEASURED (2026-09-27): 65.5MiB peak working set, 24h max_over_time of
          # container_memory_working_set_bytes{namespace="kanban-data",container="postgres"}.
          #
          # The 128Mi request stays: anon+shmem held ~84MiB under a worst-case workload of 24 concurrent
          # backends and a ~127MB pgbench dataset (2026-08-26). Limits are the Compose-era 256m.
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
