# In-cluster Postgres (Phase 13 plan 04, D-05). Analog: docker-compose.prod.yml `postgres:`
# service -- same shared-instance-two-roles model (Phase 11 D-01), same -c flags, same 256m
# memory cap, Kubernetes-native shape. Namespace kanban-data (D-11), reached cross-namespace by
# both app namespaces via the Service's DNS name (postgres.kanban-data.svc.cluster.local).
#
# ClusterIP is pinned to 10.43.54.32 -- identical to k8s/data/postgres-bridge/postgres-bridge.yaml
# (13-02)'s own interim Service, so the 13-06 path switch (bridge -> this StatefulSet) updates
# clients in place with no DNS-name or IP change.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: 10.43.54.32
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
# Headless companion, not the StatefulSet's own governing Service -- serviceName below points at
# this one so each replica gets a stable, individually-addressable DNS record
# (<pod-ordinal>.postgres-headless.kanban-data.svc.cluster.local), matching the same headless
# pattern k8s/base/redpanda/redpanda.yaml already established. Replicas is 1 today, but the
# StatefulSet contract requires a headless governing Service regardless of replica count.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          # Same tag as local dev (docker-compose.yml) and the Testcontainers-backed test suite
          # (Phase 11 D-02) -- one Postgres version tested across every environment.
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                # Created on the VM from env files in 13-06 (D-10), never committed. Keys:
                # POSTGRES_USER POSTGRES_PASSWORD PROD_DB_NAME PROD_DB_USER PROD_DB_PASS
                # NONPROD_DB_NAME NONPROD_DB_USER NONPROD_DB_PASS MONITORING_DB_PASS.
                name: postgres-init
          env:
            # Set explicitly so the image does not create a stray database named after the
            # superuser (POSTGRES_DB defaults to POSTGRES_USER's value when unset) -- same
            # rationale as docker-compose.prod.yml's own postgres.environment.POSTGRES_DB.
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # D-11: deliberately the engine's own small built-in defaults plus a max_connections
          # well below the stock 100 -- carried LITERALLY from docker-compose.prod.yml's own
          # postgres.command (Plan 11-08 correction: shared_buffers halved from 128MB to 64MB so
          # it stays at most a quarter of the 256Mi limit below, verified by I6). Not re-derived.
          args:
            - -c
            - shared_buffers=64MB
            - -c
            - work_mem=4MB
            - -c
            - max_connections=25
            - -c
            - shared_preload_libraries=pg_stat_statements
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          # -h 127.0.0.1 is load-bearing: during initialization the image's entrypoint runs a
          # temporary server with listen_addresses empty, so a socket-based probe can report
          # ready while the init scripts are still running. Forcing TCP means ready cannot be
          # reached until the real server is listening -- same rationale as the Compose
          # healthcheck this readiness probe replaces.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "pg_isready -h 127.0.0.1 -U $(POSTGRES_USER) -d postgres"
            periodSeconds: 5
            failureThreshold: 8
          # MEASURED (carried from docker-compose.prod.yml's postgres comment, Plan 11-03/11-08,
          # 2026-08-26) -- anon+shmem (the only irreclaimable memory that can actually force an
          # OOM-kill) held constant at ~84MiB regardless of cap or dataset size under a combined
          # worst-case workload (24 concurrent backends, ~127MB pgbench dataset). Requests rounded
          # up from that figure to the next 64Mi multiple (128Mi); limits carry the Compose
          # mem_limit (256m) unchanged. Re-confirmed in 13-09.
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
