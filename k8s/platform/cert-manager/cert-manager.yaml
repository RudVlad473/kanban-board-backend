# cert-manager via a Flux HelmRepository/HelmRelease; owns the ACME certificate lifecycle for all
# three hostnames.
#
# Decisions:
# Every object here sets an explicit `metadata.namespace` (HelmRepository in `flux-system`, as in
# k8s/monitoring/controllers/repositories.yaml): this directory's kustomization.yaml sets no top-level
# `namespace:`, so `kubectl apply` rejected the HelmRepository with "namespace not specified" (observed
# live 2026-09-26). `spec.targetNamespace: cert-manager` is separate: where the chart's objects land,
# not where the HelmRelease lives.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      # Pinned to v1.21.1, the latest v1.x stable as of 2026-09-25 (fixes a controller panic and a
      # Secret-informer regression from v1.21.0). Never `latest`.
      version: v1.21.1
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  install:
    createNamespace: true
  targetNamespace: cert-manager
  values:
    crds:
      enabled: true
      keep: true
    prometheus:
      # Enabled because kube-prometheus-stack provides the ServiceMonitor CRD this needs.
      enabled: true
      servicemonitor:
        enabled: true
    # MEASURED (restart ladder, 2026-09-27): all 3 components share rungs. They passed 128Mi and 64Mi and
    # failed at 32Mi (cainjector only: dmesg OOMKilled, anon-rss ~31.7MiB + file-rss ~25.8MiB). Adopted
    # 64Mi limit / 16Mi request for all three; cainjector's live cgroup usage was ~36MiB against that cap.
    resources:
      requests:
        memory: 16Mi
      limits:
        memory: 64Mi
    webhook:
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 64Mi
    cainjector:
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 64Mi
