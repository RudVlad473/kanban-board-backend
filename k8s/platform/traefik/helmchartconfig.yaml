# Traefik config for the k3s-packaged Traefik chart. Plan 13-02 (D-13's edge controller) shipped
# the interim NodePort topology (13-RESEARCH.md's "Interim state" diagram); Plan 13-06 (W1/W2)
# moved it to the production edge shape.
#
# W1: service.type LoadBalancer + externalTrafficPolicy Local (D-13, Pitfall 2 -- k3s ServiceLB
# would otherwise SNAT every client to one shared address, collapsing every client into one
# rate-limit bucket). websecure exposed: cert-manager/ClusterIssuers are live (edge.yaml
# unsuspended in W1) and the nonprod Certificate/websecure IngressRoute need it.
#
# W2 (this commit): the interim `ports.web.nodePort: 30080` pin is REMOVED. Caddy's nonprod
# upstream (172.17.0.1:30080) was its only consumer, kept alive through W1 specifically so Caddy
# had somewhere to proxy to until window step 6 stopped it. Landing this removal here, gated on
# window step 11's `docker ps` guard (every Compose container, Caddy included, confirmed stopped
# first), is deliberate -- removing it any earlier would break nonprod's only path to Traefik
# while Caddy was still running.
#
# PROVISIONAL (restart-ladder in 13-09): resource values below are k3s chart defaults, not yet
# measured on this host -- 13-09 replaces them with a measured figure the same way every other
# workload in this phase carries a MEASURED comment.
#
# resources.requests/limits keys confirmed against the packaged chart version via
# `k3s kubectl get helmchart traefik -n kube-system -o yaml` at install time (Task 2, VM steps).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Local
    ports:
      websecure:
        expose:
          default: true
    logs:
      access:
        enabled: true
        # format: json added Plan 13-08 (D-13 acceptance criterion) -- 13-02's original
        # `enabled: true` alone left the chart on its own default (Common Log Format), discovered
        # live while parsing the access log for the two-IP rate-limit proof: real lines came back
        # as `<ip> - - [date] "GET / HTTP/1.1" 404 ...`, not JSON, so a ClientHost/DownstreamStatus
        # field lookup silently matched nothing rather than erroring.
        format: json
