# Traefik config for the k3s-packaged Traefik chart: the production edge (LoadBalancer, websecure).
#
# Decisions:
# service.type LoadBalancer with externalTrafficPolicy Local: k3s ServiceLB would otherwise SNAT every
# client to one shared address, collapsing every client into one rate-limit bucket.
# The interim `ports.web.nodePort: 30080` pin is removed. Caddy's nonprod upstream (172.17.0.1:30080)
# was its only consumer, so removal waited for the `docker ps` guard confirming every Compose
# container, Caddy included, was stopped.
# MEASURED (restart ladder, 2026-09-27): passed 256Mi, 128Mi, 64Mi, 32Mi; failed at 16Mi (dmesg
# OOMKilled, anon-rss ~14.7MiB + file-rss ~75.3MiB). Adopted 64Mi limit / 32Mi request: one rung above
# the bare-passing 32Mi (~6.4MiB, ~25% headroom) because this is the only public ingress. Clean
# (RestartCount=0) under the standard workload cycle and scripts/loadtest/run-rate-limit-verification.sh's
# adversarial burst at every rung.
# resources.requests/limits keys were confirmed against the packaged chart via
# `k3s kubectl get helmchart traefik -n kube-system -o yaml`.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Local
    ports:
      websecure:
        expose:
          default: true
    # MEASURED (restart-ladder, 13-09, 2026-09-27) -- see this file's header for the full ladder.
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 64Mi
    logs:
      access:
        enabled: true
        # format: json added Plan 13-08 (D-13 acceptance criterion) -- 13-02's original
        # `enabled: true` alone left the chart on its own default (Common Log Format), discovered
        # live while parsing the access log for the two-IP rate-limit proof: real lines came back
        # as `<ip> - - [date] "GET / HTTP/1.1" 404 ...`, not JSON, so a ClientHost/DownstreamStatus
        # field lookup silently matched nothing rather than erroring.
        format: json
