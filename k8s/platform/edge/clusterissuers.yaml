# Both ClusterIssuers; every Certificate starts on letsencrypt-staging because premature production
# ACME issuance risks Let's Encrypt's real rate limits, and the production flip follows validation.
#
# Decisions:
# `email` is deliberately omitted on both: the Caddy edge this replaces registered with ACME without
# one, and an operator address should not be sent to the CA unless the operator supplies it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
