# Placeholder edge route that serves grafana-tls for the monitoring hostname until the real Grafana
# routes (k8s/monitoring/configs/ingressroute.yaml) replace it.
#
# Decisions:
# Without a router matching the hostname's SNI, Traefik falls back to its self-signed default cert
# (observed 2026-09-26: `openssl s_client -servername` returned `CN=TRAEFIK DEFAULT CERT` while the real
# Let's Encrypt cert sat in the grafana-tls Secret). The names `grafana` and `grafana-http` match the
# real routes. `grafana-placeholder` is a Service with no Endpoints, so Traefik answers 503, a clean
# "nothing here yet".
apiVersion: v1
kind: Service
metadata:
  name: grafana-placeholder
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-redirect-https
  namespace: monitoring
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kanban-board-rud-vlad-473-monitoring.duckdns.org`)
      kind: Rule
      services:
        - name: grafana-placeholder
          port: 80
  tls:
    secretName: grafana-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    # Same ACME-safe shape as the app-http routes (I10): the negation keeps cert-manager's HTTP-01 solver
    # path out of the redirect by construction.
    - match: Host(`kanban-board-rud-vlad-473-monitoring.duckdns.org`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares:
        - name: grafana-redirect-https
      services:
        - name: grafana-placeholder
          port: 80
