# Placeholder edge route for the monitoring hostname (Plan 13-06, added live during the
# maintenance window). certificate-monitoring.yaml (13-04) creates the Certificate and gets it
# issued via HTTP-01, but nothing in the phase up to this point creates a route that actually
# SERVES grafana-tls for this hostname's SNI -- without one, Traefik has no router matching
# `kanban-board-rud-vlad-473-monitoring.duckdns.org` and falls back to its own self-signed
# default cert, which the plan's own verify script (13-06-PLAN.md, "the monitoring host
# handshakes with a production certificate") catches: confirmed live 2026-09-26, `openssl
# s_client -servername kanban-board-rud-vlad-473-monitoring.duckdns.org` returned
# `CN=TRAEFIK DEFAULT CERT` instead of the real Let's Encrypt certificate already sitting in the
# grafana-tls Secret.
#
# 13-07's own plan text (Task 1) already assumes `k3s kubectl get ingressroute grafana -n
# monitoring` and a `grafana-http` redirect route exist by the time it runs, and adds a
# `grafana-login-rate-limit` Middleware to this IngressRoute -- so this file intentionally uses
# the exact names 13-07 expects, with a placeholder backend (`grafana-placeholder`, a Service
# with no Endpoints/EndpointSlice -- Traefik answers 503 for it, a clean and safe "nothing here
# yet" response) until 13-07 replaces `spec.routes[].services` with the real Grafana Service.
apiVersion: v1
kind: Service
metadata:
  name: grafana-placeholder
  namespace: monitoring
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-redirect-https
  namespace: monitoring
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kanban-board-rud-vlad-473-monitoring.duckdns.org`)
      kind: Rule
      services:
        - name: grafana-placeholder
          port: 80
  tls:
    secretName: grafana-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    # Same ACME-safe shape as the prod/nonprod app-http routes (I10) -- the negation keeps
    # cert-manager's HTTP-01 solver path out of the redirect by construction.
    - match: Host(`kanban-board-rud-vlad-473-monitoring.duckdns.org`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares:
        - name: grafana-redirect-https
      services:
        - name: grafana-placeholder
          port: 80
