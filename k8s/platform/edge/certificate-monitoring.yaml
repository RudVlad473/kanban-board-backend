# Lives here (k8s/platform/edge), not in a future k8s/monitoring/, so the monitoring hostname can
# validate against letsencrypt-staging in the 13-06 window before Grafana itself exists in-cluster
# (D-13's "all three hostnames" requirement; D-17 moves the observability stack to k3s only at the
# prod cutover). issuerRef is the staging issuer, matching every other Certificate in this phase.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretName: grafana-tls
  dnsNames:
    - kanban-board-rud-vlad-473-monitoring.duckdns.org
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
