# Lives in k8s/platform/edge, not k8s/monitoring, so the monitoring hostname can validate against
# Let's Encrypt before Grafana exists in-cluster.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretName: grafana-tls
  dnsNames:
    - kanban-board-rud-vlad-473-monitoring.duckdns.org
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
