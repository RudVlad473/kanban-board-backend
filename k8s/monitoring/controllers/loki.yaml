# Loki HelmRelease in single-binary mode (filesystem storage, tsdb, no object store, one replica).
#
# Decisions:
# Chart pinned to grafana/loki 7.3.0 (appVersion 3.6.12), the latest on grafana.github.io/helm-charts
# as of 2026-09-25. The deploymentMode key is `SingleBinary` at this chart version (checked against
# its values.yaml); the chart has not yet renamed it to `Monolithic`.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.3.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Deterministic Service name: configs/datasources.yaml's Loki datasource URL depends on it.
    fullnameOverride: loki
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      # 30 days of retention. schema_config.from is deliberately far in the past: a fresh install's
      # first scrape can still tail a container's pre-deploy backlog, and backdating costs nothing since
      # schema periods do not pre-allocate storage.
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 720h
        reject_old_samples_max_age: 720h
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      # MEASURED (restart ladder, 2026-09-27): passed 128Mi, failed at 64Mi (dmesg OOMKilled, anon-rss
      # ~62.9MiB + file-rss ~75.6MiB). Adopted 192Mi limit / 96Mi request.
      #
      # Decisions:
      # Anon usage at the 128Mi rung was ~82MiB (51 streams); the extra headroom covers growth over the
      # 30-day retention window.
      # Falsifier: an OOM kill weeks from now with no config change means re-derive against the then-current
      # stream/chunk count, not this measurement.
      resources:
        requests:
          memory: 96Mi
          cpu: 25m
        limits:
          memory: 192Mi

    # Zero the SimpleScalable-mode components so a chart default change cannot stand up a second
    # deployment shape beside singleBinary.
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0

    # Disabled: no object-store gateway, no caches (a single-node install has no cache tier to front),
    # no canary, and no self-monitoring (kube-prometheus-stack already provides it).
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    monitoring:
      selfMonitoring:
        enabled: false
      serviceMonitor:
        enabled: false
      dashboards:
        enabled: false
      rules:
        enabled: false
