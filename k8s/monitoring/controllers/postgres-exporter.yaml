# postgres-exporter HelmRelease. Chart prometheus-community/prometheus-postgres-exporter 8.2.0
# (appVersion v0.20.1), the latest on the helm-charts index as of 2026-09-25; pinned, never "latest".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-postgres-exporter
      version: "8.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      tag: v0.20.1

    # Use config.datasource.* (the chart's structured block), NOT extraEnvs.
    #
    # Decisions:
    # The chart's secrets.yaml template requires config.datasource.password unless passwordSecret,
    # passwordFile or datasourceSecret is set, and setting `password` makes the chart RENDER a committed
    # Secret containing it. Host, user, port, database and sslmode are plain values the chart assembles
    # into DATA_SOURCE_URI (no credentials in the string; its url.UserPassword percent-encodes them).
    # passwordSecret references a Secret created on the VM, never committed, never handled by CI.
    config:
      datasource:
        host: postgres.kanban-data.svc.cluster.local
        port: "5432"
        database: kanban_prod
        sslmode: disable
        user: monitoring
        passwordSecret:
          name: postgres-exporter
          key: password
      # extraArgs must nest under config:, not sit at the values top level.
      #
      # Decisions:
      # A top-level `extraArgs:` is a real key elsewhere in this chart's values.yaml, but the Deployment
      # template reads `.Values.config.extraArgs`; the wrong nesting is silently ignored (Helm does not
      # reject unknown values keys). The rendered container args then lacked both flags below (observed
      # live via `kubectl get deployment -o jsonpath`), leaving the dashboard's "PostgreSQL Uptime",
      # "Query rate" and "Average query runtime" panels empty.
      extraArgs:
        - --auto-discover-databases
        - --collector.postmaster
        - --collector.stat_statements

    # Only a pod carrying this label may reach Postgres 5432 from the monitoring namespace
    # (see k8s/data/postgres/networkpolicy.yaml).
    podLabels:
      kanban-board/postgres-client: "true"

    serviceMonitor:
      enabled: true
      # Stable job/instance so the postgres-exporter dashboard's hard-coded matchers survive pod restarts.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance

    # MEASURED (restart ladder, 2026-09-27): passed 16Mi, failed at 8Mi (dmesg OOMKilled). Adopted
    # 16Mi limit / 10Mi request.
    resources:
      requests:
        memory: 10Mi
        cpu: 10m
      limits:
        memory: 16Mi
