# kube-prometheus-stack HelmRelease: Prometheus Operator, Prometheus, Grafana, kube-state-metrics.
# Alertmanager and the default alerting rules stay disabled (alerting is out of scope).
#
# Decisions:
# Chart pinned to prometheus-community/kube-prometheus-stack 91.5.2 (appVersion v0.94.1), the latest
# on the helm-charts index as of 2026-09-25; pin a version, never "latest".
# fullnameOverride: kps renames only objects the PARENT chart templates. Grafana is a subchart whose
# `grafana.fullname` helper reads `.Release.Name` (`kube-prometheus-stack`), so the override never
# reaches it; the Grafana IngressRoute once routed to a Service with zero Endpoints for ~12 hours.
# Rendered Service names (verified with `helm template` against this chart, version and values):
#   - Prometheus:        kps-prometheus (port 9090), parent chart
#   - Grafana:           kube-prometheus-stack-grafana (subchart; port 80 -> 3000)
#   - kube-state-metrics: kube-prometheus-stack-kube-state-metrics (subchart)
#   - node-exporter:     kube-prometheus-stack-prometheus-node-exporter (subchart DaemonSet)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.5.2"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kps

    # Alerting is out of scope; Alertmanager ships in the chart but is not configured.
    alertmanager:
      enabled: false
    defaultRules:
      create: false

    # k3s runs these as goroutines in one process bound to localhost, so the chart's ServiceMonitors
    # would target permanently-down endpoints. k3s uses kine/SQLite, not etcd, so the etcd monitor can
    # never work either.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 30d
        # MEASURED (restart ladder, 2026-09-27): passed 512Mi, 384Mi, 320Mi, 288Mi; failed at 256Mi (dmesg
        # OOMKilled). Adopted 640Mi limit (peak x1.5) / 384Mi request.
        #
        # Decisions:
        # The ladder ran minutes per rung, shorter than the 2-hourly TSDB head-compaction cycle, so it never
        # sampled the spike: the first adoption (384Mi) was OOM-killed three times within 6.3h (2026-09-27
        # 11:00, 13:00, 17:00Z; anon-rss ~390MB). Live 3-day peak working set is 431MiB (Prometheus
        # max_over_time, container="prometheus"). Corrected 2026-09-29.
        # Scraping the whole k3s cluster put the floor well above the Compose-era 256Mi cap (headStats: 123,106
        # series / 217,214 chunks, ~7x the app-only figure). Anon usage fills whatever headroom the cap allows.
        # Falsifier: any OOMKilled on this container inside the 24h zero-restart window after rollout, or
        # weeks later with no config change, means re-derive against the then-current series/chunk count.
        resources:
          requests:
            memory: 384Mi
            cpu: 50m
          limits:
            memory: 640Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false

    grafana:
      defaultDashboardsEnabled: false
      image:
        tag: "13.2.1"
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      "grafana.ini":
        server:
          root_url: https://kanban-board-rud-vlad-473-monitoring.duckdns.org
        users:
          allow_sign_up: false
        auth.anonymous:
          enabled: false
        security:
          cookie_secure: true
      persistence:
        enabled: true
        type: pvc
        storageClassName: local-path
        size: 1Gi
      # MEASURED (restart ladder, 2026-09-27): passed 384Mi, failed at 256Mi (dmesg OOMKilled). Adopted
      # 768Mi limit / 400Mi request.
      #
      # Decisions:
      # Anon usage was ~297MiB at the 384Mi rung, filling the cap as Prometheus does; this binary was OOM-killed
      # twice at 384m under sustained load in its Compose-era deployment and corrected to 768Mi the same day.
      # A synthetic burst under-measures Grafana's real concurrent dashboard/API peak.
      resources:
        requests:
          memory: 400Mi
          cpu: 50m
        limits:
          memory: 768Mi

      # `sidecar:` must nest inside `grafana:`, not sit as its top-level sibling.
      #
      # Decisions:
      # A top-level `sidecar:` was silently ignored (Helm does not reject unknown values keys). The chart
      # reads `.Values.grafana.sidecar.datasources.defaultDatasourceEnabled`, so its default (true) rendered a
      # second default datasource ConfigMap (`kps-grafana-datasource`) beside `grafana-datasources`, and
      # Grafana refuses to start with two default datasources in one org (observed live in the Grafana
      # logs). Re-verified with `helm template`: nested here, the chart-managed ConfigMap no longer renders.
      sidecar:
        dashboards:
          enabled: true
        datasources:
          enabled: true
          # The ONLY Prometheus datasource is grafana-datasources (configs/datasources.yaml, literal UIDs); the
          # chart's auto-provisioned one must not also exist, or literal-UID dashboards could resolve against it.
          defaultDatasourceEnabled: false

    # node-exporter subchart: host filesystems visible (hostRootFsMount), network metrics scoped to the
    # pod's own namespace (no hostNetwork/hostPID); a k8s DaemonSet needs no host network namespace.
    prometheus-node-exporter:
      hostNetwork: false
      hostPID: false
      hostRootFsMount:
        enabled: true
      # MEASURED (restart ladder, 2026-09-27): passed 16Mi, failed at 8Mi (dmesg OOMKilled). Adopted 32Mi
      # limit / 16Mi request.
      #
      # Decisions:
      # The first adoption (16Mi limit) did NOT hold: OOM-killed twice (2026-09-27T23:51Z, 2026-09-28T13:16Z;
      # anon ~14.6MB + file ~5.5MB) and the surviving pod's 3-day peak working set is 15.8MiB. 32Mi is the
      # ladder's other passing rung. Corrected 2026-09-29.
      # Falsifier: any OOMKilled on this container inside the 24h zero-restart window after rollout.
      resources:
        requests:
          memory: 16Mi
          cpu: 10m
        limits:
          memory: 32Mi
      prometheus:
        monitor:
          enabled: true
          # Sets `instance` from the k8s node name, not the pod's ephemeral address, so the
          # node-exporter-full dashboard's hard-coded `instance` value survives pod restarts.
          relabelings:
            - sourceLabels: [__meta_kubernetes_pod_node_name]
              targetLabel: instance

    kube-state-metrics:
      # MEASURED (restart ladder, 2026-09-27): passed 64Mi, failed at 32Mi (dmesg OOMKilled, anon-rss
      # ~31.5MiB + file-rss ~16.1MiB). Adopted 64Mi limit / 32Mi request.
      resources:
        requests:
          memory: 32Mi
          cpu: 10m
        limits:
          memory: 64Mi

    prometheusOperator:
      # MEASURED (restart ladder, 2026-09-27): passed 32Mi, failed at 16Mi (dmesg OOMKilled, anon-rss
      # ~15.1MiB + file-rss ~43.5MiB). Adopted 32Mi limit / 25Mi request.
      resources:
        requests:
          memory: 25Mi
          cpu: 25m
        limits:
          memory: 32Mi
