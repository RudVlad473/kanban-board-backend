# Grafana Alloy HelmRelease: tails pod logs to Loki, one DaemonSet pod per node (chart default).
#
# Decisions:
# Replaces Promtail, which is EOL upstream. Chart pinned to grafana/alloy 1.12.1 (appVersion v1.19.2),
# the latest on grafana.github.io/helm-charts as of 2026-09-25.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    alloy:
      mounts:
        # No hostPath log mounts: pod logs are tailed through the Kubernetes API (loki.source.kubernetes
        # below), so the docker.sock-equivalent host-visibility surface Promtail needed does not exist. Both
        # default to false at this chart version; set explicitly.
        varlog: false
        dockercontainers: false
      # MEASURED (restart ladder, 2026-09-27): passed 75Mi, failed at 40Mi (dmesg OOMKilled, anon-rss
      # ~39.6MiB + file-rss ~108.2MiB). Adopted 75Mi limit / 40Mi request.
      resources:
        requests:
          memory: 40Mi
          cpu: 10m
        limits:
          memory: 75Mi
      configMap:
        create: true
        content: |
          // Discover every pod, then keep only namespace/pod/container/app labels, the shape the dashboards query.
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
          }

          // Tail container logs through the Kubernetes API (kubelet log endpoint): no docker.sock, no hostPath
          // /var/log mount, which is what makes mounts.varlog/dockercontainers: false above safe, not a coverage gap.
          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
            }
          }
