apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - datasources.yaml
# One ConfigMap per dashboard, each labelled grafana_dashboard: "1" so the kube-prometheus-stack
# Grafana dashboards sidecar picks it up. disableNameSuffixHash: true -- a content-hash suffix
# would break the sidecar's ability to reference a stable ConfigMap name across re-generates, and
# these dashboards are never referenced by name elsewhere so a hash offers no rollout benefit here.
# These must only ever be server-side applied (Flux) -- node-exporter-full alone renders ~470 KB,
# well past kubectl's 256 KiB client-side last-applied-configuration annotation limit.
configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    files:
      - dashboards/node-exporter-full.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
