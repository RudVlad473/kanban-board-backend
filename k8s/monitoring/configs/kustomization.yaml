apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - datasources.yaml
  - podmonitors.yaml
  - ingressroute.yaml
# One ConfigMap per dashboard, labelled grafana_dashboard: "1" for the Grafana dashboards sidecar.
#
# Decisions:
# disableNameSuffixHash: true keeps the ConfigMap names stable across re-generates; nothing else
# references them by name, so a hash offers no rollout benefit. Apply these only server-side (Flux):
# node-exporter-full alone renders ~470 KB, past kubectl's 256 KiB client-side annotation limit.
configMapGenerator:
  - name: grafana-dashboard-node-exporter-full
    files:
      - dashboards/node-exporter-full.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: grafana-dashboard-cadvisor
    files:
      - dashboards/cadvisor.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: grafana-dashboard-postgres-exporter
    files:
      - dashboards/postgres-exporter.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
