# Grafana edge routes: HTTPS on websecure, plus a separate web-only redirect route.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: grafana-login-rate-limit
  namespace: monitoring
spec:
  # Worst case over 5m = 10 + 10*300/300 = 20, within the 20 events per 5m the Caddy-era grafana_login
  # zone allowed.
  #
  # Derived 2026-09-26 from Traefik's token-bucket semantics (`burst + average * W / period`), not
  # copied from the Caddyfile as the earlier PROVISIONAL placeholder was; same shape and budget as
  # kanban-prod's auth-rate-limit. ipv6Subnet: 56 groups a /56 as one client, as a residential/mobile
  # IPv6 allocation rotates within a single subnet.
  rateLimit:
    average: 10
    period: 5m
    burst: 10
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 56
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: monitoring
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kanban-board-rud-vlad-473-monitoring.duckdns.org`) && PathPrefix(`/login`)
      kind: Rule
      middlewares:
        - name: grafana-login-rate-limit
      services:
        # The real Service is kube-prometheus-stack-grafana, not kps-grafana.
        #
        # `fullnameOverride: kps` renames only the parent chart's objects, while the Grafana subchart's
        # `grafana.fullname` reads the Helm release name. The wrong name once routed here to a Service with
        # zero Endpoints.
        - name: kube-prometheus-stack-grafana
          port: 80
    - match: Host(`kanban-board-rud-vlad-473-monitoring.duckdns.org`)
      kind: Rule
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
  tls:
    secretName: grafana-tls
---
# A separate object: an IngressRoute's entryPoints apply to ALL of its routes, so listing `web` on
# `grafana` would also serve its HTTPS routes over plain HTTP. This one owns `web` exclusively.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-http
  namespace: monitoring
spec:
  entryPoints:
    - web
  routes:
    # The negation keeps cert-manager's HTTP-01 solver path out of the redirect by construction, not by
    # Traefik rule-length priority; grafana-tls renewals depend on it (invariant I10 enforces the shape).
    - match: Host(`kanban-board-rud-vlad-473-monitoring.duckdns.org`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: kube-prometheus-stack-grafana
          port: 80
