# Grafana datasource ConfigMap; the ONLY Prometheus datasource Grafana provisions (the chart's own
# is disabled via sidecar.datasources.defaultDatasourceEnabled in kube-prometheus-stack.yaml).
#
# Decisions:
# Both uid values are fixed, not Grafana-assigned. The public dashboards under configs/dashboards/
# reference them literally, and Grafana's public-dashboard query backend resolves datasources by uid
# ONLY, never by name or template variable. Changing either value without updating every dashboard
# reference returns every public panel to HTTP 500.
# URLs use the Service names the charts render: kps-prometheus (fullnameOverride: kps) and loki
# (fullnameOverride: loki), both verified with `helm template`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: PBFA97CFB590B2093
        type: prometheus
        access: proxy
        url: http://kps-prometheus.monitoring.svc:9090
        isDefault: true
      - name: Loki
        uid: P8E80F9AEF21F6940
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
