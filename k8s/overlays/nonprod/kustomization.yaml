apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kanban-nonprod
resources:
  - ../../base/app
  - ../../base/redpanda
  - ingressroute.yaml
  - certificate.yaml
patches:
  - path: patches.yaml
    target:
      kind: Deployment
      name: app
  - path: patches-redpanda.yaml
    target:
      kind: StatefulSet
      name: redpanda
images:
  - name: rudenkovladimir/kanban-board-backend
    newName: rudenkovladimir/kanban-board-backend-nonprod
    # Setter marker (D-16): Flux's ImagePolicy flux-system/kanban-board-backend-nonprod
    # (13-02) rewrites this line's value in place on every new image it selects.
    newTag: main-141-54249e7 # {"$imagepolicy": "flux-system:kanban-board-backend-nonprod:tag"}
