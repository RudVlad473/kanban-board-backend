apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kanban-nonprod
resources:
  - ../../base/app
  - ../../base/redpanda
  - ingressroute.yaml
  - certificate.yaml
# W1 (13-06): scale nonprod to 0 for the maintenance window so no app pod can run Flyway
# against the freshly-restored-but-not-yet-verified in-cluster Postgres before the parity
# check (T-13-27). W2 removes this entry once the restore + parity diff are both clean.
replicas:
  - name: app
    count: 0
patches:
  - path: patches.yaml
    target:
      kind: Deployment
      name: app
  - path: patches-redpanda.yaml
    target:
      kind: StatefulSet
      name: redpanda
images:
  - name: rudenkovladimir/kanban-board-backend
    newName: rudenkovladimir/kanban-board-backend-nonprod
    # Setter marker (D-16): Flux's ImagePolicy flux-system/kanban-board-backend-nonprod
    # (13-02) rewrites this line's value in place on every new image it selects.
    newTag: main-135-37643d0 # {"$imagepolicy": "flux-system:kanban-board-backend-nonprod:tag"}
