# Nonprod edge: TLS on websecure plus a web-only redirect route; Traefik owns 80/443 via ServiceLB.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-https
spec:
  entryPoints:
    - websecure
  routes:
    # No rate limit on nonprod, unlike the prod overlay's app-https: this route carries no Middleware.
    - match: Host(`kanban-board-rud-vlad-473-nonprod.duckdns.org`)
      kind: Rule
      services:
        - name: app
          port: 8080
  tls:
    secretName: app-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-http
spec:
  entryPoints:
    - web
  routes:
    # The negation excludes cert-manager's HTTP-01 solver path from the redirect (I10), as in prod.
    - match: Host(`kanban-board-rud-vlad-473-nonprod.duckdns.org`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: app
          port: 8080
