# MEASURED (13-09, 2026-09-27): re-confirmed via
# max_over_time(container_memory_working_set_bytes{namespace="kanban-nonprod",container="app"}[24h])
# against kube-prometheus-stack -- 465.3MiB peak working set on the live k3s pod, still under the
# existing 512Mi request (carried from docker-compose.nonprod.yml's app-nonprod comment, Plan
# 11-03, 2026-08-26, ~467.8MiB peak) -- unchanged. Limits carry the Compose mem_limit (1g)
# unchanged.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
# Same figures as the app container above -- the registrar runs briefly, once, before the app
# container starts (never concurrently with it), so it needs no independent measurement;
# matching the app container's own cap keeps the pod's total possible footprint unchanged.
- op: replace
  path: /spec/template/spec/initContainers/0/resources
  value:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
