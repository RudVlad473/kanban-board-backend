# MEASURED (2026-09-27): 465.3MiB peak working set on the live pod, 24h max_over_time of
# container_memory_working_set_bytes{namespace="kanban-nonprod",container="app"}.
#
# Under the existing 512Mi request (~467.8MiB peak, 2026-08-26), so the request is unchanged. The
# limit is the Compose-era 1g.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
# Same figures as the app container: the registrar runs briefly, once, before the app starts, so
# it needs no measurement of its own and the pod's total possible footprint is unchanged.
- op: replace
  path: /spec/template/spec/initContainers/0/resources
  value:
    requests:
      memory: 512Mi
    limits:
      memory: 1Gi
