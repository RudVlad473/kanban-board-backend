# D-13: every Certificate started on the staging issuer (W1). This is 13-06's W3 -- the
# production flip, landed only after all three hostnames (prod, nonprod, monitoring) validated
# against staging in the maintenance window -- see k8s/platform/edge/clusterissuers.yaml for both
# ClusterIssuers, and k8s/overlays/prod/certificate.yaml for the identically-shaped prod
# Certificate.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app
spec:
  secretName: app-tls
  dnsNames:
    - kanban-board-rud-vlad-473-nonprod.duckdns.org
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
