# Production certificate for the nonprod hostname; ClusterIssuers are in k8s/platform/edge/clusterissuers.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app
spec:
  secretName: app-tls
  dnsNames:
    - kanban-board-rud-vlad-473-nonprod.duckdns.org
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
