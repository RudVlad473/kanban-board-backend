# MEASURED (2026-09-11): RSS 290.6MiB, stable against the ballooned __consumer_offsets/_schemas
# backlog that crash-looped the original 128M/300m floor. Request 320Mi, limit 900m (Compose-era).
#
# Decisions:
# Re-confirmed 2026-09-27: the live 24h peak working set on k3s was only 179.9MiB under normal load
# (max_over_time of container_memory_working_set_bytes{namespace="kanban-nonprod",container="redpanda"}).
# The request stays at 320Mi rather than being lowered, because it is anchored to the ballooned-backlog
# crash-loop, a worst case that normal-load peak data cannot supersede.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      memory: 320Mi
    limits:
      memory: 900Mi
