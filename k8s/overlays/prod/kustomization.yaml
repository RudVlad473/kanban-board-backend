apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kanban-prod
resources:
  - ../../base/app
  - ../../base/redpanda
  - ingressroute.yaml
  - certificate.yaml
patches:
  - path: patches.yaml
    target:
      kind: Deployment
      name: app
  - path: patches-redpanda.yaml
    target:
      kind: StatefulSet
      name: redpanda
images:
  - name: rudenkovladimir/kanban-board-backend
    newName: rudenkovladimir/kanban-board-backend
    # Flux's ImagePolicy flux-system/kanban-board-backend-prod rewrites this value in place on every
    # new image it selects. Prod and nonprod track `main` independently, with no promotion gate.
    newTag: main-146-9437c58 # {"$imagepolicy": "flux-system:kanban-board-backend-prod:tag"}
