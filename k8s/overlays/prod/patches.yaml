# MEASURED (2026-09-27): 532.9MiB peak working set on the live pod, 24h max_over_time of
# container_memory_working_set_bytes{namespace="kanban-prod",container="app"}.
#
# The prior 512Mi request (~471.1MiB peak, 2026-08-26) was exceeded, so the request is the new peak
# rounded up to the next 64Mi multiple (576Mi). The limit is the Compose-era 3g.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      memory: 576Mi
    limits:
      memory: 3Gi
# Same figures as the app container: the registrar runs briefly, once, before the app starts, so
# it needs no measurement of its own and the pod's total possible footprint is unchanged.
- op: replace
  path: /spec/template/spec/initContainers/0/resources
  value:
    requests:
      memory: 576Mi
    limits:
      memory: 3Gi
