# MEASURED (2026-09-27): 370.0MiB peak working set on the live pod, 24h max_over_time of
# container_memory_working_set_bytes{namespace="kanban-prod",container="redpanda"}.
#
# Under the existing 384Mi request (idle RSS 347.8MiB, 2026-08-16), so it is unchanged. The limit is
# the Compose-era cgroup backstop (2200m).
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      memory: 384Mi
    limits:
      memory: 2200Mi
# JSON6902 arg replacement: the base's `--memory 512M` (nonprod default) becomes prod's measured
# `2G`. Deliberately NOT equal to the cgroup limit above: Seastar's own probe needs headroom past
# its requested usable memory to initialize (observed live on Compose).
- op: replace
  path: /spec/template/spec/containers/0/args/6
  value: 2G
