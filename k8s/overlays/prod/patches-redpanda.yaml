# MEASURED (13-09, 2026-09-27): re-confirmed via
# max_over_time(container_memory_working_set_bytes{namespace="kanban-prod",container="redpanda"}[24h])
# against kube-prometheus-stack -- 370.0MiB peak working set on the live k3s pod, still under the
# existing 384Mi request (carried from docker-compose.prod.yml's redpanda comment, Plan 05-04,
# 2026-08-16, idle RSS 347.8MiB) -- unchanged. Limits carry the Compose cgroup backstop (2200m)
# unchanged.
- op: replace
  path: /spec/template/spec/containers/0/resources
  value:
    requests:
      memory: 384Mi
    limits:
      memory: 2200Mi
# JSON6902 arg replacement: the base's `--memory 512M` (nonprod-shaped default) becomes prod's
# measured `2G`, matching docker-compose.prod.yml's redpanda `--memory 2G` flag exactly (same
# comment: deliberately NOT numerically equal to the cgroup limit above -- Seastar's own probe
# needs headroom past its requested usable memory to initialize, confirmed live on Compose).
- op: replace
  path: /spec/template/spec/containers/0/args/6
  value: 2G
