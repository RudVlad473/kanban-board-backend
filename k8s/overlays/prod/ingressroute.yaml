# Production edge: TLS on websecure plus a web-only redirect route. No Caddy bridge; Traefik owns 80/443.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-rate-limit
spec:
  # Worst case over 5m = 10 + 10*300/300 = 20, within the 20 events per 5m the Caddy-era auth
  # zone allowed.
  #
  # Derived 2026-09-26 from Traefik's token-bucket semantics, not copied from the Caddyfile as the
  # earlier PROVISIONAL placeholder was: the bucket starts full at `burst` and refills `average` tokens per
  # `period`, so one client gets at most `burst + average * W / period` requests accepted in any window W.
  # burst=10 (half the budget up front) still admits a legitimate retry burst such as a user re-typing a
  # password; average=10 per 5m refills the other half.
  rateLimit:
    average: 10
    period: 5m
    burst: 10
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 56
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: general-rate-limit
spec:
  # Worst case over 1m = 60 + 60*60/60 = 120, within the 120 events per 1m the Caddy-era general
  # zone allowed.
  #
  # Derived 2026-09-26 as for auth-rate-limit above, not copied from the Caddyfile as the earlier
  # PROVISIONAL placeholder was. Attached only to the prod-hostname route below; nonprod carries no
  # rate-limit Middleware at all (nonprod stays unlimited).
  rateLimit:
    average: 60
    period: 1m
    burst: 60
    sourceCriterion:
      ipStrategy:
        ipv6Subnet: 56
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-https
spec:
  entryPoints:
    - websecure
  routes:
    # The auth route is listed first because it is the most sensitive and easiest to review beside its
    # Middleware; order does not affect matching, since Traefik's rule-length priority already picks the
    # more specific PathPrefix.
    - match: Host(`kanban-board-rud-vlad-473.duckdns.org`) && (PathPrefix(`/api/signin`) || PathPrefix(`/api/signup`))
      kind: Rule
      middlewares:
        - name: auth-rate-limit
      services:
        - name: app
          port: 8080
    - match: Host(`kanban-board-rud-vlad-473.duckdns.org`)
      kind: Rule
      middlewares:
        - name: general-rate-limit
      services:
        - name: app
          port: 8080
  tls:
    secretName: app-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app-http
spec:
  entryPoints:
    - web
  routes:
    # The negation keeps cert-manager's HTTP-01 solver path out of the redirect by construction. Rule-
    # length priority does not guarantee that: an explicit `priority` or a longer redirect rule would
    # silently invert it and send the ACME CA to HTTPS, failing issuance and every renewal (I10).
    - match: Host(`kanban-board-rud-vlad-473.duckdns.org`) && !PathPrefix(`/.well-known/acme-challenge/`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - name: app
          port: 8080
