# App workload base: Deployment plus Service; overlays set image and per-env resources.
#
# Decisions:
# register-schemas is an initContainer, not a Job: Job.spec.template is immutable, so a second
# apply with a changed image tag (every deploy) would fail, while an initContainer sits in the Pod
# template, which is meant to change every deploy. Do not convert it to a Job without the operator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  replicas: 1
  # Recreate, not RollingUpdate: keeps the memory envelope at one app pod per env, matching the
  # ~0.6 GiB steady-state headroom. RollingUpdate's maxSurge 1 would transiently add another pod's
  # requests.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      # The app never calls the Kubernetes API, so no service-account token is mounted.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Registers Avro schemas in-cluster before the app starts. A failing init blocks the main
        # container; a Flux dependsOn only orders reconciliation, not pod scheduling.
        - name: register-schemas
          # Same image as the app container; Kustomize's images transformer rewrites initContainers too.
          image: rudenkovladimir/kanban-board-backend
          workingDir: /app
          command:
            - java
            - -Dloader.main=com.vrudenko.kanban_board.config.AvroSchemaRegistrar
            - -cp
            - app.jar
            - org.springframework.boot.loader.launch.PropertiesLauncher
            - $(SCHEMA_REGISTRY_URL)
          env:
            - name: SCHEMA_REGISTRY_URL
              value: http://redpanda:8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Empty like the app container (overlays patch both identically), so an initContainer never
          # raises the pod's scheduled request.
          resources: {}
      containers:
        - name: app
          image: rudenkovladimir/kanban-board-backend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                # Created on the VM from env files; never committed, never handled by CI.
                name: app-env
          env:
            # Cross-namespace K8s DNS, not Compose's flat service-name DNS. Overrides the DB_HOST in the
            # Compose-era app-env Secret.
            - name: DB_HOST
              value: postgres.kanban-data.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: redpanda:19092
            - name: SCHEMA_REGISTRY_URL
              value: http://redpanda:8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Set by the overlay's patches.yaml, with a dated MEASURED comment; empty here so the base
          # carries no unmeasured guess.
          resources: {}
          startupProbe:
            httpGet:
              path: /api/actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 8080
      targetPort: http
