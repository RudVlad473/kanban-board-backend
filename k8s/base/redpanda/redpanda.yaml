# Redpanda workload base: one single-replica broker per environment namespace, empty topics.
#
# Decisions:
# Headless Service, not ClusterIP: a StatefulSet pod needs a stable, individually-addressable DNS
# name (`<pod-ordinal>.<headless-service>.<namespace>.svc.cluster.local`), not a load-balanced
# address. `publishNotReadyAddresses: true` lets the broker resolve its own advertised address
# during boot, before its readiness probe passes.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 19092
    - name: schema-registry
      port: 8081
    - name: admin
      port: 9644
    - name: rpc
      port: 33145
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      securityContext:
        # Redpanda's data directory ownership, matching the image's expected UID.
        fsGroup: 101
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # Flags carry the measured Compose-era values; overlays patch only --memory.
          #
          # Do not re-derive --smp/--memory from the Helm chart's auto-calculation. The advertise
          # addresses use StatefulSet DNS: a bare pod name or pod IP is not stable across a restart.
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 512M
            - --schema-registry-addr
            - 0.0.0.0:8081
            - --kafka-addr
            - internal://0.0.0.0:19092
            - --advertise-kafka-addr
            - internal://$(POD_NAME).redpanda.$(POD_NAMESPACE).svc.cluster.local:19092
            - --rpc-addr
            - 0.0.0.0:33145
            - --advertise-rpc-addr
            - $(POD_NAME).redpanda.$(POD_NAMESPACE).svc.cluster.local:33145
            - --default-log-level=info
          ports:
            - name: kafka
              containerPort: 19092
            - name: schema-registry
              containerPort: 8081
            - name: admin
              containerPort: 9644
            - name: rpc
              containerPort: 33145
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
          # Healthy-cluster check via rpk.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "rpk cluster health | grep -E 'Healthy:.+true'"
            periodSeconds: 5
            failureThreshold: 8
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
