# sshd drop-in for the two CI deploy identities (T-13-28, D-14). Installed to
# /etc/ssh/sshd_config.d/ on the production VM (infra/vm/README.md's Install section) -- Debian's
# packaged sshd sources every *.conf file under sshd_config.d/ automatically, no separate
# `Include` directive needed.
#
# Neither `deploy` (production CI identity, Phase 5 plan 05-05) nor `deploy-nonprod` (nonprod CI
# identity, Phase 9 plan 09-01) carries a `restrict`/forced-command option in its
# authorized_keys line -- both were provisioned deliberately with option-a (standard Unix
# filesystem permissions only, no SSH-level hardening beyond a dedicated non-root user; see
# docs/history/2026-08-16-deploy-user-setup-task-1.md and
# docs/history/2026-08-18-nonprod-ci-deploy-identity-and-environment-scoped-secrets.md). This
# Match block is what actually confines what either identity's SSH SESSION itself can do, now
# that deploy.yml's flyway-verify/flyway-verify-nonprod jobs (Plan 13-06) open a real port
# forward from the runner, through this VM, to the in-cluster Postgres ClusterIP.
#
# PermitOpen pins the ONLY destination either identity may ever forward to -- the in-cluster
# Postgres Service's pinned ClusterIP (k8s/data/postgres/postgres.yaml, 10.43.54.32:5432). Neither
# identity can open a forward to anything else, including the Kubernetes API server or any other
# in-cluster Service.
Match User deploy,deploy-nonprod
    AllowTcpForwarding local
    PermitOpen 10.43.54.32:5432
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
