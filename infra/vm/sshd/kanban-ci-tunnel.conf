# sshd drop-in confining the two CI deploy identities' SSH sessions to one port forward.
#
# Installed to /etc/ssh/sshd_config.d/ on the production VM (infra/vm/README.md's Install section);
# Debian's sshd sources every *.conf there, so no `Include` is needed.
#
# Decisions:
# Neither `deploy` nor `deploy-nonprod` carries a `restrict`/forced-command option in its
# authorized_keys line: both were provisioned with standard Unix permissions only and a dedicated
# non-root user (docs/history/2026-08-16-deploy-user-setup-task-1.md and
# docs/history/2026-08-18-nonprod-ci-deploy-identity-and-environment-scoped-secrets.md). This Match
# block confines the SESSION itself, because deploy.yml's flyway-verify jobs open a real port forward
# from the runner through this VM to the in-cluster Postgres.
# PermitOpen pins the ONLY destination either identity may forward to: the Postgres Service's pinned
# ClusterIP (k8s/data/postgres/postgres.yaml, 10.43.54.32:5432), so neither can reach the Kubernetes
# API server or any other in-cluster Service.
Match User deploy,deploy-nonprod
    AllowTcpForwarding local
    PermitOpen 10.43.54.32:5432
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
