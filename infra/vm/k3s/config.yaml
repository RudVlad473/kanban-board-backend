# k3s server config, installed to /etc/rancher/k3s/config.yaml by infra/vm/k3s/install.sh.

# Encrypt Secrets at rest in the embedded sqlite datastore.
secrets-encryption: true

# Kubeconfig readable only by root (0600), not k3s's default 0644: CI's deploy/deploy-nonprod SSH
# users must not be able to read cluster-admin credentials off disk.
write-kubeconfig-mode: "0600"

# metrics-server stays disabled: kube-prometheus-stack's Prometheus supersedes it and no HPA is in
# scope; running both wastes ~30-40MB.
#
# Decisions:
# servicelb is ENABLED (re-enabled 2026-09-26). It was disabled while Caddy owned 80/443, because the
# bundled LoadBalancer controller would grab a hostPort for any LoadBalancer Service and fight Caddy.
# ServiceLB now publishes Traefik's LoadBalancer Service on 80/443 (k8s/platform/traefik/
# helmchartconfig.yaml) via hostPort DNAT, which opens no listening socket of its own: `ss -ltn` shows
# nothing even while Traefik serves.
disable:
  - metrics-server
