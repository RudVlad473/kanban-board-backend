services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka-native:4.3.1
    hostname: kafka
    user: root # the named volume's mountpoint is created root-owned by the Docker volume driver on
    # first use since apache/kafka-native does not pre-create /var/lib/kafka/data in the image
    # (verified: `docker run --entrypoint sh apache/kafka-native:4.3.1 -c 'ls /var/lib/kafka'` ->
    # No such file or directory), while the image's entrypoint otherwise runs as uid 1000 (appuser)
    # — without this override the broker fails at startup with
    # `AccessDeniedException: /var/lib/kafka/data/bootstrap.checkpoint.tmp`. Local-dev-only scope.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    ports:
      - "9092:9092" # host-exposed, local-dev-only listener (for tooling such as a Kafka UI)
    volumes:
      - kafka-data:/var/lib/kafka/data # named volume so `down`/`up` does not wipe broker state
    healthcheck:
      # apache/kafka-native ships no JVM and no bin/*.sh admin-script tree (its runtime layer is
      # bare alpine) — any Kafka admin-command-based probe fails every attempt with a
      # file-not-found error. A bare TCP-connect against the internal broker listener is the only
      # mechanism guaranteed to work against this specific image. Known limitation: an open socket
      # proves the listener accepts connections, not that KRaft controller election has settled —
      # start_period plus multiple retries compensates for that startup window.
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/19092' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 15s # ~55s worst-case bound before Compose gives up, inside D-03's 30-60s guidance

  app:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  kafka-data:
