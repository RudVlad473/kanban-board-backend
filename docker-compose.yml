services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    # Host side published as 5433, not 5432: a native PostgreSQL on some developer machines already owns
    # 5432 and silently answers connections meant for this container, which surfaces as an authentication
    # failure rather than connection-refused and can cost hours to diagnose.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.1
    hostname: redpanda
    # Single-node broker with built-in Schema Registry.
    #
    # Two Kafka listeners: 9092 external/host-exposed for host tooling such as a Kafka UI, 19092
    # internal-only for the app container. The registry is a plain REST server needing no internal/external
    # split, so one listener on 8081 serves the app (via the `redpanda` hostname) and the host.
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:19092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:19092,external://localhost:9092
      - --schema-registry-addr 0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "9092:9092" # host-exposed, local-dev-only Kafka listener (for tooling such as a Kafka UI)
      - "8081:8081" # host-exposed schema registry, e.g. `curl http://localhost:8081/subjects`
    volumes:
      - redpanda-data:/var/lib/redpanda/data # named volume so `down`/`up` does not wipe broker
      # state. A new volume name: Redpanda's data directory format differs from the previous broker's, so
      # an old checkout's broker state is discarded on the first `up`. Disposable local-dev state; do not
      # debug an empty topic as a bug.
    healthcheck:
      # `rpk cluster health` is a genuine readiness signal; an open TCP socket only proves a listener
      # accepts connections, not that the cluster is healthy.
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 8
      start_period: 15s # ~55s worst-case bound before Compose gives up

  app:
    build: .
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:19092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      # `validate`, not `update`: Spring Boot's environment-variable property source outranks
      # application.properties, so an auto-alter value here would let Hibernate keep altering the schema on
      # every local run, masking the Flyway/entity mismatch `validate` exists to catch.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    ports:
      - "8080:8080"
    # Populate the registry before this service can publish: run
    # `./gradlew registerSchemas -PschemaRegistryUrl=http://localhost:8081` after `docker compose up`. The
    # producer's auto.register.schemas=false means it can only look schemas up, never register them.

volumes:
  postgres-data:
  redpanda-data:
