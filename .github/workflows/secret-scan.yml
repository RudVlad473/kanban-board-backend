# Secret scanning (gitleaks, quick task 260816-hn1). Wired at both gates it can meaningfully
# sit on: this workflow (full history, every push/PR) and .githooks/pre-commit (staged diff
# only, local). See that file's own comment block and 260816-hn1-MEASUREMENTS.md for the
# invocation-shape findings (MSYS path rewriting, worktree commondir mounting) this workflow
# does not need to work around, since a plain `actions/checkout` produces an ordinary
# (non-worktree) checkout.
#
# Deliberately diverges from security-scan.yml (the OWASP dependency-check workflow) in two
# ways, both load-bearing:
#   - Runs on **push and pull_request**, not weekly. dependency-check is scheduled because its
#     verdict drifts as NVD advisories publish, independent of any code change. A pinned-version
#     gitleaks scan against a committed .gitleaks.toml is a pure function of the commit, so a
#     per-push run is both meaningful (catches what the hook was bypassed on, e.g.
#     `--no-verify`) and safe (an unchanged tree cannot newly fail here days later).
#   - Hard gate: findings fail the job, no `continue-on-error`. The version pin plus
#     260816-hn1-MEASUREMENTS.md's triaged baseline (13 raw findings, 12 allowlisted as
#     evidence-cited false positives, 1 consciously carried) is what earns that. Unpinning the
#     scanner version would silently remove this justification -- see the pin comment below.
name: Secret Scan

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # Full-history scan of this repo measured at 13.6-19.5s locally (260816-hn1-MEASUREMENTS.md)
    # for ~615-622 commits; this is a runaway guard, not a runtime prediction.
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is required, not optional -- the default shallow (depth-1) checkout would
      # scan exactly one commit and report clean, which is indistinguishable from a genuine clean
      # result in the Actions UI. actions/checkout@v4 here (security-scan.yml and deploy.yml both
      # still use @v3): a newer major with no functional dependency on the difference for this
      # job, noted per this repo's own precedent of flagging a divergence rather than silently
      # drifting from the sibling files' pinned version.
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Invoked directly via the pinned image (tag+digest, byte-identical to
      # .githooks/pre-commit's GITLEAKS_IMAGE) rather than the vendor's gitleaks-action from the
      # GitHub Marketplace: that Action gates organization use behind a license key, a dependency
      # this repo should not silently take on. Direct invocation also keeps the CI command
      # structurally identical to the hook's, so the two gates cannot drift apart from using two
      # different invocation paths.
      #
      # No GIT_DIR/GIT_WORK_TREE indirection here -- that machinery in the hook exists only to
      # handle this repo's own `.claude/worktrees/<name>` convention, which `actions/checkout`
      # never produces. A plain checkout's work tree IS its git root, exactly the hook's own
      # documented plain-checkout fallback case.
      # --baseline-path points at .gitleaks-baseline.json, a committed, redacted report holding
      # exactly the one finding Task 1's checkpoint deliberately left un-suppressed in
      # .gitleaks.toml (a dead 2025-06-05 local-only credential, consciously carried rather than
      # allowlisted -- see 260816-hn1-MEASUREMENTS.md). Without this, this hard gate would fail
      # on every single push forever, since that finding can never be zero and this workflow was
      # not passing --exit-code the way the hook does. This is NOT the same mechanism as
      # .gitleaks.toml's allowlist: a baseline suppresses by exact fingerprint (this one commit,
      # this one line), is fully auditable by reading the committed JSON, and adds nothing new to
      # scope -- any *new* finding, anywhere, still fails the job. Found live: the first real run
      # of this workflow (before the baseline existed) failed exactly as predicted, confirming the
      # gap rather than guessing at it.
      - name: Scan full history for secrets
        run: |
          mkdir -p .gitleaks-reports
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose \
              --baseline-path /repo/.gitleaks-baseline.json \
              -f json -r /repo/.gitleaks-reports/full-history.json \
              /repo

      # Redacted per 260816-hn1-MEASUREMENTS.md's confirmed finding: --redact masks the
      # Match/Secret fields inside the JSON report itself, not just stdout, so this artifact
      # never carries an unredacted credential. `if: always()` mirrors security-scan.yml's own
      # precedent -- upload the report whether the scan step passed or failed, so a real finding
      # is inspectable from the Actions UI without re-running the scan locally.
      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: .gitleaks-reports/full-history.json
          if-no-files-found: warn

  # verified-credential-scan (HARDEN-02, quick task 260819 phase 10). A sibling job, not a
  # step in secret-scan above -- it needs its own checkout and has an entirely different risk
  # profile, so keeping the two jobs separate lets each fail/pass independently in the Actions
  # UI. Shares this file's top-level `on:` block (D-09) rather than declaring its own.
  #
  # Gitleaks (above) answers "does this look like a credential?" by pattern/entropy match --
  # it cannot tell a dead, rotated, or synthetic string from one that is currently live and
  # exploitable. TruffleHog answers that second question: `--results=verified` only reports a
  # finding it has confirmed against the credential's own provider API. This job is a HARD gate
  # (no error-swallowing override, D-08) on that same footing as gitleaks, because a verified finding
  # strictly narrows what gitleaks already flags -- it adds no new false-positive surface beyond
  # what this repo already tolerates from the sibling job above.
  #
  # Range-scoped, NOT full-history like gitleaks' scan: every candidate finding TruffleHog
  # verifies costs a live authentication attempt against a third-party provider API. Re-scanning
  # this repo's full ~620-commit history on every single push would re-issue every one of those
  # calls forever, which is both slow and needlessly noisy against providers this repo does not
  # control. Diff-scoping keeps verification traffic proportional to what actually changed.
  #
  # CI-only, never in .githooks/pre-commit (D-10): this job's verification step makes outbound
  # network calls carrying candidate credential material to third-party APIs. That is an
  # acceptable, deliberate trade-off from a GitHub-hosted, ephemeral runner; the same behavior
  # from a developer's own machine at commit time is a different exposure and was already
  # rejected for the pre-commit hook (quick task 260816-hn1, Decision 1). The hook keeps
  # gitleaks, which never phones out.
  #
  # Artifact handling deliberately does NOT mirror the gitleaks step above. Gitleaks' `--redact`
  # is proven (260816-hn1-MEASUREMENTS.md) to mask the Match/Secret fields inside its JSON report
  # itself, which is what makes that artifact safe to upload verbatim. TruffleHog ships no
  # equivalent flag -- confirmed against this exact pinned version's own `--help` output, not
  # assumed from documentation -- and its record schema carries the matched value directly in
  # `Raw`/`RawV2`/`Redacted`/`ExtraData`/`SecretParts`. Because this job only ever emits
  # *verified* findings, every value it could emit is, by definition, a currently-exploitable
  # credential. Copying the sibling job's "upload the report" shape here would therefore publish
  # a live credential into a repo-readable Actions artifact at exactly the moment the gate
  # succeeded at its job. The uploaded artifact is instead a `jq` field ALLOWLIST -- built by
  # naming the triage fields kept (detector name, decoder name, the verified boolean, and the
  # source-metadata block carrying file/line/commit) rather than a `del(...)` denylist of
  # known-bad keys, so a future TruffleHog version adding a new value-bearing field fails closed
  # (dropped, safe) instead of failing open (leaked, unnoticed).
  #
  # `--branch` is deliberately NOT passed to the `git` subcommand below, even though the plan
  # that authored this job named the PR head ref as a candidate value: actions/checkout leaves
  # the runner's local clone in a DETACHED HEAD state (confirmed empirically against this exact
  # invocation shape during authoring), and TruffleHog's own `git clone` of that local checkout
  # would fail to resolve a branch name that has no corresponding local ref -- turning a scan
  # attempt into a hard-gate outage on every push. `--since-commit` alone already bounds the scan
  # to the right range; the branch name is still resolved and echoed to the log purely for
  # traceability, never passed as a flag. Task 3 (this plan's blocking checkpoint) re-confirms
  # the resolved range on the first live run.
  verified-credential-scan:
    runs-on: ubuntu-latest
    # Runaway guard, not a runtime prediction -- diff-scoped scans of a handful of commits are
    # expected to finish in well under a minute; this bounds a hung verification call or a stuck
    # image pull rather than a normal run.
    timeout-minutes: 10
    steps:
      # A full, unshallowed checkout is required even though the scan itself is diff-scoped:
      # TruffleHog's `--since-commit` needs that base commit to actually be present in the
      # local object store to compute the range from it. A shallow checkout would make the base
      # commit absent, silently degenerating the scan to "nothing in range" -- a false-clean
      # result of exactly the same class this file's gitleaks job already guards against with
      # its own unshallowed checkout below.
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolves the scan range for all three trigger shapes this file's `on:` block admits.
      # The all-zeroes `before` sentinel (new branch, first push, or a force-push GitHub reports
      # that way) and workflow_dispatch (no range at all) both fall back to a head-commit-only
      # scan -- never to an unbounded full-history scan, and never to a silently skipped scan.
      - name: Resolve scan range
        id: range
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              SINCE="${{ github.event.pull_request.base.sha }}"
              BRANCH="${{ github.head_ref }}"
              ;;
            push)
              BEFORE="${{ github.event.before }}"
              case "$BEFORE" in
                0000000000000000000000000000000000000000)
                  SINCE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
                  ;;
                *)
                  SINCE="$BEFORE"
                  ;;
              esac
              BRANCH="${{ github.ref_name }}"
              ;;
            *)
              # workflow_dispatch, or any future trigger this file's `on:` block grows into:
              # no range is available at all -- fall back to the same head-commit-only scan.
              SINCE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
              BRANCH="${{ github.ref_name }}"
              ;;
          esac
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved TruffleHog scan range for '${{ github.event_name }}': since-commit=$SINCE (branch=$BRANCH, informational only -- not passed to TruffleHog, see job comment)"

      # Pin re-verified live against ghcr.io during authoring (2026-08-19): tag `3.97.0` (no
      # leading `v` -- the GitHub release is tagged `v3.97.0` but the container tag is not)
      # resolved to this exact digest on both ghcr.io and Docker Hub.
      #
      # `--results=verified` is the whole point of this job -- only a confirmed-live credential
      # reaches the exit-code branch below. `--json` for machine-parseable output. `--no-update`
      # disables the tool's own self-update check, which has no place phoning out from a
      # digest-pinned, reproducible CI job.
      #
      # Findings go to stdout; TruffleHog's own progress/summary logging goes to stderr and is
      # left unredirected, so the Actions log still shows scan progress (chunk/byte counts) for
      # a human to confirm a genuine non-zero scan happened, without ever printing a finding
      # record (which could carry a value-bearing field) into that same log.
      - name: Scan for verified live credentials
        id: scan
        run: |
          mkdir -p .trufflehog-reports
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.97.0@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
            git file:///repo \
              --since-commit "${{ steps.range.outputs.since }}" \
              --results=verified \
              --json \
              --no-update \
            > .trufflehog-reports/raw-findings.jsonl
          TRUFFLEHOG_STATUS=$?
          set -e

          # Allowlist scrub -- see the job-level comment above for why this is an allowlist of
          # fields kept, never a `del(...)` denylist of fields dropped. Runs on every exit path,
          # including the one that actually found a live credential: skipping the scrub there
          # would leave the raw file for the upload step to pick up, the exact inversion of what
          # this gate exists to prevent.
          jq -c '{SourceMetadata: .SourceMetadata, DetectorName: .DetectorName, DetectorDescription: .DetectorDescription, DecoderName: .DecoderName, Verified: .Verified, VerificationFromCache: .VerificationFromCache}' \
            .trufflehog-reports/raw-findings.jsonl > .trufflehog-reports/findings-scrubbed.jsonl

          # The raw stream carries the matched credential value directly (Raw/RawV2/Redacted/
          # ExtraData/SecretParts) -- delete it in this same step, unconditionally, so nothing
          # value-bearing survives the job even if a later edit widens the upload glob.
          rm -f .trufflehog-reports/raw-findings.jsonl

          # Three-way exit branch, mirroring .githooks/pre-commit's established GITLEAKS_STATUS
          # contract: 0 = clean, 183 = TruffleHog's documented "verified credentials found" code,
          # anything else = the scanner could not run to completion. Conflating the third case
          # with the first is the exact silent-drift failure mode that file's own comment already
          # rejects for a different tool; this job does not reintroduce it here.
          if [ "$TRUFFLEHOG_STATUS" -eq 0 ]; then
            echo "TruffleHog: no verified-live credentials found in range."
          elif [ "$TRUFFLEHOG_STATUS" -eq 183 ]; then
            echo "TruffleHog found a VERIFIED, currently-exploitable credential in this push/PR."
            echo "Detector/file/line (never the value) are in the uploaded findings-scrubbed"
            echo "artifact. Commit refused -- rotate the credential immediately; do not merge."
            exit 1
          else
            echo "TruffleHog did not run to completion (exit code $TRUFFLEHOG_STATUS, expected 0"
            echo "or 183). Distinct failure from 'a verified credential was found' above --"
            echo "likely an image-pull failure or a runner/Docker problem. Refused rather than"
            echo "silently treated as clean."
            exit 1
          fi

      # Never a directory-scoped upload (path: names the one scrubbed file, not
      # .trufflehog-reports/) -- a directory upload would sweep up the raw file the moment any
      # future edit stops deleting it above. if-no-files-found: warn and if: always() mirror the
      # gitleaks job's own upload step so both gates behave identically in the Actions UI.
      - name: Upload scrubbed findings report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trufflehog-report
          path: .trufflehog-reports/findings-scrubbed.jsonl
          if-no-files-found: warn
