# Secret scanning (gitleaks), run on every push and pull request over the full history.
#
# Wired at the two gates it can sit on: this workflow and .githooks/pre-commit (staged diff only). The
# hook's comment block and
# `.planning/quick/260816-hn1-wire-up-secret-scanning-gitleaks-truffle/260816-hn1-MEASUREMENTS.md`
# hold the invocation-shape findings (MSYS path rewriting, worktree commondir mounting) that a plain
# `actions/checkout`, an ordinary non-worktree checkout, does not need to work around.
#
# Decisions:
# Runs on **push and pull_request**, not weekly like security-scan.yml: dependency-check drifts as NVD
# advisories publish, but a pinned-version gitleaks scan against a committed .gitleaks.toml is a pure
# function of the commit, so a per-push run catches what the hook was bypassed on (e.g. `--no-verify`)
# and an unchanged tree cannot newly fail days later.
# Hard gate, no `continue-on-error`: the version pin plus the triaged baseline (13 raw findings, 12
# allowlisted as evidence-cited false positives, 1 consciously carried) earns that. Unpinning the
# scanner would silently remove the justification.
name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # Full-history scan measured at 13.6-19.5s locally for ~615-622 commits; the timeout is a runaway
    # guard, not a runtime prediction.
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is required: the default depth-1 checkout would scan one commit and report clean,
      # indistinguishable from a genuine clean result in the Actions UI. @v4 here while security-scan.yml and
      # deploy.yml use older majors, with no functional dependency on the difference.
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Invoke the pinned image directly (tag+digest, byte-identical to .githooks/pre-commit's
      # GITLEAKS_IMAGE) rather than the vendor's gitleaks-action.
      #
      # Decisions:
      # The Marketplace Action gates organization use behind a license key, a dependency this repo should not
      # take on, and direct invocation keeps the CI command structurally identical to the hook's. No
      # GIT_DIR/GIT_WORK_TREE indirection: that machinery in the hook exists only for this repo's
      # `.claude/worktrees/<name>` convention, which `actions/checkout` never produces.
      # --baseline-path points at .gitleaks-baseline.json, a committed, redacted report of the one finding
      # deliberately left un-suppressed in .gitleaks.toml (a dead 2025-06-05 local-only credential, consciously
      # carried rather than allowlisted). Without it this hard gate would fail on every push forever, since
      # the workflow does not pass --exit-code as the hook does; the first real run before the baseline
      # existed failed exactly so. A baseline suppresses by exact fingerprint (one commit, one line), is
      # auditable in the committed JSON, and adds nothing to scope: any new finding still fails the job.
      - name: Scan full history for secrets
        run: |
          mkdir -p .gitleaks-reports
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --no-banner --verbose \
              --baseline-path /repo/.gitleaks-baseline.json \
              -f json -r /repo/.gitleaks-reports/full-history.json \
              /repo

      # --redact masks the Match/Secret fields inside the JSON report itself, not just stdout, so this
      # artifact never carries an unredacted credential. `if: always()` uploads the report on pass or fail, so
      # a real finding is inspectable from the Actions UI without re-running the scan locally.
      - name: Upload redacted scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: .gitleaks-reports/full-history.json
          if-no-files-found: warn

  # A sibling job, not a step in secret-scan: it needs its own checkout and has a different risk profile,
  # so the two pass and fail independently. It shares this file's top-level `on:` block.
  #
  # Decisions:
  # Gitleaks answers "does this look like a credential?" by pattern/entropy match and cannot tell a dead or
  # synthetic string from a live one. TruffleHog `--results=verified` reports only findings confirmed
  # against the provider's own API. This is a HARD gate on the same footing as gitleaks, because a
  # verified finding strictly narrows what gitleaks already flags: no new false-positive surface.
  # Range-scoped, NOT full-history: every candidate TruffleHog verifies costs a live authentication
  # attempt against a third-party provider API, and re-scanning ~620 commits on every push would re-issue
  # every call forever. Diff-scoping keeps verification traffic proportional to what changed.
  # CI-only, never in .githooks/pre-commit: verification sends candidate credential material to
  # third-party APIs, acceptable from an ephemeral GitHub-hosted runner but a different exposure from a
  # developer's machine at commit time, which is why the pre-commit hook rejected it. The hook keeps gitleaks,
  # which never phones out.
  # The artifact is a `jq` field ALLOWLIST, not the upload-the-report shape of the gitleaks job: gitleaks'
  # `--redact` masks its JSON report, but TruffleHog has no equivalent flag (checked against this pinned
  # version's `--help`) and its record carries the matched value in `Raw`/`RawV2`/`Redacted`/`ExtraData`/
  # `SecretParts`. Every verified finding is a currently-exploitable credential, so uploading the report
  # would publish a live credential into a repo-readable artifact at the moment the gate succeeded. An
  # allowlist (detector name, decoder name, the verified boolean, source-metadata block) fails closed if a
  # future TruffleHog adds a value-bearing field; a `del(...)` denylist would fail open.
  # `--branch` is deliberately NOT passed to the `git` subcommand: actions/checkout leaves a DETACHED
  # HEAD (confirmed empirically), and TruffleHog's own clone would fail to resolve a branch name with no
  # local ref, turning a scan into a hard-gate outage on every push. `--since-commit` alone bounds the
  # range; the branch name is echoed to the log for traceability only.
  verified-credential-scan:
    runs-on: ubuntu-latest
    # Runaway guard, not a runtime prediction: diff-scoped scans finish in well under a minute; this bounds
    # a hung verification call or a stuck image pull.
    timeout-minutes: 10
    steps:
      # A full, unshallowed checkout is required even though the scan is diff-scoped: `--since-commit` needs
      # its base commit in the local object store, and a shallow checkout would degenerate the scan to
      # "nothing in range", a false clean.
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Resolve the scan range for all three trigger shapes. The all-zeroes `before` sentinel (new branch,
      # first push, force-push) and workflow_dispatch fall back to a head-commit-only scan, never an unbounded
      # full-history scan and never a skipped scan.
      - name: Resolve scan range
        id: range
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              SINCE="${{ github.event.pull_request.base.sha }}"
              BRANCH="${{ github.head_ref }}"
              ;;
            push)
              BEFORE="${{ github.event.before }}"
              case "$BEFORE" in
                0000000000000000000000000000000000000000)
                  SINCE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
                  ;;
                *)
                  SINCE="$BEFORE"
                  ;;
              esac
              BRANCH="${{ github.ref_name }}"
              ;;
            *)
              # workflow_dispatch or any future trigger: no range exists, so use the head-commit-only scan.
              SINCE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
              BRANCH="${{ github.ref_name }}"
              ;;
          esac
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved TruffleHog scan range for '${{ github.event_name }}': since-commit=$SINCE (branch=$BRANCH, informational only -- not passed to TruffleHog, see job comment)"

      # Pin verified live against ghcr.io on 2026-08-19: tag `3.97.0` (no leading `v`, unlike the GitHub
      # release tag `v3.97.0`) resolved to this digest on both ghcr.io and Docker Hub.
      #
      # `--results=verified` is the point of the job: only a confirmed-live credential reaches the exit-code
      # branch. `--no-update` disables the self-update check, which has no place in a digest-pinned,
      # reproducible job. Findings go to stdout; progress logging goes to stderr, left unredirected so the log
      # shows chunk/byte counts confirming a real scan, without printing a finding record into it.
      - name: Scan for verified live credentials
        id: scan
        run: |
          mkdir -p .trufflehog-reports
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.97.0@sha256:ff4c95e9df7d645daf2140e3ca1039031c63106268d5fbb25feb43ceca1bcc33 \
            git file:///repo \
              --since-commit "${{ steps.range.outputs.since }}" \
              --results=verified \
              --json \
              --no-update \
            > .trufflehog-reports/raw-findings.jsonl
          TRUFFLEHOG_STATUS=$?
          set -e

          # Allowlist scrub (see the job comment above), run on every exit path including a real finding:
          # skipping it there would leave the raw file for the upload step.
          jq -c '{SourceMetadata: .SourceMetadata, DetectorName: .DetectorName, DetectorDescription: .DetectorDescription, DecoderName: .DecoderName, Verified: .Verified, VerificationFromCache: .VerificationFromCache}' \
            .trufflehog-reports/raw-findings.jsonl > .trufflehog-reports/findings-scrubbed.jsonl

          # The raw stream carries the matched value (Raw/RawV2/Redacted/ExtraData/SecretParts); delete it here,
          # unconditionally, so nothing value-bearing survives even if a later edit widens the upload glob.
          rm -f .trufflehog-reports/raw-findings.jsonl

          # Three-way exit branch, as in .githooks/pre-commit's GITLEAKS_STATUS contract: 0 = clean, 183 =
          # TruffleHog's "verified credentials found" code, anything else = the scanner did not run to
          # completion. Conflating the third case with the first is the silent-drift failure that hook rejects.
          if [ "$TRUFFLEHOG_STATUS" -eq 0 ]; then
            echo "TruffleHog: no verified-live credentials found in range."
          elif [ "$TRUFFLEHOG_STATUS" -eq 183 ]; then
            echo "TruffleHog found a VERIFIED, currently-exploitable credential in this push/PR."
            echo "Detector/file/line (never the value) are in the uploaded findings-scrubbed"
            echo "artifact. Commit refused -- rotate the credential immediately; do not merge."
            exit 1
          else
            echo "TruffleHog did not run to completion (exit code $TRUFFLEHOG_STATUS, expected 0"
            echo "or 183). Distinct failure from 'a verified credential was found' above --"
            echo "likely an image-pull failure or a runner/Docker problem. Refused rather than"
            echo "silently treated as clean."
            exit 1
          fi

      # Name the one scrubbed file, never the .trufflehog-reports/ directory: a directory upload would sweep
      # up the raw file the moment a future edit stops deleting it above. `if-no-files-found: warn` and
      # `if: always()` mirror the gitleaks job's upload.
      - name: Upload scrubbed findings report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trufflehog-report
          path: .trufflehog-reports/findings-scrubbed.jsonl
          if-no-files-found: warn
