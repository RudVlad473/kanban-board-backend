# Post-deploy verification that the edge rate limiter is live and correctly scoped; runs
# scripts/loadtest/run-rate-limit-verification.sh.
#
# Decisions:
# A workflow, not "run the script on your laptop": the limiter keys on the direct connecting IP
# (sourceCriterion.ipStrategy with no `depth`/`excludedIPs`, i.e. no trusted-proxy header parsing), so
# running the harness SPENDS THE RUNNER'S OWN IP BUDGET: the derived `burst` of signin attempts, then 429s
# for the rest of the 5-minute window, for everyone behind that address. From a laptop that is the
# developer's own address, and back-to-back runs lock the developer out of signin. A GitHub-hosted
# runner gets a different egress address per run.
# Spoofing the source via X-Forwarded-For was rejected and must not be revived: the direct connecting IP
# was chosen so the limiter's key is the unforgeable TCP peer, and configuring Traefik's `ipStrategy.depth`
# or `excludedIPs` to honour XFF would let any attacker choose their own bucket key. Convenience for
# testing is not worth deleting the control being tested.
# workflow_dispatch ONLY: chaining this to deploy.yml with `workflow_run` would make every deploy
# self-verify, but each run costs bcrypt hashes on a memory-constrained VPS and rate-limits the runner's
# address for five minutes, and a control that changes only with the Middleware manifests does not belong
# on every app deploy. Run it after a deploy that touched the edge and after any rate-limit Middleware
# change.
name: Verify Rate Limit

on:
  workflow_dispatch:
    inputs:
      prod_url:
        description: "Production base URL (the hostname that MUST be rate limited)"
        required: true
        default: "https://kanban-board-rud-vlad-473.duckdns.org"
      nonprod_url:
        description: "Nonprod base URL (the negative control -- MUST NOT be rate limited)"
        required: true
        default: "https://kanban-board-rud-vlad-473-nonprod.duckdns.org"

jobs:
  verify:
    name: Production limits signin, nonprod does not
    runs-on: ubuntu-latest
    # Generous relative to a ~1 minute happy path: the script waits out a full 5-minute window and retries
    # once if the production half fails, its designed response to a budget spent by an earlier run.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # pnpm, not npm/npx: the harness shells out to `pnpm dlx artillery@2.0.24`.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No secrets and no VPN: both hostnames are public HTTPS endpoints, and the harness authenticates with
      # deliberately invalid credentials, so a request that passes the limiter is answered 401 and writes
      # nothing. It never touches /api/signup, which would create real rows.
      - name: Verify rate limiting on both hostnames
        run: |
          ./scripts/loadtest/run-rate-limit-verification.sh \
            "${{ inputs.prod_url }}" \
            "${{ inputs.nonprod_url }}"
