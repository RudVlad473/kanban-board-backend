# Committed-invariant checks, run on push AND pull_request; each job is a pure function of the commit.
#
# Decisions:
# deploy.yml triggers on `push: branches: [main]` ONLY and cannot take a `pull_request:` trigger without
# arming its deploy jobs on every PR, so a gate living there would fire only AFTER merge, where its only
# power is to leave `main` undeployed.
# A per-PR blocking run is safe because every job reads committed files (and, for k8s-manifests-valid,
# binaries pinned by sha256): an unchanged tree cannot newly fail days later the way security-scan.yml's
# advisory-driven verdict can.
# Jobs:
#   public-dashboards: scripts/verify-public-dashboards.py -- no publicly-shared Grafana dashboard holds
#     a construct the public renderer cannot resolve (a datasource by name or `${ds_*}` variable, a
#     `$variable` in a query, a panel plugin the pinned Grafana no longer ships). Those failures are
#     silent: HTTP 200 with an empty result, no log line, no unhealthy container. See that script's
#     docstring for the measurements and its known holes.
#   k8s-manifests-valid: renders every k8s/ kustomization root with a pinned kubectl and validates the
#     result against pinned Kubernetes/CRD schemas via kubeconform (scripts/verify-k8s-manifests.sh).
#   k8s-invariants: scripts/verify-k8s-invariants.py -- only the edge is public, memory caps are measured
#     and dated, images are pinned, no Secret is committed, no redirect route matches the ACME challenge
#     path. It replaced the Compose-era compose-published-ports, caddy-image-tag and deploy-scp-coverage
#     jobs, removed together with their subject.
name: Invariant Checks

on:
  push:
    branches:
      - main
    # Same inert path groups deploy.yml ignores: a docs-only or planning-only change cannot alter anything
    # this workflow reads.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".planning/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".planning/**"

jobs:
  public-dashboards:
    name: Public Grafana dashboards carry nothing the public renderer cannot resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install the gate's one dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      # Runs ahead of the gate: a gate edited into something that cannot fire must be reported as the
      # failure here, not masked by a compliant tree, because that defect looks green from the outside.
      - name: Verify the gate's invariants can fire
        run: python3 scripts/verify-public-dashboards-selftest.py

      - name: Verify public dashboard invariants
        run: python3 scripts/verify-public-dashboards.py

  k8s-manifests-valid:
    name: Every k8s/ kustomization root validates against pinned Kubernetes/CRD schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # No separate install step: verify-k8s-manifests.sh downloads and sha256-verifies its own pinned
      # kubectl/kubeconform binaries on demand.
      - name: Verify k8s manifest invariants
        run: bash scripts/verify-k8s-manifests.sh

  k8s-invariants:
    name: k8s manifests carry only the edge as public, measured memory caps, no committed Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install the gate's one dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      # Runs ahead of the gate, as in every job above.
      - name: Verify the gate's invariants can fire
        run: python3 scripts/verify-k8s-invariants-selftest.py

      - name: Verify k8s invariants
        run: python3 scripts/verify-k8s-invariants.py --no-provisional
