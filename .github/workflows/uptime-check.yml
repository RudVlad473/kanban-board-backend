# Standing uptime probe of both public health endpoints: were production and nonprod answering recently.
#
# It exists because a frozen Netcup SCP "Screen" console screenshot is not evidence of an outage; see
# docs/INFRA_RUNBOOK.md's "Triage -- dating what the Netcup SCP 'Screen' console shows" section, and go
# there once a run here goes red.
#
# Known holes:
# (a) GitHub's cron is a floor, not a guarantee: scheduled runs queue on shared runners and can fire
#     late, so a red run dates an outage to within roughly the interval plus jitter, never the minute.
# (b) GitHub disables scheduled workflows in a public repository after 60 days of inactivity, so this
#     stops silently if the repo goes quiet.
# (c) It is a probe, not an alerting system: a red run sits in the Actions tab and pages nobody.
# (d) `management.endpoint.health.show-details=never` (application.properties) means a failure can name
#     the endpoint and its observed status, never the failing subsystem beneath it.
name: Uptime Check

on:
  schedule:
    # GitHub's 5-minute floor is nominal: schedule events queue on shared runners and arrive late, so
    # */5's latency edge over */15 is mostly notional while its run count is 3x, not worth the Actions-tab
    # noise for a probe that pages nobody.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Unlike security-scan.yml and secret-scan.yml, no `contents: read`: this job never checks out the
# repository, so it needs no scope at all.
permissions: {}

jobs:
  uptime-check:
    runs-on: ubuntu-latest
    # Runaway guard against a hung curl: worst case is ~3 minutes (2 endpoints x 3 attempts x 20s curl
    # timeout, plus the inter-attempt sleeps).
    timeout-minutes: 5
    env:
      # Both endpoints are public and unauthenticated; no secret. Folded scalar: one whitespace-separated
      # line, iterated by deliberate unquoted word-splitting in the script below.
      HEALTH_URLS: >-
        https://kanban-board-rud-vlad-473.duckdns.org/api/actuator/health
        https://kanban-board-rud-vlad-473-nonprod.duckdns.org/api/actuator/health
      # A single-shot probe turns a transient network blip into a red run, the false alarm this file exists
      # to prevent. 3 attempts x 10s stays sub-minute on a healthy run.
      ATTEMPTS: 3
      SLEEP_SECONDS: 10
      CURL_MAX_TIME: 20
      UP_MARKER: '"status":"UP"'
    steps:
      # No `${{ }}` interpolation: every value arrives through `env:`, per this repo's injection-safety rule
      # (see security-scan.yml's NVD_API_KEY step), which also lets this exact script run locally unmodified.
      - name: Check both public health endpoints
        run: |
          set -eu

          FAILURES=""
          ALL_OK=1

          for URL in $HEALTH_URLS; do
            ATTEMPT=1
            URL_OK=0
            LAST_STATUS=""
            LAST_BODY=""

            while [ "$ATTEMPT" -le "$ATTEMPTS" ]; do
              RAW=$(curl -s --max-time "$CURL_MAX_TIME" -w '\n%{http_code}' "$URL" || printf '\n000')
              LAST_STATUS=$(printf '%s' "$RAW" | tail -n1)
              LAST_BODY=$(printf '%s' "$RAW" | sed '$d')

              if [ "$LAST_STATUS" = "200" ]; then
                case "$LAST_BODY" in
                  *"$UP_MARKER"*) URL_OK=1 ;;
                esac
              fi

              if [ "$URL_OK" -eq 1 ]; then
                break
              fi

              if [ "$LAST_STATUS" = "200" ]; then
                echo "Attempt $ATTEMPT/$ATTEMPTS: $URL returned 200 but the body did not contain the UP marker"
              else
                echo "Attempt $ATTEMPT/$ATTEMPTS: $URL returned status $LAST_STATUS"
              fi

              if [ "$ATTEMPT" -lt "$ATTEMPTS" ]; then
                sleep "$SLEEP_SECONDS"
              fi
              ATTEMPT=$((ATTEMPT + 1))
            done

            # One environment being down must never mask the other: URL_OK resets per iteration and the loop never
            # exits early.
            if [ "$URL_OK" -eq 1 ]; then
              echo "$URL: OK (200, UP marker present)"
            else
              ALL_OK=0
              if [ "$LAST_STATUS" = "200" ]; then
                FAILURES="${FAILURES}::error::$URL returned status 200 but the response body did not contain the UP marker\n"
              else
                FAILURES="${FAILURES}::error::$URL returned status $LAST_STATUS (expected 200)\n"
              fi
            fi
          done

          if [ "$ALL_OK" -eq 1 ]; then
            echo "Both endpoints OK: $HEALTH_URLS"
            exit 0
          fi

          printf "%b" "$FAILURES"
          exit 1
