name: CI/CD with Docker

on:
  # Plan 13-06 (W4): a manual re-run path now that deploys are pull-based GitOps (D-14) --
  # flyway-verify/flyway-verify-nonprod no longer have a paired live deploy job to re-trigger them
  # automatically, so an operator needs a way to re-run the whole pipeline (image build + both
  # Flyway verify jobs) without an empty commit.
  workflow_dispatch: {}
  push:
    branches:
      - main
    # Todo 2026-08-19 (deploy.yml has no path filter): a pure docs/planning change has no
    # runtime effect, so it shouldn't cost a full production+nonprod redeploy (build, two
    # Flyway verify jobs, two live SSH deploys, schema registration, cleanup). Deliberately
    # NOT ignoring .github/** as a whole -- a workflow or Dependabot config change genuinely
    # needs a real deploy-pipeline run to validate, so only the two known-inert path groups
    # below are excluded.
    # k8s/** added Phase 13 plan 01 (D-15): Flux commits sortable tag bumps straight to k8s/
    # overlay files on `main`. Without this exclusion, that commit would trigger a full image
    # rebuild, producing a NEW tag Flux would then bump to again -- an infinite build/commit loop
    # (Flux commit -> image build -> new tag -> another Flux commit -> ...). k8s/ manifests never
    # need a fresh app image; only the tag reference inside them changes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".planning/**"
      - "k8s/**"

env:
  DOCKERHUB_USER: rudenkovladimir
  DOCKERHUB_REPOSITORY: kanban-board-backend
  # Nonprod's own Docker Hub repository (Phase 9, plan 09-01, part C) -- one build produces
  # both tags (see build-and-push-docker-image below), so nonprod and production always run
  # byte-identical image content pulled from two independent repositories.
  DOCKERHUB_REPOSITORY_NONPROD: kanban-board-backend-nonprod
  # Caddy's own repository (quick task 260903-dvp, D-3) -- a THIRD, independent Docker Hub
  # repository, never the same one as the app: the app image changes every commit, this one
  # changes only when docker/caddy/Dockerfile changes, and the two must be prunable
  # (cleanup-old-images below) on separate schedules without touching each other's tags.
  DOCKERHUB_REPOSITORY_CADDY: kanban-board-caddy

# Risk-acceptance (Phase 10, HARDEN-03, D-05): actions/checkout, actions/setup-java,
# docker/setup-buildx-action, docker/build-push-action, actions/cache and actions/upload-artifact
# remain trusted by tag, not digest.
#
# UPDATED Plan 13-06 (D-14, D-15): the appleboy/* actions this risk-acceptance used to name
# (deploy-to-netcup, register-schemas-production, flyway-verify, flyway-verify-nonprod) are gone
# from this workflow entirely -- deploy-to-netcup and register-schemas-production were deleted
# (deploys are pull-based GitOps now; schema registration runs as an in-cluster initContainer),
# deploy-to-nonprod was already removed in Plan 13-05, and flyway-verify/flyway-verify-nonprod
# were rewritten to open their own raw `ssh` local forward (host-key-pinned by fingerprint
# themselves, see each job's "Write SSH key and known_hosts" step) rather than going through an
# action. No `uses: appleboy/*` line remains anywhere in this file. This paragraph is kept, not
# deleted, as the historical record of why digest-pinning was ever scoped narrowly in the first
# place -- the same reasoning would apply again if a future job reintroduces an action holding
# real production SSH credentials.

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      base_image_name: ${{ steps.create_environment_variables.outputs.base_image_name }}
      base_image_name_nonprod: ${{ steps.create_environment_variables.outputs.base_image_name_nonprod }}
      base_image_name_caddy: ${{ steps.create_environment_variables.outputs.base_image_name_caddy }}
    steps:
      - name: Create environment variables
        id: create_environment_variables
        run: |
          echo "base_image_name=$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "base_image_name_nonprod=$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY_NONPROD" >> "$GITHUB_OUTPUT"
          echo "base_image_name_caddy=$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY_CADDY" >> "$GITHUB_OUTPUT"

  run-tests:
    runs-on: ubuntu-latest
    needs: setup
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # HARDEN (Phase 10, folded todo): validates the wrapper's shell/batch scripts and its jar
      # against Gradle's own published known-good checksums BEFORE any of them execute. Placed
      # here -- immediately after checkout, strictly before the wrapper permission grant and
      # every wrapper invocation below -- because validating a wrapper that has already run
      # defeats the entire point of the control. First-party (published by Gradle's own GitHub
      # org), so tag-pinned rather than digest-pinned per D-05's third-party-only digest scope.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Legacy AdoptOpenJDK distribution alias removed -- that vendor stopped shipping
      # releases years ago and the alias only survived as a deprecated fallback in
      # setup-java. Node runtime bumped to clear the runner's own deprecation warning
      # (quick task 260816-sv1, closing the CI half of todo 260802-rq5 Unit B).
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # HARDEN-04 (Phase 10): setup-java's built-in Gradle cache keys on **/*.gradle* and
          # **/gradle-wrapper.properties. This repo's plugin declarations and its
          # Confluent Maven repository declaration both live in build.gradle only, so the
          # default key inputs already cover the full dependency graph -- no extra
          # cache-path/key configuration needed.
          cache: 'gradle'

      - name: Grant permission to gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Run Spotless
        run: ./gradlew spotlessCheck

  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: [ setup, run-tests ]
    if: success()
    # Declared here (Phase 9, plan 09-01, part B) because this job resolves
    # secrets.DOCKERHUB_TOKEN. Per Task 1's decision (option-a) this is production's copy of
    # that credential -- the same account-wide token is duplicated into staging too, so no
    # unscoped repository secret remains once plan 09-02 sweeps the repository-level ones.
    environment: production
    outputs:
      actual_image_name: ${{ steps.set_full_image_name.outputs.actual_image_name }}
      actual_image_name_nonprod: ${{ steps.set_full_image_name_nonprod.outputs.actual_image_name_nonprod }}
      image_tag: ${{ steps.set_image_tag_from_commit.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The Phase 5 deploy target was Oracle A1 Flex (ARM64/Ampere) when this pipeline was first
      # cross-compiled for linux/arm64 via QEMU + Buildx. Oracle's eu-zurich-1 capacity shortage
      # proved structural (see 05-03 HANDOFF), and the deploy target pivoted to a Netcup VPS
      # (x86_64) -- confirmed via `uname -a` on the provisioned VM. ubuntu-latest runners build
      # linux/amd64 natively, so the QEMU cross-compilation step this architecture pairing used
      # to require is no longer needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u $DOCKERHUB_USER --password-stdin

      # Sortable tag scheme (Phase 13 plan 01, D-15): the bare 7-char SHA this used to emit cannot
      # be numerically ordered, which a Flux ImagePolicy needs to pick "the newest" tag. run_number
      # is GitHub's own monotonically increasing per-workflow-file counter -- free, no extra state
      # to maintain -- so `main-<run_number>-<sha7>` sorts correctly by the ImagePolicy's numerical
      # extraction (`^main-(?P<num>[0-9]+)-[a-f0-9]{7}$`) while the trailing sha7 keeps the tag
      # traceable to the exact commit, matching this job's pre-existing convention.
      - name: Set image tag from commit
        id: set_image_tag_from_commit
        run: echo "image_tag=main-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set full image name
        id: set_full_image_name
        run: echo "actual_image_name=${{needs.setup.outputs.base_image_name}}:${{ steps.set_image_tag_from_commit.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # Second tag on the same artifact (Phase 9, plan 09-01, part B) -- nonprod's Docker Hub
      # repository, same short-SHA tag. No second build step: docker/build-push-action pushes
      # both tags from the one build below, so the marginal cost is a manifest write, not a
      # second build.
      - name: Set full image name (nonprod)
        id: set_full_image_name_nonprod
        run: echo "actual_image_name_nonprod=${{needs.setup.outputs.base_image_name_nonprod}}:${{ steps.set_image_tag_from_commit.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # Deliberately linux/amd64 only, not a multi-platform amd64+arm64 build: the real deploy
      # target (Netcup, x86_64) is amd64 only, and building a second platform nobody deploys to
      # would pay extra CI minutes for no benefit (revisit only if a concrete need for arm64
      # surfaces later).
      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.set_full_image_name.outputs.actual_image_name }}
            ${{ steps.set_full_image_name_nonprod.outputs.actual_image_name_nonprod }}

  # Builds and pushes the pinned Caddy image carrying the edge rate limiter (quick task
  # 260903-dvp, D-3): the VM is a 2GB box with a documented OOM history, so it only ever pulls --
  # xcaddy's from-source compile happens here, on the runner, never on the VM. A separate job from
  # build-and-push-docker-image (not a third tag on that same build) because the two artifacts
  # share nothing -- different Dockerfile, different context, different base image -- and gating
  # both behind run-tests independently is simpler than threading one job's inputs into the other.
  #
  # No pruning job for this repository (unlike cleanup-old-images/-nonprod below), dated
  # 2026-09-03: the tag is content-derived (D-5), so at most a handful of distinct tags will ever
  # exist for it -- one per actual edge change, not one per commit -- and the current one must stay
  # pullable for a cold VM restart to succeed. The existing cleanup-* jobs already cannot reach
  # this repository even by accident: they iterate only setup's base_image_name and
  # base_image_name_nonprod outputs, never base_image_name_caddy.
  build-and-push-caddy-image:
    runs-on: ubuntu-latest
    needs: [ setup, run-tests ]
    if: success()
    # Resolves secrets.DOCKERHUB_TOKEN, matching build-and-push-docker-image's own environment.
    environment: production
    outputs:
      caddy_image: ${{ steps.gate_and_derive_tag.outputs.caddy_image }}
      caddy_image_tag: ${{ steps.gate_and_derive_tag.outputs.caddy_image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Placed first, before Buildx setup or the Docker Hub login below, so a mismatch costs
      # seconds rather than a full xcaddy compile. scripts/verify-caddy-image-tag.py itself checks
      # docker/caddy/Dockerfile against docker-compose.prod.yml (I1/I2/I3) -- the explicit
      # IMAGE/COMPOSE_IMAGE comparison below closes the one drift axis that script cannot see on
      # its own: this workflow's own DOCKERHUB_REPOSITORY_CADDY (via setup's base_image_name_caddy
      # output) against the compose file's repository name.
      - name: Verify the Caddy image tag agrees across Dockerfile, compose, and this workflow
        id: gate_and_derive_tag
        run: |
          python3 scripts/verify-caddy-image-tag.py
          TAG=$(python3 scripts/verify-caddy-image-tag.py --print-tag)
          IMAGE="${{ needs.setup.outputs.base_image_name_caddy }}:$TAG"
          COMPOSE_IMAGE=$(python3 scripts/verify-caddy-image-tag.py --print-compose-image)
          if [ "$IMAGE" != "$COMPOSE_IMAGE" ]; then
            echo "::error::Computed image ($IMAGE) disagrees with docker-compose.prod.yml's services.caddy.image ($COMPOSE_IMAGE) -- check DOCKERHUB_REPOSITORY_CADDY above against the compose file's repository name."
            exit 1
          fi
          echo "caddy_image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "caddy_image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u $DOCKERHUB_USER --password-stdin

      # load: true / push: false here, a separate `docker push` step below -- deliberately not a
      # single push:true build, because a broken image must never reach the registry: steps 6-7
      # below are what decide whether this artifact is trustworthy, and they can only run against
      # an image that already exists locally. cache-from/cache-to type=gha: the image's content
      # changes only when docker/caddy/Dockerfile changes (F-2/D-2/D-4 are all fixed at specific
      # pins), so the steady-state cost of rebuilding on every push is a cache hit; any real edit
      # to the Dockerfile busts the cache and genuinely recompiles.
      - name: Build Caddy image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: docker/caddy
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.gate_and_derive_tag.outputs.caddy_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green `xcaddy build` is not evidence the module was linked in -- prove the artifact
      # directly, the same two assertions Task 1's local build already proved once by hand.
      - name: Prove the rate-limit module is actually in the built image
        run: |
          docker run --rm "${{ steps.gate_and_derive_tag.outputs.caddy_image }}" caddy version | grep -q 'v2\.11\.4'
          docker run --rm "${{ steps.gate_and_derive_tag.outputs.caddy_image }}" caddy list-modules | grep -qx 'http.handlers.rate_limit'

      # Adapts the COMMITTED Caddyfile against the freshly built binary, with throwaway domain
      # values (no real hostname, no ACME attempt) -- the control that keeps a Caddyfile that
      # fails to adapt from ever reaching the VM, where its only remaining failure mode is a
      # crash-looping edge behind a green deploy job.
      - name: Validate the committed Caddyfile against this build
        run: |
          docker run --rm -e APP_DOMAIN=example.test -e APP_DOMAIN_NONPROD=nonprod.example.test \
            -e APP_DOMAIN_MONITORING=monitoring.example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "${{ steps.gate_and_derive_tag.outputs.caddy_image }}" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Push Caddy image
        run: docker push "${{ steps.gate_and_derive_tag.outputs.caddy_image }}"

  # INFRA-06 (Phase 5, plan 05-05 Task 2). This still proves what INFRA-06 always proved --
  # migrations apply cleanly against the real, already-migrated instance before an image is
  # allowed to reach a VM (an ephemeral in-CI database was explicitly rejected by D-13: it would
  # only prove migrations apply to an empty database, blind to the migration drift this gate
  # exists to catch).
  #
  # DB_HOST/DB_NAME are GitHub Environment VARIABLES, not secrets (`postgres`/`kanban_prod` here,
  # `postgres`/`kanban_nonprod` in the nonprod twin below, both stale post-13-06 host references
  # kept as historical variable names -- D-14 corrected the actual resolved values) -- a database
  # hostname/name is not sensitive, and GitHub masks any log line containing a registered secret's
  # value regardless of where it came from, so keeping DB_NAME unmasked lets a wrong-environment
  # scoping mistake (T-11-26) surface directly in the log instead of redacting to `***`. DB_USER/
  # DB_PASS remain real secrets.
  #
  # REWRITTEN Plan 13-06 (D-14): deploys are pull-based GitOps now (Flux), so there is no more
  # `deploy-to-netcup-vm` Compose network for this job to reach over `docker run --network
  # kanban-db`. Postgres is in-cluster, reachable only via its pinned ClusterIP
  # (10.43.54.32:5432, k8s/data/postgres/postgres.yaml) -- the runner cannot route to a ClusterIP
  # directly, so this job opens a local SSH port-forward from the runner, through the VM, to that
  # ClusterIP, and runs Flyway ON THE RUNNER against the forwarded local port. No Docker Engine or
  # kubeconfig needed on the VM for this job; migrations come from the runner's own checkout (no
  # SCP staging step, unlike the old version of this job).
  flyway-verify:
    needs: [ setup, run-tests ]
    runs-on: ubuntu-latest
    if: success()
    # Phase 9, plan 09-01, part C: this job resolves secrets.DB_USER/DB_PASS and vars.DB_HOST/
    # DB_NAME against production's own self-hosted database, through the `production` environment.
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Host-key pinning by fingerprint (T-13-28): this job opens its own raw `ssh` process rather
      # than going through an action (no appleboy/* action remains in this file as of Plan 13-06),
      # so it verifies the host identity itself before ever connecting.
      - name: Write SSH key and known_hosts
        env:
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_HOST_FINGERPRINT: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
        run: |
          set -e
          install -m 0600 /dev/null "$RUNNER_TEMP/netcup_ssh_key"
          printf '%s\n' "$NETCUP_SSH_KEY" > "$RUNNER_TEMP/netcup_ssh_key"
          ssh-keyscan -H "$NETCUP_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          # BUG FIXED live during 13-06's maintenance window (2026-09-26): `ssh-keyscan -H` with
          # no `-t` scans every host key algorithm the server offers (RSA, ED25519, ECDSA), so
          # `ssh-keygen -lf` prints one fingerprint PER algorithm -- `sort -u` collapsed them into
          # a multi-line set, and the original `[ "$SCANNED_FP" != "$NETCUP_HOST_FINGERPRINT" ]`
          # exact-string comparison against a single pinned fingerprint always failed, even
          # against the correct host (confirmed live: deploy.yml run 36229677270, both
          # flyway-verify jobs red on this check). Fixed to check whether the pinned fingerprint
          # is ONE of the scanned lines (`grep -qxF`), which is what "pinned" actually means when
          # multiple host key types legitimately coexist.
          if ! ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}' | grep -qxF "$NETCUP_HOST_FINGERPRINT"; then
            echo "::error::No scanned host key fingerprint matches secrets.NETCUP_HOST_FINGERPRINT ($NETCUP_HOST_FINGERPRINT) -- refusing to connect to a host whose identity cannot be confirmed. Scanned:"
            ssh-keygen -lf "$RUNNER_TEMP/known_hosts"
            exit 1
          fi

      # T-13-28: the VM-side sshd Match block (infra/vm/sshd/kanban-ci-tunnel.conf) restricts this
      # user to AllowTcpForwarding local + PermitOpen 10.43.54.32:5432 only -- this job's forward
      # target is exactly that pinned Postgres ClusterIP, never a bare hostname resolved at
      # connect time.
      - name: Open SSH forward to in-cluster Postgres
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -e
          ssh -f -N -o ExitOnForwardFailure=yes \
            -i "$RUNNER_TEMP/netcup_ssh_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -L 15432:10.43.54.32:5432 \
            "$NETCUP_DEPLOY_USER@$NETCUP_HOST"

      - name: Precheck the forward is reachable
        run: |
          docker run --rm --network host postgres:16 pg_isready -h 127.0.0.1 -p 15432 -t 5 \
            || { echo "::error::Cannot reach in-cluster Postgres through the SSH forward on 127.0.0.1:15432 -- refusing to run Flyway against an unreachable target."; exit 1; }

      - name: Verify Flyway migrations apply cleanly (runner-side, through the SSH forward)
        env:
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -e
          echo "Verifying Flyway migrations against database: ${DB_NAME}"
          docker run --rm --network host \
            -e FLYWAY_URL="jdbc:postgresql://127.0.0.1:15432/${DB_NAME}" \
            -e FLYWAY_USER="${DB_USER}" \
            -e FLYWAY_PASSWORD="${DB_PASS}" \
            -v "$GITHUB_WORKSPACE/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 migrate
          # Flyway aborts on the first failed migration by design (recorded in
          # flyway_schema_history, blocking all subsequent ones) -- no hand-rolled
          # abort-on-first-failure logic needed here.

      # Always closes the forward, win or lose -- an orphaned background ssh process on the
      # runner is harmless (the runner is destroyed after the job either way), but closing it
      # explicitly keeps this job's own resource lifecycle self-contained rather than relying on
      # runner teardown to clean up after it.
      - name: Close the SSH forward
        if: always()
        run: pkill -f "ssh .*-L 15432:10.43.54.32:5432" || true

  # Nonprod twin of flyway-verify (Phase 9, plan 09-01, part D; rewritten phase 11, plan 11-05).
  # A literal copy with the differing axes called out below -- this job declares the staging
  # environment, so the identical vars.DB_HOST/DB_NAME and secrets.DB_USER/DB_PASS references
  # resolve against the staging environment's own values -- the nonprod database -- never
  # production's, without any name being renamed.
  flyway-verify-nonprod:
    needs: [ setup, run-tests ]
    runs-on: ubuntu-latest
    if: success()
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Write SSH key and known_hosts
        env:
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_HOST_FINGERPRINT: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
        run: |
          set -e
          install -m 0600 /dev/null "$RUNNER_TEMP/netcup_ssh_key"
          printf '%s\n' "$NETCUP_SSH_KEY" > "$RUNNER_TEMP/netcup_ssh_key"
          ssh-keyscan -H "$NETCUP_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          # BUG FIXED live during 13-06's maintenance window (2026-09-26): see flyway-verify's
          # identical fix above for the full root cause (ssh-keyscan -H scans every host key
          # algorithm, producing multiple fingerprints; the original exact-string comparison
          # against one pinned fingerprint always failed).
          if ! ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}' | grep -qxF "$NETCUP_HOST_FINGERPRINT"; then
            echo "::error::No scanned host key fingerprint matches secrets.NETCUP_HOST_FINGERPRINT ($NETCUP_HOST_FINGERPRINT) -- refusing to connect to a host whose identity cannot be confirmed. Scanned:"
            ssh-keygen -lf "$RUNNER_TEMP/known_hosts"
            exit 1
          fi

      # Same pinned ClusterIP as flyway-verify above (production job) -- one shared Postgres
      # instance serves both databases (Phase 11 D-01, D-11), so nonprod's forward target is
      # identical; only the resolved DB_NAME/DB_USER/DB_PASS (via the `staging` environment)
      # differ. The VM-side sshd Match block covers both this and the production CI user.
      - name: Open SSH forward to in-cluster Postgres
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -e
          ssh -f -N -o ExitOnForwardFailure=yes \
            -i "$RUNNER_TEMP/netcup_ssh_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -L 15432:10.43.54.32:5432 \
            "$NETCUP_DEPLOY_USER@$NETCUP_HOST"

      - name: Precheck the forward is reachable
        run: |
          docker run --rm --network host postgres:16 pg_isready -h 127.0.0.1 -p 15432 -t 5 \
            || { echo "::error::Cannot reach in-cluster Postgres through the SSH forward on 127.0.0.1:15432 -- refusing to run Flyway against an unreachable target."; exit 1; }

      - name: Verify Flyway migrations apply cleanly (runner-side, through the SSH forward)
        env:
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -e
          echo "Verifying Flyway migrations against database: ${DB_NAME}"
          docker run --rm --network host \
            -e FLYWAY_URL="jdbc:postgresql://127.0.0.1:15432/${DB_NAME}" \
            -e FLYWAY_USER="${DB_USER}" \
            -e FLYWAY_PASSWORD="${DB_PASS}" \
            -v "$GITHUB_WORKSPACE/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 migrate

      - name: Close the SSH forward
        if: always()
        run: pkill -f "ssh .*-L 15432:10.43.54.32:5432" || true

  # REMOVED Plan 13-06 (D-14, D-15): deploy-to-netcup, register-schemas-production, and the
  # old current-tag-based cleanup-unused-image are gone. Deploys are pull-based GitOps now (Flux
  # watches Docker Hub via ImagePolicy and commits the tag bump itself) -- there is no SSH
  # `docker compose up -d` step left for this job to run, no post-deploy schema-registration SSH
  # step (schema registration now runs as an initContainer on the app pod, ordered before the app
  # container starts -- Plan 13-01), and no "deploy failed, delete the tag we just pushed" job
  # (nothing here ever deploys, so nothing here can fail a deploy). cleanup-old-images below is
  # rewritten to prune by age instead of by "the tag this run built," matching its nonprod twin.

  # REWRITTEN Plan 13-06 (D-15): keeps the same JWT-exchange and pagination fixes as before
  # (2026-08-16/17), but the retention axis changes to match cleanup-old-images-nonprod's own
  # shape below -- "keep the 5 newest tags matching main-<n>-<sha7>" instead of "keep only the tag
  # this run built." There is no longer a single "current" tag to key off: Flux's ImagePolicy
  # picks the newest tag independently of what this run built, and a `git revert`-driven rollback
  # needs several recent tags to still exist in the registry.
  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: [ setup, build-and-push-docker-image ]
    if: success()
    # Phase 9, plan 09-01, part C: this job resolves secrets.DOCKERHUB_TOKEN (production's copy).
    environment: production
    steps:
      - name: Delete old Docker Hub images (keep 5 newest sortable tags)
        run: |
          # BUG FIXED (todo 2026-08-16-cleanup-old-images-delete-calls-rejected-unauthorized.md):
          # Docker Hub's Hub API v2 (hub.docker.com/v2, distinct from the Registry API v2 the old
          # cleanup-unused-image job correctly token-exchanged against) rejects HTTP Basic auth on
          # mutating requests with {"message":"unauthorized"} -- confirmed live, run 31963539949,
          # 2026-08-16, 29/29 deletes rejected. The prior GET-with-Basic-auth "succeeding" was not
          # evidence Basic auth worked: this is a public repository, so an unauthenticated GET on
          # its tag list succeeds regardless of -u. Fixed by exchanging credentials for a JWT via
          # the documented /v2/users/login/ endpoint first, then sending that as
          # `Authorization: JWT <token>` on every authenticated call. Both list and delete check
          # their HTTP status explicitly and fail loudly, rather than relying on a body inspection
          # that a 404 (the original bug) or 401 (this bug) would both silently pass.
          HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKERHUB_USER\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "::error::Docker Hub login-token exchange failed -- no token in response. Cannot prune tags."
            exit 1
          fi

          # Get list of all tags, following pagination -- Hub API v2 paginates at 10/page by
          # default. DISCOVERED LIVE (2026-08-17, first successful run after the auth fix above):
          # the unpaginated single-request version only ever saw page 1, so with 41 accumulated
          # tags it deleted just the 9 most recent non-current ones and silently left the other
          # 32 -- a real, previously-latent gap that only became visible once deletes started
          # actually succeeding. Follows `next` until null rather than a one-time page_size bump,
          # so this keeps working if the backlog ever exceeds one page's page_size again.
          TAGS=""
          NEXT_URL="https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name }}/tags/?page_size=100"
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            TAGS_HTTP_STATUS=$(curl -s -o /tmp/tags.json -w "%{http_code}" \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "$NEXT_URL")
            if [ "$TAGS_HTTP_STATUS" != "200" ]; then
              echo "::error::Listing tags failed with HTTP $TAGS_HTTP_STATUS: $(cat /tmp/tags.json)"
              exit 1
            fi
            TAGS="$TAGS $(jq -r '.results[].name' /tmp/tags.json)"
            NEXT_URL=$(jq -r '.next' /tmp/tags.json)
          done

          # Keep the 5 newest tags matching main-<run_number>-<sha7> (D-15's sortable scheme),
          # ordered NUMERICALLY by run_number (a lexical sort would put main-9-... after
          # main-100-... -- wrong), matching cleanup-old-images-nonprod's own retention logic
          # below. Legacy bare-SHA tags (pre-13-01, no main-N- prefix) never match this pattern,
          # so they fall straight into the delete set.
          KEEP=$(printf '%s\n' $TAGS \
            | grep -E '^main-[0-9]+-[0-9a-f]{7}$' \
            | sort -t- -k2,2n \
            | tail -n 5)

          FAILED=0
          for TAG in $TAGS; do
            if ! printf '%s\n' "$KEEP" | grep -qx "$TAG"; then
              echo "Deleting tag: $TAG"
              DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response.json -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name }}/tags/$TAG/")
              if [ "$DELETE_HTTP_STATUS" != "204" ]; then
                echo "::warning::Delete of tag $TAG failed with HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response.json)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED tag deletion(s) failed -- see warnings above."
            exit 1
          fi

  # REMOVED Plan 13-06 (D-14, D-15): cleanup-unused-image deleted the tag a just-failed
  # deploy-to-netcup had pushed. There is no deploy-to-netcup left to fail -- Flux decides
  # independently, on its own schedule, whether to roll a given tag out, so "this run's own
  # deploy failed" is no longer a concept this workflow can observe.

  # Nonprod twin of cleanup-old-images -- REWRITTEN Plan 13-05 (D-14, D-15): nonprod no longer
  # deploys via SSH (Flux + image automation deploys it now, see apps-nonprod Kustomization), so
  # this job can no longer key "the current tag" off a deploy job's own output -- there is no
  # deploy-to-nonprod anymore, and health-check-nonprod (which this job used to depend on) is gone
  # with it. Depends on [setup, build-and-push-docker-image] directly instead: this job now runs
  # on every push to main regardless of what Flux later decides to deploy, so it prunes by AGE
  # (keep the 5 newest sortable tags) rather than by "every tag except the one this run just
  # built" -- Flux's ImagePolicy needs several recent tags to exist for a `git revert`-driven
  # rollback (13-05-PLAN.md's own rollback note), and CI has no way to know which tag is actually
  # running in the cluster at any given moment.
  cleanup-old-images-nonprod:
    runs-on: ubuntu-latest
    needs: [ setup, build-and-push-docker-image ]
    if: success()
    # Phase 9, plan 09-02, Task 3: this job resolves secrets.DOCKERHUB_TOKEN through the `staging`
    # environment -- nonprod's copy of the account-wide token (see Plan 09-01's T-09-09).
    environment: staging
    steps:
      - name: Delete old Docker Hub images (nonprod repository, keep 5 newest sortable tags)
        run: |
          # A copy of cleanup-old-images with the repository-name axis changed (every
          # interpolation below reads setup's nonprod-repository job output, never hand-typed --
          # the production delete-URL bug fixed 2026-08-17 was exactly a hand-typed, missing
          # repository path segment, docs/INFRA_RUNBOOK.md) PLUS the retention axis changed
          # (Plan 13-05): "keep 5 newest matching main-<n>-<sha7>, ordered by n" instead of "keep
          # only the tag this run built". Both already-fixed Docker Hub bugs are inherited in
          # their fixed form: the JWT login-token exchange (2026-08-16 fix) and the
          # follow-`next`-until-null pagination loop (2026-08-17 fix).
          HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKERHUB_USER\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "::error::Docker Hub login-token exchange failed -- no token in response. Cannot prune nonprod tags."
            exit 1
          fi

          TAGS=""
          NEXT_URL="https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name_nonprod }}/tags/?page_size=100"
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            TAGS_HTTP_STATUS=$(curl -s -o /tmp/tags-nonprod.json -w "%{http_code}" \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "$NEXT_URL")
            if [ "$TAGS_HTTP_STATUS" != "200" ]; then
              echo "::error::Listing nonprod tags failed with HTTP $TAGS_HTTP_STATUS: $(cat /tmp/tags-nonprod.json)"
              exit 1
            fi
            TAGS="$TAGS $(jq -r '.results[].name' /tmp/tags-nonprod.json)"
            NEXT_URL=$(jq -r '.next' /tmp/tags-nonprod.json)
          done

          # Keep the 5 newest tags matching main-<run_number>-<sha7> (D-15's sortable scheme),
          # ordered NUMERICALLY by run_number (a lexical sort would put main-9-... after
          # main-100-... -- wrong). Legacy bare-SHA tags (pre-13-01, no main-N- prefix) never
          # match this pattern, so they fall straight into the delete set -- exactly the "legacy
          # bare-SHA tags included" instruction in 13-05-PLAN.md's Task 2 action text.
          KEEP=$(printf '%s\n' $TAGS \
            | grep -E '^main-[0-9]+-[0-9a-f]{7}$' \
            | sort -t- -k2,2n \
            | tail -n 5)

          FAILED=0
          for TAG in $TAGS; do
            if ! printf '%s\n' "$KEEP" | grep -qx "$TAG"; then
              echo "Deleting tag: $TAG"
              DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response-nonprod.json -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name_nonprod }}/tags/$TAG/")
              if [ "$DELETE_HTTP_STATUS" != "204" ]; then
                echo "::warning::Delete of nonprod tag $TAG failed with HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response-nonprod.json)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED nonprod tag deletion(s) failed -- see warnings above."
            exit 1
          fi