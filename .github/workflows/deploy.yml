name: CI/CD with Docker

on:
  # Manual re-run path: deploys are pull-based GitOps, so the Flyway verify jobs have no paired deploy
  # job to re-trigger them.
  workflow_dispatch: {}
  push:
    branches:
      - main
    # Skip runs for changes with no runtime effect: docs, markdown, planning files and k8s manifests.
    #
    # Decisions:
    # .github/** is deliberately NOT ignored: a workflow or Dependabot change needs a real pipeline run to
    # validate it.
    # k8s/** is ignored because Flux commits tag bumps straight to k8s/ overlay files on `main`; without the
    # exclusion that commit would rebuild the image, producing a new tag Flux bumps again, an infinite
    # loop. k8s manifests never need a fresh app image.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".planning/**"
      - "k8s/**"

env:
  DOCKERHUB_USER: rudenkovladimir
  DOCKERHUB_REPOSITORY: kanban-board-backend
  # Nonprod's own Docker Hub repository: one build pushes both tags, so nonprod and production run
  # byte-identical image content.
  DOCKERHUB_REPOSITORY_NONPROD: kanban-board-backend-nonprod

# Risk acceptance: actions/checkout, actions/setup-java, docker/setup-buildx-action,
# docker/build-push-action, actions/cache and actions/upload-artifact stay trusted by tag, not digest.
#
# Decisions:
# Digest-pinning was scoped narrowly to actions holding real production SSH credentials (formerly the
# appleboy/* actions). None remain: deploys are pull-based GitOps, schema registration is an in-cluster
# initContainer, and the flyway-verify jobs open their own raw `ssh` forward with a host-key
# fingerprint pin. Re-evaluate if a future job reintroduces an action holding production SSH
# credentials.

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      base_image_name: ${{ steps.create_environment_variables.outputs.base_image_name }}
      base_image_name_nonprod: ${{ steps.create_environment_variables.outputs.base_image_name_nonprod }}
    steps:
      - name: Create environment variables
        id: create_environment_variables
        run: |
          echo "base_image_name=$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "base_image_name_nonprod=$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY_NONPROD" >> "$GITHUB_OUTPUT"

  run-tests:
    runs-on: ubuntu-latest
    needs: setup
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Validate the wrapper scripts and jar against Gradle's published checksums BEFORE any of them runs:
      # validating an already-run wrapper defeats the control. First-party, so tag-pinned, not digest-pinned.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # setup-java's Gradle cache keys on **/*.gradle* and gradle-wrapper.properties; this repo's plugin and
          # Confluent Maven repository declarations live in build.gradle only, so the default key covers the full
          # dependency graph.
          cache: 'gradle'

      - name: Grant permission to gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Run Spotless
        run: ./gradlew spotlessCheck

  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: [ setup, run-tests ]
    if: success()
    # Resolves secrets.DOCKERHUB_TOKEN: production's copy of the account-wide token, duplicated into
    # staging too, so no unscoped repository secret remains.
    environment: production
    outputs:
      actual_image_name: ${{ steps.set_full_image_name.outputs.actual_image_name }}
      actual_image_name_nonprod: ${{ steps.set_full_image_name_nonprod.outputs.actual_image_name_nonprod }}
      image_tag: ${{ steps.set_image_tag_from_commit.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u $DOCKERHUB_USER --password-stdin

      # Sortable tag `main-<run_number>-<sha7>`: a Flux ImagePolicy needs numerically ordered tags, which a
      # bare sha7 cannot give.
      #
      # run_number is GitHub's monotonic per-workflow counter, matching the ImagePolicy's extraction
      # `^main-(?P<num>[0-9]+)-[a-f0-9]{7}$`; sha7 keeps the tag traceable to the commit.
      - name: Set image tag from commit
        id: set_image_tag_from_commit
        run: echo "image_tag=main-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set full image name
        id: set_full_image_name
        run: echo "actual_image_name=${{needs.setup.outputs.base_image_name}}:${{ steps.set_image_tag_from_commit.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # Second tag for nonprod's Docker Hub repository; build-push-action pushes both tags from one build, so
      # the cost is a manifest write, not a second build.
      - name: Set full image name (nonprod)
        id: set_full_image_name_nonprod
        run: echo "actual_image_name_nonprod=${{needs.setup.outputs.base_image_name_nonprod}}:${{ steps.set_image_tag_from_commit.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # Deliberately linux/amd64 only: the deploy target (Netcup, x86_64) is amd64, and a second platform
      # nobody deploys to costs CI minutes for nothing.
      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.set_full_image_name.outputs.actual_image_name }}
            ${{ steps.set_full_image_name_nonprod.outputs.actual_image_name_nonprod }}

  # Prove migrations apply cleanly to the real, already-migrated database before an image reaches a VM.
  #
  # Decisions:
  # An ephemeral in-CI database was rejected: it would only prove migrations apply to an empty database,
  # blind to the migration drift this gate exists to catch.
  # DB_HOST/DB_NAME are GitHub Environment VARIABLES, not secrets (`postgres`/`kanban_prod` here,
  # `postgres`/`kanban_nonprod` in the nonprod twin, stale host references kept under their historical
  # names). A database name is not sensitive, and GitHub masks any log line containing a registered
  # secret's value, so an unmasked DB_NAME lets a wrong-environment scoping mistake surface in the log
  # instead of redacting to `***`. DB_USER/DB_PASS remain secrets.
  # Postgres is in-cluster, reachable only via its pinned ClusterIP (10.43.54.32:5432,
  # k8s/data/postgres/postgres.yaml), which the runner cannot route to. The job opens a local SSH
  # port-forward from the runner, through the VM, to that ClusterIP and runs Flyway ON THE RUNNER against
  # the forwarded port: no Docker Engine or kubeconfig on the VM, and migrations come from the runner's
  # own checkout.
  flyway-verify:
    needs: [ setup, run-tests ]
    runs-on: ubuntu-latest
    if: success()
    # Resolves secrets.DB_USER/DB_PASS and vars.DB_HOST/DB_NAME against production's database, through
    # the `production` environment.
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Pin the host key by fingerprint: this job opens its own raw `ssh` process rather than an action, so
      # it verifies the host identity itself before ever connecting.
      - name: Write SSH key and known_hosts
        env:
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_HOST_FINGERPRINT: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
        run: |
          set -e
          install -m 0600 /dev/null "$RUNNER_TEMP/netcup_ssh_key"
          printf '%s\n' "$NETCUP_SSH_KEY" > "$RUNNER_TEMP/netcup_ssh_key"
          ssh-keyscan -H "$NETCUP_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          # The pin check is membership, not equality: `grep -qxF` accepts the pinned fingerprint if it is ONE of
          # the scanned lines.
          #
          # `ssh-keyscan -H` without `-t` scans every host key algorithm, so `ssh-keygen -lf` prints one
          # fingerprint per algorithm and an exact-string comparison against a single pinned fingerprint always
          # failed even against the correct host (observed live 2026-09-26, run 36229677270).
          if ! ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}' | grep -qxF "$NETCUP_HOST_FINGERPRINT"; then
            echo "::error::No scanned host key fingerprint matches secrets.NETCUP_HOST_FINGERPRINT ($NETCUP_HOST_FINGERPRINT) -- refusing to connect to a host whose identity cannot be confirmed. Scanned:"
            ssh-keygen -lf "$RUNNER_TEMP/known_hosts"
            exit 1
          fi

      # The VM-side sshd Match block (infra/vm/sshd/kanban-ci-tunnel.conf) restricts this user to
      # AllowTcpForwarding local and PermitOpen 10.43.54.32:5432; this job's forward target is exactly that
      # pinned ClusterIP, never a hostname resolved at connect time.
      - name: Open SSH forward to in-cluster Postgres
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -e
          ssh -f -N -o ExitOnForwardFailure=yes \
            -i "$RUNNER_TEMP/netcup_ssh_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -L 15432:10.43.54.32:5432 \
            "$NETCUP_DEPLOY_USER@$NETCUP_HOST"

      - name: Precheck the forward is reachable
        run: |
          docker run --rm --network host postgres:16 pg_isready -h 127.0.0.1 -p 15432 -t 5 \
            || { echo "::error::Cannot reach in-cluster Postgres through the SSH forward on 127.0.0.1:15432 -- refusing to run Flyway against an unreachable target."; exit 1; }

      - name: Verify Flyway migrations apply cleanly (runner-side, through the SSH forward)
        env:
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -e
          echo "Verifying Flyway migrations against database: ${DB_NAME}"
          docker run --rm --network host \
            -e FLYWAY_URL="jdbc:postgresql://127.0.0.1:15432/${DB_NAME}" \
            -e FLYWAY_USER="${DB_USER}" \
            -e FLYWAY_PASSWORD="${DB_PASS}" \
            -v "$GITHUB_WORKSPACE/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 migrate
          # Flyway aborts on the first failed migration (recorded in flyway_schema_history), so no
          # abort-on-first-failure logic is needed here.

      # Always closes the forward, win or lose, so the job's resource lifecycle is self-contained.
      - name: Close the SSH forward
        if: always()
        run: pkill -f "ssh .*-L 15432:10.43.54.32:5432" || true

  # Nonprod twin of flyway-verify: a literal copy that declares the staging environment, so the same
  # vars/secrets names resolve to the nonprod database, never production's.
  flyway-verify-nonprod:
    needs: [ setup, run-tests ]
    runs-on: ubuntu-latest
    if: success()
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Write SSH key and known_hosts
        env:
          NETCUP_SSH_KEY: ${{ secrets.NETCUP_SSH_KEY }}
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_HOST_FINGERPRINT: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
        run: |
          set -e
          install -m 0600 /dev/null "$RUNNER_TEMP/netcup_ssh_key"
          printf '%s\n' "$NETCUP_SSH_KEY" > "$RUNNER_TEMP/netcup_ssh_key"
          ssh-keyscan -H "$NETCUP_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null
          # Host-key pin: same membership check as flyway-verify above.
          if ! ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | awk '{print $2}' | grep -qxF "$NETCUP_HOST_FINGERPRINT"; then
            echo "::error::No scanned host key fingerprint matches secrets.NETCUP_HOST_FINGERPRINT ($NETCUP_HOST_FINGERPRINT) -- refusing to connect to a host whose identity cannot be confirmed. Scanned:"
            ssh-keygen -lf "$RUNNER_TEMP/known_hosts"
            exit 1
          fi

      # Same pinned ClusterIP as flyway-verify: one shared Postgres serves both databases, so only the
      # resolved DB_NAME/DB_USER/DB_PASS (via `staging`) differ. The sshd Match block covers both CI users.
      - name: Open SSH forward to in-cluster Postgres
        env:
          NETCUP_HOST: ${{ secrets.NETCUP_HOST }}
          NETCUP_DEPLOY_USER: ${{ secrets.NETCUP_DEPLOY_USER }}
        run: |
          set -e
          ssh -f -N -o ExitOnForwardFailure=yes \
            -i "$RUNNER_TEMP/netcup_ssh_key" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -L 15432:10.43.54.32:5432 \
            "$NETCUP_DEPLOY_USER@$NETCUP_HOST"

      - name: Precheck the forward is reachable
        run: |
          docker run --rm --network host postgres:16 pg_isready -h 127.0.0.1 -p 15432 -t 5 \
            || { echo "::error::Cannot reach in-cluster Postgres through the SSH forward on 127.0.0.1:15432 -- refusing to run Flyway against an unreachable target."; exit 1; }

      - name: Verify Flyway migrations apply cleanly (runner-side, through the SSH forward)
        env:
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          set -e
          echo "Verifying Flyway migrations against database: ${DB_NAME}"
          docker run --rm --network host \
            -e FLYWAY_URL="jdbc:postgresql://127.0.0.1:15432/${DB_NAME}" \
            -e FLYWAY_USER="${DB_USER}" \
            -e FLYWAY_PASSWORD="${DB_PASS}" \
            -v "$GITHUB_WORKSPACE/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 migrate

      - name: Close the SSH forward
        if: always()
        run: pkill -f "ssh .*-L 15432:10.43.54.32:5432" || true

  # No deploy job: deploys are pull-based GitOps (Flux watches Docker Hub via ImagePolicy and commits the
  # tag bump itself) and schema registration runs as an initContainer on the app pod. There is no
  # failed-deploy tag cleanup either, since nothing here deploys.

  # Keep the 5 newest tags matching main-<n>-<sha7>, not just the tag this run built: Flux's
  # ImagePolicy picks the newest tag independently of this run, and a revert-driven rollback needs several
  # recent tags to still exist in the registry.
  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: [ setup, build-and-push-docker-image ]
    if: success()
    # Resolves secrets.DOCKERHUB_TOKEN (production's copy).
    environment: production
    steps:
      - name: Delete old Docker Hub images (keep 5 newest sortable tags)
        run: |
          # Authenticate with a JWT from /v2/users/login/, not HTTP Basic: Hub API v2 rejects Basic auth on
          # mutating requests.
          #
          # Observed 2026-08-16: 29/29 deletes rejected with {"message":"unauthorized"} (run 31963539949), while
          # the GET "succeeded" with Basic auth only because this is a public repository, where an
          # unauthenticated tag listing works regardless of -u. List and delete both check their HTTP status
          # explicitly: a body inspection would silently pass a 404 or 401.
          HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKERHUB_USER\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "::error::Docker Hub login-token exchange failed -- no token in response. Cannot prune tags."
            exit 1
          fi

          # Follow `next` until null, not a one-time page_size bump: Hub API v2 paginates at 10 per page.
          #
          # Observed 2026-08-17: the unpaginated version saw only page 1, so with 41 tags it deleted 9 and
          # silently left 32, a gap visible only once deletes started succeeding.
          TAGS=""
          NEXT_URL="https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name }}/tags/?page_size=100"
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            TAGS_HTTP_STATUS=$(curl -s -o /tmp/tags.json -w "%{http_code}" \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "$NEXT_URL")
            if [ "$TAGS_HTTP_STATUS" != "200" ]; then
              echo "::error::Listing tags failed with HTTP $TAGS_HTTP_STATUS: $(cat /tmp/tags.json)"
              exit 1
            fi
            TAGS="$TAGS $(jq -r '.results[].name' /tmp/tags.json)"
            NEXT_URL=$(jq -r '.next' /tmp/tags.json)
          done

          # Keep the 5 newest main-<run_number>-<sha7> tags, ordered NUMERICALLY by run_number (a lexical sort
          # puts main-9-... after main-100-...). Legacy bare-SHA tags never match, so they fall into the delete
          # set.
          KEEP=$(printf '%s\n' $TAGS \
            | grep -E '^main-[0-9]+-[0-9a-f]{7}$' \
            | sort -t- -k2,2n \
            | tail -n 5)

          FAILED=0
          for TAG in $TAGS; do
            if ! printf '%s\n' "$KEEP" | grep -qx "$TAG"; then
              echo "Deleting tag: $TAG"
              DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response.json -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name }}/tags/$TAG/")
              if [ "$DELETE_HTTP_STATUS" != "204" ]; then
                echo "::warning::Delete of tag $TAG failed with HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response.json)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED tag deletion(s) failed -- see warnings above."
            exit 1
          fi


  # Nonprod twin of cleanup-old-images: prunes by AGE (keep the 5 newest sortable tags), not "every tag
  # except this run's".
  #
  # Nonprod deploys via Flux, so CI cannot know which tag is running in the cluster, and Flux's
  # ImagePolicy needs several recent tags to exist for a revert-driven rollback.
  cleanup-old-images-nonprod:
    runs-on: ubuntu-latest
    needs: [ setup, build-and-push-docker-image ]
    if: success()
    # Resolves secrets.DOCKERHUB_TOKEN through `staging`: nonprod's copy of the account-wide token.
    environment: staging
    steps:
      - name: Delete old Docker Hub images (nonprod repository, keep 5 newest sortable tags)
        run: |
          # Copy of cleanup-old-images with the repository axis changed: every interpolation reads setup's
          # nonprod-repository output, never hand-typed.
          #
          # The production delete-URL bug of 2026-08-17 was a hand-typed, missing repository path segment
          # (docs/INFRA_RUNBOOK.md). The retention axis also differs (keep 5 newest). Both Docker Hub fixes, the JWT
          # login exchange and the follow-`next` pagination loop, are inherited.
          HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKERHUB_USER\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "::error::Docker Hub login-token exchange failed -- no token in response. Cannot prune nonprod tags."
            exit 1
          fi

          TAGS=""
          NEXT_URL="https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name_nonprod }}/tags/?page_size=100"
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            TAGS_HTTP_STATUS=$(curl -s -o /tmp/tags-nonprod.json -w "%{http_code}" \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "$NEXT_URL")
            if [ "$TAGS_HTTP_STATUS" != "200" ]; then
              echo "::error::Listing nonprod tags failed with HTTP $TAGS_HTTP_STATUS: $(cat /tmp/tags-nonprod.json)"
              exit 1
            fi
            TAGS="$TAGS $(jq -r '.results[].name' /tmp/tags-nonprod.json)"
            NEXT_URL=$(jq -r '.next' /tmp/tags-nonprod.json)
          done

          # Keep the 5 newest main-<run_number>-<sha7> tags, ordered NUMERICALLY (a lexical sort puts main-9-...
          # after main-100-...). Legacy bare-SHA tags never match, so they fall into the delete set.
          KEEP=$(printf '%s\n' $TAGS \
            | grep -E '^main-[0-9]+-[0-9a-f]{7}$' \
            | sort -t- -k2,2n \
            | tail -n 5)

          FAILED=0
          for TAG in $TAGS; do
            if ! printf '%s\n' "$KEEP" | grep -qx "$TAG"; then
              echo "Deleting tag: $TAG"
              DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response-nonprod.json -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name_nonprod }}/tags/$TAG/")
              if [ "$DELETE_HTTP_STATUS" != "204" ]; then
                echo "::warning::Delete of nonprod tag $TAG failed with HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response-nonprod.json)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED nonprod tag deletion(s) failed -- see warnings above."
            exit 1
          fi