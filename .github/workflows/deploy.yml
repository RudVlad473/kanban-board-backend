name: CI/CD with Docker

on:
  push:
    branches:
      - main
    # Todo 2026-08-19 (deploy.yml has no path filter): a pure docs/planning change has no
    # runtime effect, so it shouldn't cost a full production+nonprod redeploy (build, two
    # Flyway verify jobs, two live SSH deploys, schema registration, cleanup). Deliberately
    # NOT ignoring .github/** as a whole -- a workflow or Dependabot config change genuinely
    # needs a real deploy-pipeline run to validate, so only the two known-inert path groups
    # below are excluded.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".planning/**"

env:
  DOCKERHUB_USER: rudenkovladimir
  DOCKERHUB_REPOSITORY: kanban-board-backend
  # Nonprod's own Docker Hub repository (Phase 9, plan 09-01, part C) -- one build produces
  # both tags (see build-and-push-docker-image below), so nonprod and production always run
  # byte-identical image content pulled from two independent repositories.
  DOCKERHUB_REPOSITORY_NONPROD: kanban-board-backend-nonprod

# Risk-acceptance (Phase 10, HARDEN-03, D-05): actions/checkout, actions/setup-java,
# docker/setup-buildx-action, docker/build-push-action, actions/cache and actions/upload-artifact
# remain trusted by tag, not digest. Digest-pinning was scoped deliberately to only the two
# appleboy/* actions below (deploy-to-netcup, register-schemas-production, deploy-to-nonprod),
# which run with real SSH keys against production/staging VMs -- a materially higher
# publisher-compromise risk tier than these first-party GitHub/Docker actions. A digest pin needs
# a two-step lookup-then-edit on every future version bump instead of a one-line tag edit; that
# recurring maintenance cost is deliberately not paid for the first-party actions listed above.

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      base_image_name: ${{ steps.create_environment_variables.outputs.base_image_name }}
      base_image_name_nonprod: ${{ steps.create_environment_variables.outputs.base_image_name_nonprod }}
    steps:
      - name: Create environment variables
        id: create_environment_variables
        run: |
          echo "base_image_name=$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "base_image_name_nonprod=$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY_NONPROD" >> "$GITHUB_OUTPUT"

  run-tests:
    runs-on: ubuntu-latest
    needs: setup
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # HARDEN (Phase 10, folded todo): validates the wrapper's shell/batch scripts and its jar
      # against Gradle's own published known-good checksums BEFORE any of them execute. Placed
      # here -- immediately after checkout, strictly before the wrapper permission grant and
      # every wrapper invocation below -- because validating a wrapper that has already run
      # defeats the entire point of the control. First-party (published by Gradle's own GitHub
      # org), so tag-pinned rather than digest-pinned per D-05's third-party-only digest scope.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Legacy AdoptOpenJDK distribution alias removed -- that vendor stopped shipping
      # releases years ago and the alias only survived as a deprecated fallback in
      # setup-java. Node runtime bumped to clear the runner's own deprecation warning
      # (quick task 260816-sv1, closing the CI half of todo 260802-rq5 Unit B).
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # HARDEN-04 (Phase 10): setup-java's built-in Gradle cache keys on **/*.gradle* and
          # **/gradle-wrapper.properties. This repo's plugin declarations and its
          # Confluent Maven repository declaration both live in build.gradle only, so the
          # default key inputs already cover the full dependency graph -- no extra
          # cache-path/key configuration needed.
          cache: 'gradle'

      - name: Grant permission to gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Run Spotless
        run: ./gradlew spotlessCheck

  build-and-push-docker-image:
    runs-on: ubuntu-latest
    needs: [ setup, run-tests ]
    if: success()
    # Declared here (Phase 9, plan 09-01, part B) because this job resolves
    # secrets.DOCKERHUB_TOKEN. Per Task 1's decision (option-a) this is production's copy of
    # that credential -- the same account-wide token is duplicated into staging too, so no
    # unscoped repository secret remains once plan 09-02 sweeps the repository-level ones.
    environment: production
    outputs:
      actual_image_name: ${{ steps.set_full_image_name.outputs.actual_image_name }}
      actual_image_name_nonprod: ${{ steps.set_full_image_name_nonprod.outputs.actual_image_name_nonprod }}
      image_tag: ${{ steps.set_image_tag_from_commit.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # The Phase 5 deploy target was Oracle A1 Flex (ARM64/Ampere) when this pipeline was first
      # cross-compiled for linux/arm64 via QEMU + Buildx. Oracle's eu-zurich-1 capacity shortage
      # proved structural (see 05-03 HANDOFF), and the deploy target pivoted to a Netcup VPS
      # (x86_64) -- confirmed via `uname -a` on the provisioned VM. ubuntu-latest runners build
      # linux/amd64 natively, so the QEMU cross-compilation step this architecture pairing used
      # to require is no longer needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u $DOCKERHUB_USER --password-stdin

      # need to add a tag to image to not cause name collisions on dockerhub when pushing
      - name: Set image tag from commit
        id: set_image_tag_from_commit
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set full image name
        id: set_full_image_name
        run: echo "actual_image_name=${{needs.setup.outputs.base_image_name}}:${{ steps.set_image_tag_from_commit.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # Second tag on the same artifact (Phase 9, plan 09-01, part B) -- nonprod's Docker Hub
      # repository, same short-SHA tag. No second build step: docker/build-push-action pushes
      # both tags from the one build below, so the marginal cost is a manifest write, not a
      # second build.
      - name: Set full image name (nonprod)
        id: set_full_image_name_nonprod
        run: echo "actual_image_name_nonprod=${{needs.setup.outputs.base_image_name_nonprod}}:${{ steps.set_image_tag_from_commit.outputs.image_tag }}" >> "$GITHUB_OUTPUT"

      # Deliberately linux/amd64 only, not a multi-platform amd64+arm64 build: the real deploy
      # target (Netcup, x86_64) is amd64 only, and building a second platform nobody deploys to
      # would pay extra CI minutes for no benefit (revisit only if a concrete need for arm64
      # surfaces later).
      - name: Build and push Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.set_full_image_name.outputs.actual_image_name }}
            ${{ steps.set_full_image_name_nonprod.outputs.actual_image_name_nonprod }}

  # INFRA-06 (Phase 5, plan 05-05 Task 2): verifies this project's Flyway migrations
  # (src/main/resources/db/migration/V1-V8) apply cleanly against Neon's DIRECT
  # (non-pooled) endpoint before any image is allowed to reach a VM -- gates deploy.
  # Runs the official Flyway CLI Docker image (same version Spring Boot 3.5.16's BOM
  # pins flyway-core/flyway-database-postgresql to, see build.gradle) directly against
  # the checked-out migration scripts, rather than booting the whole Spring context
  # (which would also need a reachable Kafka broker in CI for no benefit here) or
  # inventing a second migration mechanism. This keeps the whole verification inside
  # this workflow file, matching plan 05-05's declared file scope.
  flyway-verify:
    needs: [ setup, run-tests ]
    runs-on: ubuntu-latest
    if: success()
    # Phase 9, plan 09-01, part C: this job resolves secrets.DB_HOST/DB_NAME/DB_USER/DB_PASS
    # against production's own Neon branch, so it now reads them through the `production`
    # environment rather than an unscoped repository secret.
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Guard against Neon's pooled (transaction-mode) endpoint
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          # Transaction-mode pooling does not support DDL/schema migration the way a
          # direct connection does -- a run against the pooled endpoint would either
          # fail confusingly or, worse, appear to succeed without proving what this job
          # exists to prove. Neon's own naming convention marks pooled hosts with a
          # "-pooler" suffix (see docs/INFRA_RUNBOOK.md). Inspected without ever being
          # printed.
          if [[ "$DB_HOST" == *"-pooler"* ]]; then
            echo "::error::DB_HOST carries Neon's pooler marker (-pooler). Flyway migration verification must run against the DIRECT (non-pooled) endpoint only -- refusing to proceed."
            exit 1
          fi
          echo "Guard passed: configured endpoint is not the pooled endpoint."

      - name: Verify Flyway migrations apply cleanly (Neon direct endpoint)
        env:
          FLYWAY_URL: jdbc:postgresql://${{ secrets.DB_HOST }}:5432/${{ secrets.DB_NAME }}?sslmode=require
          FLYWAY_USER: ${{ secrets.DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.DB_PASS }}
        run: |
          docker run --rm \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v "${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 migrate
          # Flyway aborts on the first failed migration by design (recorded in
          # flyway_schema_history, blocking all subsequent ones) -- no hand-rolled
          # abort-on-first-failure logic needed here, unlike the old per-script psql
          # sequence this job replaces in spirit (INFRA-06 was originally scoped
          # against hand-authored DDL scripts; Phase 04.1/04.2 superseded that
          # project-wide with Flyway, see 05-05-PLAN.md Task 2's own note).

  # Nonprod twin of flyway-verify (Phase 9, plan 09-01, part D). A literal copy with one
  # differing axis -- this job declares the staging environment below. Because GitHub resolves
  # a job's secrets.* against the environment it declares, the identical DB_HOST/DB_NAME/DB_USER/
  # DB_PASS references below resolve against the staging environment's own values -- the
  # nonprod Neon branch -- never production's, without any secret being renamed.
  flyway-verify-nonprod:
    needs: [ setup, run-tests ]
    runs-on: ubuntu-latest
    if: success()
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Guard against Neon's pooled (transaction-mode) endpoint
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
        run: |
          if [[ "$DB_HOST" == *"-pooler"* ]]; then
            echo "::error::DB_HOST carries Neon's pooler marker (-pooler). Flyway migration verification must run against the DIRECT (non-pooled) endpoint only -- refusing to proceed."
            exit 1
          fi
          echo "Guard passed: configured endpoint is not the pooled endpoint."

      - name: Verify Flyway migrations apply cleanly (Neon direct endpoint)
        env:
          FLYWAY_URL: jdbc:postgresql://${{ secrets.DB_HOST }}:5432/${{ secrets.DB_NAME }}?sslmode=require
          FLYWAY_USER: ${{ secrets.DB_USER }}
          FLYWAY_PASSWORD: ${{ secrets.DB_PASS }}
        run: |
          docker run --rm \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            -v "${{ github.workspace }}/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 migrate

  # Rewritten for the v1.2 "Infra Migration" milestone (Phase 5, plan 05-05 Task 3).
  # Targets the Netcup VPS provisioned in plan 05-03 -- the originally-planned Oracle
  # Cloud A1 Flex target proved structurally capacity-constrained (200+ automated
  # provisioning attempts, zero successes; see docs/INFRA_RUNBOOK.md's "Provider
  # history" note) -- not the deleted AWS EC2 host the old job SSHed into. Freshly
  # generated, dedicated SSH credentials (plan 05-05 Task 1) authenticate as a
  # minimally-privileged, non-root `deploy` user (never root), and the connection's
  # host key is pinned by fingerprint on both steps below -- the old job never verified
  # the host key at all.
  deploy-to-netcup:
    needs: [ build-and-push-docker-image, flyway-verify ]
    runs-on: ubuntu-latest
    if: success()
    # Phase 9, plan 09-01, part C: this job resolves secrets.NETCUP_* -- production's SSH
    # identity -- so it now reads them through the `production` environment.
    environment: production
    # Serializes deploys against this one VM: a second push while a deploy is still
    # in-flight QUEUES behind it rather than cancelling it (cancel-in-progress: false).
    # Cancelling mid-deploy could interrupt the SCP step partway through, leaving a
    # half-copied docker-compose.prod.yml/Caddyfile on the VM -- exactly the
    # interleaving this control exists to prevent. Queuing costs a little wall-clock on
    # a rapid double push, but every deploy that runs still leaves the VM in a complete,
    # self-consistent state, and the last queued deploy always reflects the latest push
    # (each deploy fully re-copies and re-applies whatever commit was current when it
    # started).
    concurrency:
      group: deploy-to-netcup-vm
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Copy Compose manifest and Caddyfile to the VM
        # `rm` is deliberately NOT set: the target directory also holds .env.prod
        # (plan 05-04's manual deploy, populated once, off-limits to this job's own
        # explicit prohibition), which must never be recreated or deleted here -- only
        # the three named paths below are transferred.
        #
        # docker/postgres-init/01-create-databases-and-roles.sh added phase 11 (plan 11-01):
        # appleboy/scp-action preserves the relative path structure by default, so this lands at
        # /opt/deploy/kanban-board-backend/docker/postgres-init/01-create-databases-and-roles.sh
        # -- the exact path the `postgres` service's bind mount expects. The script is transferred
        # so a REBUILD of the `postgres` container from an empty volume can reprovision, but it is
        # one-shot against a non-empty data directory (see the script's own dated comment), so a
        # routine deploy re-copying it on every push is a no-op by design, not a reprovisioning
        # risk.
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_DEPLOY_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          fingerprint: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
          source: "docker-compose.prod.yml,Caddyfile,docker/postgres-init/01-create-databases-and-roles.sh"
          target: "/opt/deploy/kanban-board-backend/"

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_DEPLOY_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          fingerprint: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
          script: |
            set -e
            # set -e (Phase 9, plan 09-03, live-verification fix, corrected): appleboy/ssh-action
            # v1.2.5 has NO `script_stop` input -- an earlier fix attempt added that key and it was
            # silently ignored (unknown `with:` keys don't error in GitHub Actions), which is why the
            # bug it was meant to fix reproduced identically on first re-test. The real mechanism is
            # the script's own shell: appleboy/ssh-action runs `script:` as plain multi-line shell
            # text with no `set -e` by default, so a failing command mid-script does NOT stop later
            # lines from running. Confirmed live twice: deploy-to-nonprod's registration step threw
            # the expected IllegalStateException and `docker compose run` exited 1 at the OS level
            # (verified directly on the VM), yet `up -d app-nonprod` on the next line still ran both
            # times -- once with no fix, once with the ineffective `script_stop: true`. `set -e` here
            # is the actual fix, applied to every ssh-action script in this file for defense-in-depth.
            cd /opt/deploy/kanban-board-backend
            # Exported (not written into .env.prod) so this commit's freshly-built tag
            # always wins over Compose's --env-file precedence -- shell environment
            # variables take priority over --env-file values, and .env.prod itself is
            # never touched by this job.
            export IMAGE_TAG=${{ needs.build-and-push-docker-image.outputs.image_tag }}
            # rudenkovladimir/kanban-board-backend is a public Docker Hub repository
            # (confirmed live via the Docker Hub API during this plan's execution,
            # is_private: false) -- no docker login/registry credential is needed here
            # to pull it. Pull-and-up is idempotent: a push that changes nothing this
            # deploy consumes still converges the VM to the pushed state (the app image
            # tag always changes per commit) rather than erroring on there being
            # nothing to do.
            docker compose --env-file ./.env.prod -f docker-compose.prod.yml pull app
            docker compose --env-file ./.env.prod -f docker-compose.prod.yml up -d

  # CI-05 (Phase 9, plan 09-03): automates the last hand-run step in this project's deploy --
  # registering the application's 14 Avro schemas against production's registry -- reusing the
  # identical PropertiesLauncher one-off-container invocation already proven by hand
  # (docs/INFRA_RUNBOOK.md "Manual deploy -- Plan 05-04 Task 1" step 3). Runs as its OWN job,
  # immediately after deploy-to-netcup, rather than as a gate inside it (Task 1's checkpoint,
  # option-a, human-decided): production already serves traffic before registration today --
  # registration has been a hand-run post-deploy step since v1.2 Phase 5 -- and making the
  # registry a precondition for `up -d` would introduce a NEW production failure mode (a
  # registry outage blocking a deploy that would otherwise have succeeded), a change this
  # phase deliberately does not make. This is still strictly better than the status quo: the
  # unregistered window shrinks from "until an operator remembers the runbook" to "this job's
  # own startup latency," and an incompatible schema still reddens the run via the same
  # exit-code chain nonprod's own registration relies on
  # (AvroSchemaRegistrar.registerThenSetCompatibility's IllegalStateException -> non-zero JVM
  # exit -> `docker compose run` exit propagation -> appleboy/ssh-action step failure). No
  # `|| true`, `set +e`, or `continue-on-error` anywhere near the invocation below.
  register-schemas-production:
    needs: [ deploy-to-netcup, build-and-push-docker-image ]
    runs-on: ubuntu-latest
    if: success()
    # Resolves secrets.NETCUP_* through production's OWN identity -- this job's `needs:` names
    # only deploy-to-netcup (plus build-and-push-docker-image for the image tag output), never
    # a nonprod node, so this job neither gates nor is gated by the nonprod deploy path.
    environment: production
    # Deliberately no concurrency: block. deploy-to-netcup-vm's lock is already released by the
    # time this job starts (it runs after that job succeeds), and this job neither copies files
    # to the VM nor mutates the Compose project -- only runs one already-proven one-off
    # container, so there is nothing here for a second concurrent run to race against.
    steps:
      - name: Register Avro schemas (production registry)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_DEPLOY_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          fingerprint: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
          script: |
            set -e
            # set -e: see deploy-to-netcup's identical comment (script_stop is not a real
            # appleboy/ssh-action input). This script's only risky command is already last, so its
            # exit code already propagated correctly -- set -e added for defense-in-depth against a
            # future edit appending a line after it.
            cd /opt/deploy/kanban-board-backend
            # Exported, matching deploy-to-netcup's own precedence convention -- this commit's
            # freshly-built tag always wins over Compose's --env-file precedence.
            export IMAGE_TAG=${{ needs.build-and-push-docker-image.outputs.image_tag }}
            echo "Registering Avro schemas against the production registry..."
            docker compose --env-file ./.env.prod -f docker-compose.prod.yml run --rm --entrypoint java app \
              -Dloader.main=com.vrudenko.kanban_board.config.AvroSchemaRegistrar \
              -cp app.jar org.springframework.boot.loader.launch.PropertiesLauncher http://redpanda:8081

  # Nonprod twin of deploy-to-netcup (Phase 9, plan 09-01, part E). Every identity axis
  # differs: target directory (/opt/deploy/kanban-board-nonprod/ vs
  # /opt/deploy/kanban-board-backend/), Compose project/manifest (docker-compose.nonprod.yml,
  # its own `name:` pin), container names (kanban-nonprod-* vs kanban-board-backend-*), image
  # repository (kanban-board-backend-nonprod), SSH identity (deploy-nonprod, a distinct
  # keypair -- see docs/INFRA_RUNBOOK.md's "Nonprod CI deploy identity" section), and
  # concurrency group (deploy-to-nonprod-vm). `needs:` deliberately references only nonprod
  # nodes (flyway-verify-nonprod, never flyway-verify) so neither deploy path ever waits on,
  # gates, or is failed by the other.
  deploy-to-nonprod:
    needs: [ build-and-push-docker-image, flyway-verify-nonprod ]
    runs-on: ubuntu-latest
    if: success()
    # Phase 9, plan 09-01, part E: resolves secrets.NETCUP_*/DOCKERHUB_TOKEN through the
    # `staging` environment -- the deploy-nonprod SSH identity, never production's.
    environment: staging
    # Distinct concurrency group from deploy-to-netcup-vm -- sharing it would silently
    # reintroduce cross-environment queueing between two otherwise-independent deploy paths.
    # cancel-in-progress: false for the same reason production keeps it: cancelling mid-SCP
    # would leave a half-copied manifest on the VM.
    concurrency:
      group: deploy-to-nonprod-vm
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Copy Compose manifest to the VM
        # `rm` is deliberately NOT set: the target directory also holds .env.nonprod, which
        # must never be recreated or deleted here -- the same prohibition production's own
        # SCP step carries above. No Caddyfile to transfer -- nonprod has none of its own;
        # production's Caddy already fronts it over the shared kanban-edge network.
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345  # v1.0.0
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_DEPLOY_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          fingerprint: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
          source: "docker-compose.nonprod.yml"
          target: "/opt/deploy/kanban-board-nonprod/"

      # CI-05 (Phase 9, plan 09-03): registration is a step inside THIS job's own SSH script,
      # not a separate job, deliberately -- this is the only position that makes CI-05's
      # "registration completes before that environment's app serves traffic" literally true
      # for nonprod. app-nonprod does not exist as a process until the final line below runs,
      # and a failed registration aborts this script -- via the explicit `set -e` at the top
      # of the script body (appleboy/ssh-action does NOT fail-fast by default; see that line's
      # own comment for the live-verification history) -- before that line is ever reached.
      # Reusing this job's existing SSH step also means registration reaches the broker over
      # the SAME nonprod-scoped deploy identity (deploy-nonprod, via the staging environment)
      # the deploy already uses (D-03) -- no second credential surface. `docker compose run`
      # honours `depends_on`, so the registrar cannot run against a broker that is not already
      # healthy.
      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.NETCUP_HOST }}
          username: ${{ secrets.NETCUP_DEPLOY_USER }}
          key: ${{ secrets.NETCUP_SSH_KEY }}
          fingerprint: ${{ secrets.NETCUP_HOST_FINGERPRINT }}
          script: |
            set -e
            # set -e (Phase 9, plan 09-03, live-verification fix, corrected twice -- see
            # deploy-to-netcup's full comment for the script_stop dead-end): without this,
            # appleboy/ssh-action runs the multi-line script below under a plain shell with no
            # `set -e` -- a failing `docker compose run` (the registrar, mid-script) does NOT
            # stop `up -d app-nonprod` on the next line from still running. Confirmed live twice:
            # a deliberately unreachable registry URL threw the expected IllegalStateException and
            # `docker compose run` exited 1 at the OS level (verified directly on the VM), yet
            # app-nonprod was recreated and started anyway both times -- once with no fix at all,
            # once with the silently-ignored `script_stop: true`. This is the mechanism that
            # actually makes CI-05's "registration completes before the app process exists"
            # guarantee for nonprod true, not just documented.
            cd /opt/deploy/kanban-board-nonprod
            # Exported, never a hardcoded or floating tag -- this project publishes no
            # `latest` tag on Docker Hub (Phase 8's first schema-registration attempt already
            # failed on exactly that assumption; docs/INFRA_RUNBOOK.md "Deviations from the
            # plan text"). The registrar invocation below reuses this same export -- do not
            # re-derive it and do not substitute a floating tag.
            export IMAGE_TAG=${{ needs.build-and-push-docker-image.outputs.image_tag }}
            # rudenkovladimir/kanban-board-backend-nonprod is a public Docker Hub repository
            # (confirmed live during plan 09-01 Task 2, is_private: false) -- no docker
            # login/registry credential is needed here to pull it. --env-file and --profile
            # are mandatory on every invocation: Compose auto-loads only a file literally
            # named .env, and without the profile flag Compose selects no service at all.
            # Broker brought up before the app -- not cosmetic, this is the insertion point
            # CI-05's schema registration (plan 09-03) needs, and it matches the order
            # Phase 8's manual bring-up proved.
            docker compose --env-file ./.env.nonprod -f docker-compose.nonprod.yml --profile nonprod pull app-nonprod
            docker compose --env-file ./.env.nonprod -f docker-compose.nonprod.yml --profile nonprod up -d redpanda-nonprod
            echo "Registering Avro schemas against the nonprod registry..."
            docker compose --env-file ./.env.nonprod -f docker-compose.nonprod.yml --profile nonprod run --rm --entrypoint java app-nonprod \
              -Dloader.main=com.vrudenko.kanban_board.config.AvroSchemaRegistrar \
              -cp app.jar org.springframework.boot.loader.launch.PropertiesLauncher http://redpanda-nonprod:8081
            docker compose --env-file ./.env.nonprod -f docker-compose.nonprod.yml --profile nonprod up -d app-nonprod

  # Bounded health poll (Phase 9, plan 09-02, Task 2) -- a nonprod deploy that starts containers
  # but never comes up must fail the workflow visibly, not report green over a dead stack (CI-04).
  # Deliberately a separate job, not a final step inside deploy-to-nonprod: sitting inside that
  # job would hold the deploy-to-nonprod-vm concurrency lock for the whole poll (up to 300s),
  # queueing a following push behind pure waiting for no reason (see 09-02-PLAN.md's
  # design_alternatives, Approach A, rejected on exactly this cost). No checkout -- this job reads
  # nothing from the repository, only a public, non-secret hostname held as a plain env literal.
  health-check-nonprod:
    needs: [ deploy-to-nonprod ]
    runs-on: ubuntu-latest
    if: success()
    environment: staging
    env:
      NONPROD_HEALTH_URL: https://kanban-board-rud-vlad-473-nonprod.duckdns.org/api/actuator/health
      ATTEMPTS: 30
      SLEEP_SECONDS: 10
    steps:
      - name: Poll nonprod health endpoint until 200
        run: |
          # Bound sized against docker-compose.nonprod.yml's real healthcheck numbers, not
          # 09-RESEARCH.md's illustrative 60s (its own Assumption A3 flags that figure as unsized
          # against real CI conditions). app-nonprod cannot be marked healthy by Compose before
          # start_period 30s, and can take up to start_period 30s + (interval 10s x retries 5) =
          # 80s -- and its clock only starts once redpanda-nonprod itself reports healthy
          # (depends_on: service_healthy). Add image-pull time on the VM, Flyway's migration pass,
          # and DNS/TLS latency from a GitHub-hosted runner, and 30 x 10s = 300s comfortably covers
          # that with margin. Per-attempt status lines are printed deliberately: the first few real
          # runs will produce a timing profile that can tighten this bound later.
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$NONPROD_HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Nonprod healthy after $i/$ATTEMPTS attempts."
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: status $STATUS, retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done
          echo "::error::Nonprod did not answer 200 within $ATTEMPTS attempts (bound: $((ATTEMPTS * SLEEP_SECONDS))s elapsed). Health poll exhausted -- failing the run."
          exit 1

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: [ deploy-to-netcup, build-and-push-docker-image, setup ]
    if: success()
    # Phase 9, plan 09-01, part C: this job resolves secrets.DOCKERHUB_TOKEN (production's copy).
    environment: production
    steps:
      # we need to do that because we only want to have a single active prod deployment for that project
      - name: Delete old Docker Hub images
        run: |
          # BUG FIXED (todo 2026-08-16-cleanup-old-images-delete-calls-rejected-unauthorized.md):
          # Docker Hub's Hub API v2 (hub.docker.com/v2, distinct from the Registry API v2 that
          # cleanup-unused-image below correctly token-exchanges against) rejects HTTP Basic auth
          # on mutating requests with {"message":"unauthorized"} -- confirmed live, run
          # 31963539949, 2026-08-16, 29/29 deletes rejected. The prior GET-with-Basic-auth
          # "succeeding" was not evidence Basic auth worked: this is a public repository, so an
          # unauthenticated GET on its tag list succeeds regardless of -u. Fixed by exchanging
          # credentials for a JWT via the documented /v2/users/login/ endpoint first, then sending
          # that as `Authorization: JWT <token>` on every authenticated call. Both list and delete
          # now check their HTTP status explicitly and fail loudly, rather than relying on a body
          # inspection that a 404 (the original bug) or 401 (this bug) would both silently pass.
          HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKERHUB_USER\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "::error::Docker Hub login-token exchange failed -- no token in response. Cannot prune tags."
            exit 1
          fi

          # Get list of all tags, following pagination -- Hub API v2 paginates at 10/page by
          # default. DISCOVERED LIVE (2026-08-17, first successful run after the auth fix above):
          # the unpaginated single-request version only ever saw page 1, so with 41 accumulated
          # tags it deleted just the 9 most recent non-current ones and silently left the other
          # 32 -- a real, previously-latent gap that only became visible once deletes started
          # actually succeeding. Follows `next` until null rather than a one-time page_size bump,
          # so this keeps working if the backlog ever exceeds one page's page_size again.
          TAGS=""
          NEXT_URL="https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name }}/tags/?page_size=100"
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            TAGS_HTTP_STATUS=$(curl -s -o /tmp/tags.json -w "%{http_code}" \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "$NEXT_URL")
            if [ "$TAGS_HTTP_STATUS" != "200" ]; then
              echo "::error::Listing tags failed with HTTP $TAGS_HTTP_STATUS: $(cat /tmp/tags.json)"
              exit 1
            fi
            TAGS="$TAGS $(jq -r '.results[].name' /tmp/tags.json)"
            NEXT_URL=$(jq -r '.next' /tmp/tags.json)
          done

          # Delete all tags except the current one
          FAILED=0
          for TAG in $TAGS; do
            if [ "$TAG" != "${{ needs.build-and-push-docker-image.outputs.image_tag }}" ]; then
              echo "Deleting tag: $TAG"
              DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response.json -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name }}/tags/$TAG/")
              if [ "$DELETE_HTTP_STATUS" != "204" ]; then
                echo "::warning::Delete of tag $TAG failed with HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response.json)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED tag deletion(s) failed -- see warnings above."
            exit 1
          fi

  # if deployment failed, we need to cleanup the image we pushed, because it won't be used
  cleanup-unused-image:
    runs-on: ubuntu-latest
    needs: [ deploy-to-netcup, build-and-push-docker-image, setup ]
    if: failure()
    # Phase 9, plan 09-01, part C: production's environment declaration, matching its sibling
    # jobs in this file (see PATTERNS.md / Task 3's mechanical environment-scoping assertion).
    environment: production
    steps:
      - name: Remove just-pushed image
        run: |
          echo "Deleting failed tag: ${{ needs.build-and-push-docker-image.outputs.image_tag }}"
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${{ needs.setup.outputs.base_image_name }}:pull,push" \
            | jq -r .token)
          DIGEST=$(curl -sI \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry-1.docker.io/v2/${{ needs.setup.outputs.base_image_name }}/manifests/${{ needs.build-and-push-docker-image.outputs.image_tag }}" \
            | awk '/Docker-Content-Digest/ {print $2}' | tr -d $'\r')
          # Completes the previously-truncated command (todo
          # 2026-08-04-re-enable-and-rewrite-the-disabled-deploy-job-after-phase-5.md):
          # deletion is by DIGEST here (this job's own variable, resolved above via the
          # manifest HEAD request), not by tag+basic-auth like cleanup-old-images --
          # the Docker Registry v2 API's DELETE-manifest endpoint at this host requires
          # the digest reference, which is exactly what TOKEN/DIGEST were computed for.
          #
          # Status check added (Phase 10, HARDEN item, this job's own comment previously flagged
          # this as Phase 10 scope -- see cleanup-unused-image-nonprod's identical, already-fixed
          # copy below). Before this, production issued this DELETE with no status inspection at
          # all, so whether it ever actually deleted anything was unproven in this repo's history.
          # Warn-only, mirroring the nonprod twin exactly: this job already runs on an
          # already-failing workflow (if: failure()), and turning it red here would mask the
          # original deploy failure it exists to clean up after -- never ::error::, never a
          # non-zero exit.
          DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response-unused.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry-1.docker.io/v2/${{ needs.setup.outputs.base_image_name }}/manifests/$DIGEST")
          case "$DELETE_HTTP_STATUS" in
            2??) echo "Manifest delete returned HTTP $DELETE_HTTP_STATUS." ;;
            *) echo "::warning::Manifest delete returned non-2xx HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response-unused.json)" ;;
          esac

  # Nonprod twin of cleanup-old-images (Phase 9, plan 09-02, Task 3, D-05). Nonprod deploys at the
  # same per-push rate as production and would otherwise accumulate tags identically. Gated on
  # health-check-nonprod, not on deploy-to-nonprod: "the nonprod deploy is complete" now materially
  # depends on the endpoint having actually answered (CI-04), not merely on the SSH script exiting
  # 0. Never deploy-to-netcup -- referencing production's deploy job here would fire nonprod's
  # sweep on production's success state, defeating CI-01's parallel-independence requirement.
  cleanup-old-images-nonprod:
    runs-on: ubuntu-latest
    needs: [ health-check-nonprod, build-and-push-docker-image, setup ]
    if: success()
    # Phase 9, plan 09-02, Task 3: this job resolves secrets.DOCKERHUB_TOKEN through the `staging`
    # environment -- nonprod's copy of the account-wide token (see Plan 09-01's T-09-09).
    environment: staging
    steps:
      - name: Delete old Docker Hub images (nonprod repository)
        run: |
          # A copy of cleanup-old-images with exactly one axis changed: every repository-name
          # interpolation below reads setup's nonprod-repository job output, never hand-typed --
          # the production delete-URL bug fixed 2026-08-17 was exactly a hand-typed, missing
          # repository path segment (docs/INFRA_RUNBOOK.md). Both already-fixed Docker Hub bugs
          # are inherited in their fixed form: the JWT login-token exchange (2026-08-16 fix) and
          # the follow-`next`-until-null pagination loop (2026-08-17 fix).
          HUB_TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"$DOCKERHUB_USER\", \"password\": \"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            "https://hub.docker.com/v2/users/login/" | jq -r .token)
          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "::error::Docker Hub login-token exchange failed -- no token in response. Cannot prune nonprod tags."
            exit 1
          fi

          TAGS=""
          NEXT_URL="https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name_nonprod }}/tags/?page_size=100"
          while [ -n "$NEXT_URL" ] && [ "$NEXT_URL" != "null" ]; do
            TAGS_HTTP_STATUS=$(curl -s -o /tmp/tags-nonprod.json -w "%{http_code}" \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "$NEXT_URL")
            if [ "$TAGS_HTTP_STATUS" != "200" ]; then
              echo "::error::Listing nonprod tags failed with HTTP $TAGS_HTTP_STATUS: $(cat /tmp/tags-nonprod.json)"
              exit 1
            fi
            TAGS="$TAGS $(jq -r '.results[].name' /tmp/tags-nonprod.json)"
            NEXT_URL=$(jq -r '.next' /tmp/tags-nonprod.json)
          done

          # Delete all tags except the current one
          FAILED=0
          for TAG in $TAGS; do
            if [ "$TAG" != "${{ needs.build-and-push-docker-image.outputs.image_tag }}" ]; then
              echo "Deleting tag: $TAG"
              DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response-nonprod.json -w "%{http_code}" -X DELETE \
                -H "Authorization: JWT ${HUB_TOKEN}" \
                "https://hub.docker.com/v2/repositories/${{ needs.setup.outputs.base_image_name_nonprod }}/tags/$TAG/")
              if [ "$DELETE_HTTP_STATUS" != "204" ]; then
                echo "::warning::Delete of nonprod tag $TAG failed with HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response-nonprod.json)"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED nonprod tag deletion(s) failed -- see warnings above."
            exit 1
          fi

  # Nonprod twin of cleanup-unused-image (Phase 9, plan 09-02, Task 3, D-06). Mirrors production's
  # needs: shape literally, for parity: fires when the nonprod deploy job itself fails (not when
  # health-check-nonprod fails), deleting the tag that will never be used.
  cleanup-unused-image-nonprod:
    runs-on: ubuntu-latest
    needs: [ deploy-to-nonprod, build-and-push-docker-image, setup ]
    if: failure()
    # Phase 9, plan 09-02, Task 3: nonprod's environment declaration, matching its sibling jobs.
    environment: staging
    steps:
      - name: Remove just-pushed image (nonprod repository)
        run: |
          echo "Deleting failed nonprod tag: ${{ needs.build-and-push-docker-image.outputs.image_tag }}"
          TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${{ needs.setup.outputs.base_image_name_nonprod }}:pull,push" \
            | jq -r .token)
          DIGEST=$(curl -sI \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry-1.docker.io/v2/${{ needs.setup.outputs.base_image_name_nonprod }}/manifests/${{ needs.build-and-push-docker-image.outputs.image_tag }}" \
            | awk '/Docker-Content-Digest/ {print $2}' | tr -d $'\r')
          # Deliberate addition over production's original (Phase 9, plan 09-02, Task 3, part B):
          # production's copy issues this DELETE with no status check at all, so whether it has
          # ever actually deleted anything is unproven in this repository's history. This job adds
          # a status check but only ever warns, never fails, on a non-2xx -- this job already runs
          # on an already-failing workflow (if: failure()), and turning it red here would mask the
          # original deploy failure. Fixing both copies for real is Phase 10 CI-hardening scope.
          DELETE_HTTP_STATUS=$(curl -s -o /tmp/delete-response-nonprod-unused.json -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $TOKEN" \
            "https://registry-1.docker.io/v2/${{ needs.setup.outputs.base_image_name_nonprod }}/manifests/$DIGEST")
          case "$DELETE_HTTP_STATUS" in
            2??) echo "Nonprod manifest delete returned HTTP $DELETE_HTTP_STATUS." ;;
            *) echo "::warning::Nonprod manifest delete returned non-2xx HTTP $DELETE_HTTP_STATUS: $(cat /tmp/delete-response-nonprod-unused.json)" ;;
          esac