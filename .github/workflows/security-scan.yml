# Dependency vulnerability scan (OWASP dependency-check-gradle, quick task 260813-q1i, Task 5).
#
# Deliberately a separate workflow, not a job inside deploy.yml:
#   - Not on deploy.yml's `run-tests` job: that job gates the Docker build and (once Phase 5
#     re-enables it) the production deploy. Wiring the scan there means a newly-published
#     Tomcat/Spring CVE would block an unrelated production deploy the moment it publishes.
#   - Not in .githooks/pre-commit: that hook exists to catch what the committer authored --
#     spotlessCheck and fastTest are both hermetic, pure functions of the tree. A new CVE in a
#     transitive dependency is not something the committer wrote, and the scan is network-bound
#     and by far the heaviest task in this build (see build.gradle's plugin-block comment).
#
# This is also the first workflow in this repo whose verdict is not a pure function of the
# commit: an NVD outage or a fresh advisory publication can turn a job red days after the
# triggering commit landed, with zero code change. That is the intent, not a bug -- see the
# preflight step and build.gradle's dependencyCheck comment for the full reasoning.
name: Dependency Vulnerability Scan

on:
  workflow_dispatch: {}
  # Weekly matches dependency-check's own recommended cadence for keeping incremental NVD
  # updates cheap (dependency-check.github.io/DependencyCheck/data/index.html). Ships active,
  # not commented out: NVD_API_KEY was confirmed present as a repository secret and Dependabot
  # vulnerability alerts were confirmed enabled (both read-only `gh` checks, quick task
  # 260813-q1i, Task 3 resume) before this workflow was added.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    # Runaway guard, not a runtime prediction -- this repo has no measured dependencyCheckAnalyze
    # runtime yet (260813-q1i-MEASUREMENTS.md: no NVD_API_KEY was available locally, so no local
    # run was attempted). RESEARCH.md's ~1min-warm/~11min-cold figures are a third-party 2026
    # benchmark against a different, larger repository, not a measurement of this one.
    timeout-minutes: 45
    steps:
      # Fails in seconds, loudly, naming exactly what is missing -- the difference between "loudly
      # not configured" and "silently reporting nothing." Without an NVD API key, dependency-check's
      # update requests are throttled to an ~8000ms inter-request delay (vs ~3500ms with one),
      # turning an initial full database population from minutes into hours -- long enough to
      # exceed this job's own timeout, which would otherwise look identical to "ran and found
      # nothing" from the Actions UI.
      # env:-indirected (not textual ${{ }} interpolation) so a stored value containing a quote,
      # backslash, or newline reaches the shell as a variable, never as substituted script text --
      # GitHub Actions renders ${{ }} into the run: script's source before any shell parses it, so
      # textual interpolation is both a script-injection surface and makes this exact [ -z ] test
      # test whether the substituted text happened to parse as shell, not genuine emptiness.
      - name: Verify NVD_API_KEY is configured
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY repository secret is not set. Request a free key at" \
              "https://nvd.nist.gov/developers/request-an-api-key and add it via" \
              "'gh secret set NVD_API_KEY' or GitHub -> Settings -> Secrets and variables ->" \
              "Actions -> New repository secret. Without it, NVD API throttling turns a cold" \
              "database population from minutes into hours, exceeding this job's timeout."
            exit 1
          fi

      # TEMPORARY (10-03-PLAN.md Task 2) -- diagnoses why secrets.NVD_API_KEY resolves empty in
      # this job without ever disclosing the value itself. Removed in Task 3 once the root cause is
      # applied and confirmed by a green dependencyCheckAnalyze run: the fix ships, the probe does
      # not. Bound to a differently-named env var (SECRET_VALUE, not NVD_API_KEY) so this probe is
      # unambiguously distinct from the two load-bearing NVD_API_KEY env bindings elsewhere in
      # this file (the preflight above and the analyze step below). Emits only non-reversible
      # facts -- byte length,
      # non-printable character count, and two truncated (16-hex-char) SHA-256 digests (raw and
      # whitespace-stripped) -- which is sufficient to distinguish "genuinely unset", "set but
      # empty", "surrounding whitespace or an embedded control character", and "value is intact"
      # without the log ever carrying anything the value could be recovered from. GitHub masks the
      # exact secret string but not anything derived from it, so this output ceiling is enforced
      # here, not by the platform. Non-fatal by design: the script itself exits 0 at the end (not
      # `continue-on-error`, which this file's posture explicitly rejects -- see the analyze step's
      # own comment) so dependencyCheckAnalyze's own behaviour is also observed in this same run.
      - name: TEMPORARY -- Diagnose NVD_API_KEY resolution
        env:
          SECRET_VALUE: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "${SECRET_VALUE+x}" ]; then
            echo "NVD_API_KEY: variable is UNSET (not merely empty)."
          elif [ -z "$SECRET_VALUE" ]; then
            echo "NVD_API_KEY: variable is SET but resolves to an empty string."
          else
            echo "NVD_API_KEY: variable is set and non-empty."
          fi
          LENGTH=$(printf '%s' "$SECRET_VALUE" | wc -c)
          echo "NVD_API_KEY byte length: $LENGTH"
          NONPRINTABLE=$(printf '%s' "$SECRET_VALUE" | tr -d '[:print:]' | wc -c)
          echo "NVD_API_KEY non-printable character count: $NONPRINTABLE"
          RAW_DIGEST=$(printf '%s' "$SECRET_VALUE" | sha256sum | cut -c1-16)
          echo "NVD_API_KEY truncated digest (raw value): $RAW_DIGEST"
          STRIPPED=$(printf '%s' "$SECRET_VALUE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          STRIPPED_DIGEST=$(printf '%s' "$STRIPPED" | sha256sum | cut -c1-16)
          echo "NVD_API_KEY truncated digest (whitespace-stripped): $STRIPPED_DIGEST"
          exit 0

      - name: Checkout code
        uses: actions/checkout@v5

      # temurin, matching deploy.yml's run-tests job: both workflows deliberately pin the same
      # JDK distribution and the same action majors (HARDEN-06), so this file's Java setup is
      # intended to stay in step with deploy.yml rather than drift, as it did until this fix.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant permission to gradlew
        run: chmod +x gradlew

      # Keyed on the plugin version (12.2.2) so a future plugin bump invalidates a stale cache
      # rather than silently reusing an incompatible database. Path observed live via
      # `./gradlew dependencyCheckPurge --info` against this exact plugin version
      # (260813-q1i-MEASUREMENTS.md, Task 4) -- ~/.gradle/dependency-check-data, which on this
      # ubuntu-latest runner's GRADLE_USER_HOME resolves to
      # /home/runner/.gradle/dependency-check-data. Cached at the parent directory rather than
      # its schema-versioned subdirectory (observed as 11.0/ locally) since that subdirectory
      # name is the H2 database's own internal schema version, not the plugin version, and could
      # change independently of a 12.2.2 pin.
      - name: Cache dependency-check data directory
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-12.2.2

      - name: Run dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze
        # No continue-on-error: true. The scan is report-only at the Gradle level
        # (failBuildOnCVSS = 11 in build.gradle), so findings alone will not fail this step -- a
        # job failure here means the scan genuinely could not run (network, NVD outage, plugin
        # error), which is exactly the thing that should stay visible rather than being swallowed.

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: warn
