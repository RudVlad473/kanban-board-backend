# Dependabot version updates: the remediating half of security-scan.yml's dependency-check-gradle.
#
# Dependency-check reports advisories; Dependabot opens the PR that closes them, addressing the "BOM is N
# patches stale" root cause rather than only reporting it.
#
# Decisions:
# This file configures *version updates* only. Dependabot *security alerts* are a separate repository
# setting, confirmed enabled with a read-only `gh api repos/:owner/:repo/vulnerability-alerts` check (204).
# The github-actions ecosystem entry keeps workflow action references maintained instead of frozen:
# Dependabot updates a SHA pin and its adjacent version comment together when it opens a bump PR.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group every gradle update into ONE PR: gradle/verification-metadata.xml makes each gradle PR fail CI
    # until it is regenerated and committed with the bump.
    #
    # Ungrouped, that chore (and its CI run) repeats once per dependency; grouped, one regeneration and one CI
    # run cover the batch. `patterns: ["*"]` is deliberate: there is no major/minor split, since the
    # regeneration cost is per PR, not per version jump.
    groups:
      gradle-updates:
        patterns:
          - "*"
    # Cap on open PRs from an automated actor; every Dependabot PR still runs deploy.yml's run-tests job,
    # so nothing merges untested. A backstop for updates found on different runs before an earlier group PR
    # merges.
    open-pull-requests-limit: 2
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same cap as the gradle entry above.
    open-pull-requests-limit: 5
